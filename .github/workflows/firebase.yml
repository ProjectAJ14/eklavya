name: Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/eklavya-runtime.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

# A queued deploy waits rather than publishing on top of one that is still
# uploading. This is the only host, and should stay that way: Astro's `base` is
# fixed at build time, so one build cannot serve a root and a subfolder host.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The landing page is still hand-written HTML (web/public), but the manual
      # is Starlight, so the site is built before it ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EKLAVYA_RUN }}
          projectId: eklavya-run
          channelId: live

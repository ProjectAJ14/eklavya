            <td class="num">${s.logged.length}</td>
            <td class="num">${s.asked.length}</td>
            <td class="num">${s.passed}</td>
            <td class="num slug">${esc(ago(s.last))}</td></tr>`)),
      { aside: `<a class="link" data-go="${esc(href(CUR.wf, 'sessions'))}">All ${sess.length} sessions →</a>` }),
  ].join('');
}

/** The state filter lives in the hash — `#/concepts/due` is a link worth having. */
const CONCEPT_STATES = ['all', 'due', 'learning', 'mastered', 'unseen'];

function viewConcepts(param) {
  const t = T.concepts;
  t.state = CONCEPT_STATES.includes(param) ? param : 'all';
  t.domain = CUR.query.get('domain') || 'all';
  const all = conceptsInScope();
  const domains = [...new Set(all.map((c) => c.domain))].sort();
  const q = t.q.trim().toLowerCase();

  let list = all.filter((c) => {
    if (t.state === 'mastered' && !c.mastered) return false;
    if (t.state === 'learning' && (!c.seen || c.mastered)) return false;
    if (t.state === 'due' && !c.due) return false;
    if (t.state === 'unseen' && c.seen) return false;
    if (t.domain !== 'all' && c.domain !== t.domain) return false;
    if (q && !(`${c.name} ${c.slug} ${c.domain} ${c.context ?? ''}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const SORTS = {
    weakest: (a, b) => (a.seen === b.seen ? a.score - b.score || b.attempts - a.attempts : a.seen ? -1 : 1),
    strongest: (a, b) => b.score - a.score,
    recent: (a, b) => String(b.last_seen ?? '').localeCompare(String(a.last_seen ?? '')),
    asked: (a, b) => b.attempts - a.attempts,
    name: (a, b) => a.name.localeCompare(b.name),
    tier: (a, b) => a.tier - b.tier || a.name.localeCompare(b.name),
  };
  list = [...list].sort(SORTS[t.sort] ?? SORTS.weakest);

  const p = page('concepts', list.length);
  const rows = slice(list, p).map((c) => `
    <tr class="row" data-go="${esc(LH('concept', c.slug))}">
      <td style="min-width:210px"><span class="title">${esc(c.name)}</span>
        <div class="slug">${esc(c.slug)}</div></td>
      <td><span class="pill">${esc(c.domain)}</span></td>
      <td class="slug" style="white-space:nowrap">${esc(tierLabel(c.tier))}</td>
      <td style="min-width:104px">${c.seen ? meter(c.score * 100, c.score < 0.5 ? 'warn' : '') +
        `<div class="slug">${Math.round(c.score * 100)}%</div>` : '<span class="slug">—</span>'}</td>
      <td class="num">${c.attempts || '—'}</td>
      <td>${statePill(c)}</td>
      <td class="ctx" style="min-width:220px">${esc(c.context ?? '')}</td>
    </tr>`);

  const counts = {
    all: all.length,
    due: all.filter((c) => c.due).length,
    learning: all.filter((c) => c.seen && !c.mastered).length,
    mastered: all.filter((c) => c.mastered).length,
    unseen: all.filter((c) => !c.seen).length,
  };
  const chip = (k, label) => `<button class="chip" data-state="${k}" aria-pressed="${t.state === k}">${label} ${counts[k]}</button>`;

  return [
    `<div>
       <h1 class="page__title">Concepts</h1>
       <p class="page__sub">Everything in your graph — what you have been asked, and what is still just catalogue.
         Open one to see every question you were given on it.</p>
     </div>`,
    card(null, null,
      `<div class="filters">
         <div class="grow"><input type="search" id="q" value="${esc(t.q)}" placeholder="Search name, slug, domain or context…" aria-label="Search concepts"></div>
         <select id="dom" aria-label="Domain">
           <option value="all">All domains</option>
           ${domains.map((d) => `<option value="${esc(d)}"${t.domain === d ? ' selected' : ''}>${esc(d)}</option>`).join('')}
         </select>
         <select id="sort" aria-label="Sort">
           ${[['weakest','Weakest first'],['strongest','Strongest first'],['recent','Recently seen'],['asked','Most asked'],['tier','By tier'],['name','A–Z']]
             .map(([v, l]) => `<option value="${v}"${t.sort === v ? ' selected' : ''}>${l}</option>`).join('')}
         </select>
       </div>
       <div class="chips" id="chips">
         ${chip('all','All')}${chip('due','Due')}${chip('learning','Learning')}${chip('mastered','Mastered')}${chip('unseen','Not asked')}
       </div>
       <div style="margin-top:var(--space-4)">
         ${table([{t:'Concept'},{t:'Domain'},{t:'Tier'},{t:'Score'},{t:'Asked',n:1},{t:'State'},{t:'From your code'}], rows)}
         ${pager('concepts', list.length, p)}
       </div>`),
  ].join('');
}

function viewConcept(slug) {
  const c = S.concepts.find((x) => x.slug === slug);
  if (!c) return `<p class="empty">No concept called <code>${esc(slug)}</code>. <a class="link" data-go="${esc(LH('concepts'))}">Back to concepts</a>.</p>`;

  const atts = S.attempts.filter((a) => a.slug === slug);
  // A logged row with no context line is a bookkeeping row, not a memory: it
  // would render as a date attached to nothing.
  const ctx = S.logged.filter((l) => l.slug === slug && l.context && String(l.context).trim());
  const byName = new Map(S.concepts.map((x) => [x.slug, x]));
  const links = (slugs) => slugs.length
    ? `<div class="tags">` + slugs.map((s) => `<a class="pill link" data-go="${esc(LH('concept', s))}">${esc(byName.get(s)?.name ?? s)}</a>`).join('') + `</div>`
    : '<p class="slug" style="margin:0">None recorded.</p>';

  const p = page('concept', atts.length, 5);
  const history = slice(atts, p, 5).map((a) => {
    let opts = [];
    try { opts = a.options ? JSON.parse(a.options) : []; } catch { opts = []; }
    return `<article class="qa">
      <div class="qa__meta">
        <span>${esc(fmtDate(a.ts))}</span><span>${esc(tierLabel(a.tier))}</span>
        ${a.format ? `<span>${esc(a.format)}</span>` : ''}${a.level ? `<span>${esc(a.level)}</span>` : ''}
        ${a.repo ? `<span>${esc(pname(a.repo, a.session_id))}</span>` : ''}
        <span class="sp">${gradeBadge(a)}</span>
      </div>
      <p class="qa__q">${esc(a.question)}</p>
      ${opts.length ? `<ul class="qa__opts">${opts.map((o) =>
        `<li class="${a.answer && o === a.answer ? 'picked' : ''}">${esc(o)}</li>`).join('')}</ul>` : ''}
      ${a.answer && !opts.length ? `<p class="qa__a"><b>You said:</b> ${esc(a.answer)}</p>` : ''}
      ${a.feedback ? `<p class="qa__f">${esc(a.feedback)}</p>` : ''}
    </article>`;
  }).join('');

  if (atts.length) chart('c-grades', (el) => chartGrades(el, atts));
  const decayed = c.stored_score > c.score;

  return [
    `<div>
       <a class="page__back" data-go="${esc(LH('concepts'))}">← Concepts</a>
       <h1 class="page__title">${esc(c.name)}</h1>
       <p class="page__sub"><code class="slug">${esc(c.slug)}</code> · ${esc(c.domain)} · ${esc(tierLabel(c.tier))} ·
         ${esc(c.source === 'seed' ? 'from the seed graph' : 'minted from your work')}
         ${c.description ? '<br>' + esc(c.description) : ''}</p>
     </div>`,

    tiles([
      ['Score', c.seen ? Math.round(c.score * 100) + '%' : '—', decayed ? `decayed from ${Math.round(c.stored_score * 100)}%` : 'recency-weighted last 5 grades', c.mastered ? 'good' : c.score < 0.5 && c.seen ? 'warn' : ''],
      ['State', c.mastered ? 'mastered' : c.seen ? (c.due ? 'due' : 'learning') : 'not asked', c.seen ? `${c.passed} of ${c.attempts} right` : 'no questions yet', c.due ? 'warn' : ''],
      ['Next review', c.seen ? whenDue(c.next_review) : '—', c.interval_d ? `interval ${Math.round(c.interval_d)}d` : 'not scheduled', c.due ? 'warn' : ''],
      ['Reps', c.reps, `ease ${c.ease ? c.ease.toFixed(2) : '—'}`],
    ]),

    atts.length
      ? card('How the grades went', 'Every graded answer in order. Grey points are skips and blanks.',
          `<div class="chart"><svg id="c-grades" role="img" aria-label="Grades over time for this concept"></svg></div>`)
      : '',

    card('Where this came from', 'The code that logged it — the memory the slug hangs on.',
      ctx.length
        ? `<div class="list">` + ctx.slice(0, 12).map((l) => `
            <div>
              <div class="ctx">${esc(l.context ?? '')}</div>
              <div class="slug">${esc(ago(l.ts))} · ${esc(pname(l.repo, l.session_id))} · ${esc(l.origin ?? 'work')} ·
                <a class="link" data-go="${esc(sessHref(l.session_id))}">that session</a></div>
            </div>`).join('') + `</div>`
        : '<p class="empty">No context recorded — this one came from the seed graph.</p>'),

    card(`Every question you were asked`, atts.length ? `${plural(atts.length, 'attempt')}, newest first.` : '',
      atts.length ? history + pager('concept', atts.length, p, 5)
        : '<p class="empty">Not asked yet. It will come up when your work touches it.</p>'),

    `<div class="g3">
       ${card('Prerequisites', 'Asked first when the graph plans a session.', links(c.prereqs))}
       ${card('Unlocks', 'These lean on this one.', links(c.unlocks))}
       ${card('Related', 'Same neighbourhood.', links(c.related))}
     </div>`,
  ].join('');
}

const REVIEW_TABS = ['due', 'upcoming', 'skipped'];

function viewReview(param) {
  const t = T.review;
  t.tab = REVIEW_TABS.includes(param) ? param : 'due';
  const seen = seenConcepts();
  const due = seen.filter((c) => c.due).sort((a, b) => (b.overdue_days ?? 0) - (a.overdue_days ?? 0));
  const upcoming = seen.filter((c) => !c.due && c.next_review)
    .sort((a, b) => String(a.next_review).localeCompare(String(b.next_review)));
  const skipped = attemptsInScope().filter((a) => a.outcome === 'declined' || a.outcome === 'dont_know');

  // Fourteen days of scheduled reviews, with everything already overdue in one
  // column — a backlog that grows off the left of the chart is a backlog nobody
  // sees.
  const buckets = [{ label:'Overdue', short:'late', n:due.length, overdue:true }];
  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() + i);
    const k = dayKey(d);
    buckets.push({
      label: i === 0 ? 'Today' : fmtDay(k),
      short: i === 0 ? 'today' : String(fromKey(k).getUTCDate()),
      n: upcoming.filter((c) => String(c.next_review).slice(0, 10) === k).length,
      overdue: false,
    });
  }
  chart('c-forecast', (el) => chartForecast(el, buckets));

  const tabs = [['due', `Due now ${due.length}`], ['upcoming', `Upcoming ${upcoming.length}`], ['skipped', `Skipped ${skipped.length}`]];
  const list = t.tab === 'due' ? due : t.tab === 'upcoming' ? upcoming : skipped;
  const p = page('review', list.length);
  const rows = slice(list, p).map((x) => t.tab === 'skipped'
    ? `<tr class="row" data-go="${esc(LH('concept', x.slug))}">
         <td><span class="title">${esc(x.name)}</span><div class="slug">${esc(x.slug)}</div></td>
         <td><span class="pill">${x.outcome === 'declined' ? 'declined' : 'blanked'}</span></td>
         <td class="ctx" style="min-width:280px">${esc(x.question)}</td>
         <td class="num slug">${esc(ago(x.ts))}</td></tr>`
    : `<tr class="row" data-go="${esc(LH('concept', x.slug))}">
         <td><span class="title">${esc(x.name)}</span><div class="slug">${esc(x.slug)} · ${esc(x.domain)}</div></td>
         <td style="min-width:104px">${meter(x.score * 100, x.score < 0.5 ? 'warn' : '')}
           <div class="slug">${Math.round(x.score * 100)}%</div></td>
         <td class="num">${x.attempts}</td>
         <td class="slug" style="white-space:nowrap">${esc(tierLabel(x.tier))}</td>
         <td class="num slug">${esc(whenDue(x.next_review))}</td></tr>`);

  const cols = t.tab === 'skipped'
    ? [{t:'Concept'},{t:'How'},{t:'The question'},{t:'When',n:1}]
    : [{t:'Concept'},{t:'Score'},{t:'Asked',n:1},{t:'Tier'},{t:t.tab === 'due' ? 'Overdue' : 'Due',n:1}];

  return [
    `<div>
       <h1 class="page__title">Review queue</h1>
       <p class="page__sub">SM-2 decides when a concept comes back: one day after a miss, then 6, then the
         interval times its ease. A score decays about 5% a week while a review is overdue, so this list is
         also the list of things quietly getting weaker.</p>
     </div>`,

    tiles([
      ['Due now', due.length, due.length ? 'run /eklavya:quiz' : 'nothing waiting', due.length ? 'warn' : 'good'],
      ['Next 7 days', buckets.slice(1, 8).reduce((a, b) => a + b.n, 0), 'scheduled reviews'],
      ['Skipped', skipped.length, 'come back a tier lower'],
      ['Longest overdue', due.length ? plural(Math.max(...due.map((c) => c.overdue_days ?? 0)), 'day') : '—', 'since it was due'],
    ]),

    card('The next fortnight', 'How much review is already scheduled, day by day.',
      `<div class="chart"><svg id="c-forecast" role="img" aria-label="Scheduled reviews for the next fourteen days"></svg></div>`),

    card(null, null,
      `<div class="chips" id="tabs">` + tabs.map(([k, label]) =>
        `<button class="chip" data-tab="${k}" aria-pressed="${t.tab === k}">${esc(label)}</button>`).join('') + `</div>
       <div style="margin-top:var(--space-4)">${table(cols, rows)}${pager('review', list.length, p)}</div>`),
  ].join('');
}

function viewSessions() {
  // Learning's sessions: the ones that logged a concept or asked a question.
  // A session that only captured memory is the Memory workflow's, and is
  // counted here so it is never silently missing.
  const every = sessions();
  const all = every.filter((s) => s.logged.length || s.asked.length);
  const memOnly = every.length - all.length;
  const p = page('sessions', all.length);
  const rows = slice(all, p).map((s) => {
    const acc = s.asked.length ? pct(s.passed, s.asked.length) : null;
    return `<tr class="row" data-go="${esc(sessHref(s.id))}">
      <td style="min-width:260px"><span class="title">${esc(pname(s.repo, s.id))}</span>
        <div class="slug">${esc(sessionLabel(s).slice(0, 120))}</div></td>
      <td class="num">${s.logged.filter((l) => (l.origin ?? 'work') === 'work').length}</td>
      <td class="num">${s.asked.length}</td>
      <td style="min-width:96px">${acc === null ? '<span class="slug">not assessed</span>'
        : meter(acc, acc < 70 ? 'warn' : '') + `<div class="slug">${acc}%</div>`}</td>
      <td class="num slug">${esc(stamp(s.last))}</td></tr>`;
  });

  const withQuestions = all.filter((s) => s.asked.length).length;
  return [
    `<div>
       <h1 class="page__title">Sessions</h1>
       <p class="page__sub">One row per Claude Code session that logged a concept or asked a question. Open one
         for the whole thread: the concepts the work touched, every question you were asked, and — joined on the
         same session id — what the session captured and remembered.</p>
     </div>`,
    tiles([
      ['Sessions', all.length, 'that logged or asked'],
      ['With questions', withQuestions, `${pct(withQuestions, all.length)}% of sessions`],
      ['Concepts logged', all.reduce((a, s) => a + s.logged.filter((l) => (l.origin ?? 'work') === 'work').length, 0), 'context lines recorded'],
      ['Answers', all.reduce((a, s) => a + s.asked.length, 0), 'across every session'],
    ]),
    card(null, null,
      table([{t:'Session'},{t:'Logged',n:1},{t:'Asked',n:1},{t:'Accuracy'},{t:'When',n:1}], rows)
      + pager('sessions', all.length, p)
      + (memOnly ? `<p class="slug" style="margin:var(--space-4) 0 0">${plural(memOnly, 'session')} captured memory and logged no concept —
          <a class="link" data-go="${esc(MH('sessions'))}">see them in Memory → Sessions</a>.</p>` : '')),
  ].join('');
}

const noSession = (id) => `<p class="empty">No session <code>${esc(id)}</code> in this scope.
    <a class="link" data-go="${esc(href(CUR.wf, 'sessions'))}">Back to sessions</a>.</p>`;

/**
 * One session, from either workflow. Shared rendering: the learning half and
 * the memory half of a session are joined on the session id the host handed
 * both, which is the one association between them that is recorded rather
 * than inferred. The back link and the sidebar stay in the workflow the reader
 * came from.
 */
function viewSession(id) {
  const s = sessions().find((x) => x.id === id);
  if (s) return sessionBody(s);
  // Not in the payload: a memory-only session past `memory_sessions`' cap, or
  // one outside the current scope. The paged resource answers for it exactly.
  fill('sess-lookup', '/api/memory/sessions?' + memScope(new URLSearchParams({ session: id })), (d) => {
    const row = d.rows[0];
    if (!row) return noSession(id);
    return sessionBody({ id, repo: row.project, logged: [], asked: [], mem: row, first: row.first, last: row.last, passed: 0 });
  });
  return `<div class="stack" id="sess-lookup"><p class="empty">Looking up this session…</p></div>`;
}

function sessionBody(s) {
  const id = s.id;

  const byName = new Map(S.concepts.map((c) => [c.slug, c]));
  const work = s.logged.filter((l) => (l.origin ?? 'work') === 'work');
  const review = s.logged.filter((l) => l.origin === 'review');

  const conceptRow = (l) => {
    const c = byName.get(l.slug);
    return `<tr class="row" data-go="${esc(LH('concept', l.slug))}">
      <td style="min-width:190px"><span class="title">${esc(c?.name ?? l.slug)}</span>
        <div class="slug">${esc(l.slug)} · ${esc(l.domain)}</div></td>
      <td class="ctx" style="min-width:280px">${esc(l.context ?? '')}</td>
      <td>${c ? statePill(c) : ''}</td></tr>`;
  };

  const qa = s.asked.slice().reverse().map((a) => {
    let opts = [];
    try { opts = a.options ? JSON.parse(a.options) : []; } catch { opts = []; }
    return `<article class="qa">
      <div class="qa__meta">
        <a class="link" data-go="${esc(LH('concept', a.slug))}">${esc(a.name)}</a>
        <span>${esc(tierLabel(a.tier))}</span>${a.level ? `<span>${esc(a.level)}</span>` : ''}
        <span class="sp">${gradeBadge(a)}</span>
      </div>
      <p class="qa__q">${esc(a.question)}</p>
      ${opts.length ? `<ul class="qa__opts">${opts.map((o) =>
        `<li class="${a.answer && o === a.answer ? 'picked' : ''}">${esc(o)}</li>`).join('')}</ul>` : ''}
      ${a.answer && !opts.length ? `<p class="qa__a"><b>You said:</b> ${esc(a.answer)}</p>` : ''}
      ${a.feedback ? `<p class="qa__f">${esc(a.feedback)}</p>` : ''}
    </article>`;
  }).join('');

  // The memory half of this session, in the order it happened: evidence in,
  // observations out, candidates proposed — then the questions above.
  if (s.mem) {
    fill('sess-mem', '/api/memory?per=100&session=' + encodeURIComponent(id), (d) => {
      const entries = d.rows.map((e) => `
        <tr class="row${e.deleted_at || e.superseded_by ? ' gone' : ''}" data-go="${esc(MH('entry', e.id))}">
          <td class="slug" style="white-space:nowrap">${esc(stamp(e.occurred_at))}</td>
          <td style="min-width:260px"><span class="title">${esc(e.title)}</span>
            <div class="ctx">${esc(e.snippet ?? '')}</div></td>
          <td><span class="pill">${esc(e.type ?? e.kind)}</span></td>
          <td class="num">${e.event_count}</td>
          <td>${entryMark(e)}</td></tr>`);
      const cands = (d.candidates ?? []).map((c) => {
        const go = c.concept_slug ? ` class="row" data-go="${esc(LH('concept', c.concept_slug))}"` : '';
        return `<tr${go}><td><span class="title">${esc(c.name ?? c.slug)}</span><div class="slug">${esc(c.slug)}</div></td>
          <td><span class="pill">${esc(c.domain ?? '—')}</span></td>
          <td class="num">${Math.round((c.confidence ?? 0) * 100)}%</td>
          <td><span class="pill${c.status === 'accepted' ? ' ok' : ''}">${esc(c.status)}</span></td></tr>`;
      });
      return card('What the session remembered', 'Observations distilled from the evidence this session captured.',
          table([{t:'When'},{t:'Observation'},{t:'Type'},{t:'Evidence',n:1},{t:''}], entries))
        + card('Concepts it proposed', 'Derived from evidence, and still only a proposal — nothing here moved mastery.',
          table([{t:'Candidate'},{t:'Domain'},{t:'Confidence',n:1},{t:'Status'}], cands));
    });
  }

  return [
    `<div>
       <a class="page__back" data-go="${esc(href(CUR.wf, 'sessions'))}">← Sessions</a>
       <h1 class="page__title">${esc(pname(s.repo, s.id))}</h1>
       <p class="page__sub">${esc(stamp(s.first))} → ${esc(stamp(s.last))} · <code class="slug">${esc(s.id)}</code></p>
     </div>`,
    tiles([
      ['Captured', s.mem ? s.mem.events : 0, s.mem && s.mem.redacted ? `${s.mem.redacted} redacted` : 'evidence events'],
      ['Remembered', s.mem ? s.mem.entries : 0, 'observations written'],
      ['Logged', s.logged.length, 'concepts the work touched'],
      ['Asked', s.asked.length, s.asked.length ? `${s.passed} right` : 'no questions in this one'],
      ['Accuracy', s.asked.length ? pct(s.passed, s.asked.length) + '%' : '—', 'in this session',
        s.asked.length && pct(s.passed, s.asked.length) >= 70 ? 'good' : ''],
      ['Review pulled in', review.length, 'from earlier work'],
    ]),
    s.mem ? `<div class="stack" id="sess-mem"><p class="empty">Loading what this session remembered…</p></div>` : '',
    card('What the work taught', 'Each line is what the agent said the concept was for, in the code it wrote.',
      table([{t:'Concept'},{t:'What you did'},{t:'State now'}], work.map(conceptRow))),
    review.length
      ? card('Pulled in for review', 'Not from this diff — the tutor widened to prerequisites and neighbours.',
          table([{t:'Concept'},{t:'Context'},{t:'State now'}], review.map(conceptRow)))
      : '',
    card('What you were asked', s.asked.length ? `${plural(s.asked.length, 'question')}, in order.` : '',
      s.asked.length ? qa : '<p class="empty">No questions were asked in this session.</p>'),
  ].join('');
}

/** Where a project was last seen, said plainly. A gone checkout is history, not an error. */
const whereLine = (p) => p.kind === 'global' ? 'work done outside any repository'
  : p.kind === 'unattributed' ? 'recorded before projects were tracked, or by a session that named none'
  : p.path + (p.available === false ? ' — checkout no longer on disk' : '');

function viewProjects() {
  const inv = projectsInScope();
  const list = inv.filter((p) => p.learning.answers || p.learning.logged_concepts);
  const other = inv.filter((p) => !p.learning.answers && !p.learning.logged_concepts);
  const daily = dailyInScope();

  const cards = list.map((p, i) => {
    const L = p.learning;
    const detail = `<div class="kv" style="margin-bottom:var(--space-5)">
         <div><b>Answers</b><span>${L.answers}</span></div>
         <div><b>Accuracy</b><span>${L.answers ? pct(L.passed, L.answers) + '%' : '—'}</span></div>
         <div><b>Assessed</b><span>${plural(L.assessed_concepts, 'concept')}</span></div>
         <div><b>Recorded</b><span>${plural(L.logged_concepts, 'concept')}</span></div>
         <div><b>Sessions</b><span>${L.sessions}</span></div>
         <div><b>Last active</b><span>${esc(ago(L.last))}</span></div>
       </div>`;
    if (!L.answers) {
      return card(p.name, whereLine(p), detail
        + `<p class="slug" style="margin:0"><strong>No assessments yet.</strong> The concepts this project's work recorded
            come up in a quiz like any others; nothing counts toward a level until one is answered.
            <a class="link" data-go="${esc(LH('sessions', null, { project: p.id }))}">Its sessions →</a></p>`);
    }
    // The level runway comes from the learning payload, keyed by the same fold.
    const st = S.projects.filter((x) => pid(x.repo) === p.id).sort((x, y) => y.answers - x.answers)[0];
    const bar = (label, value, target, ok) => `
      <div><span class="${ok ? 'mark-ok' : 'mark-no'}">${ok ? '✓' : '○'}</span>
        <span style="min-width:150px">${esc(label)}</span>
        <span class="bar">${meter(pct(value, target), ok ? '' : 'mute')}</span>
        <span class="slug" style="white-space:nowrap">${value} / ${target}</span></div>`;
    const ladder = st ? ['easy', 'medium', 'hard'].map((l, idx) => {
      const cur = ['easy', 'medium', 'hard'].indexOf(st.level);
      return `<div class="${idx === cur ? 'on' : idx < cur ? 'done' : ''}">${l}</div>`;
    }).join('') : '';

    chart('c-proj-' + i, (el) => {
      const m = new Map();
      for (const d of S.daily) {
        if (pid(d.repo) !== p.id) continue;
        const cur = m.get(d.day) ?? { day:d.day, passed:0, missed:0, skipped:0, total:0 };
        cur.passed += d.passed; cur.missed += d.missed; cur.skipped += d.skipped;
        cur.total = cur.passed + cur.missed + cur.skipped;
        m.set(d.day, cur);
      }
      chartActivity(el, fillDays(m, 30));
    });

    return card(p.name, whereLine(p), detail
      + (st ? `<div class="ladder">${ladder}</div>
       ${st.pinned
         ? `<p class="slug" style="margin:var(--space-4) 0 0">Difficulty is pinned in config, so this project does not promote.</p>`
         : st.next_level
           ? `<p class="slug" style="margin:var(--space-4) 0 var(--space-2)">To reach <strong>${esc(st.next_level)}</strong>, counting answers since ${esc(st.promoted_at ? fmtDate(st.promoted_at) : 'you started')}:</p>
              <div class="checks">
                ${bar('Passing answers', st.level_counts.passed, st.level_needed.answers, !st.level_unmet.includes('answers'))}
                ${bar('Accuracy', Math.round(st.level_accuracy * 100), Math.round(st.level_needed.accuracy * 100), !st.level_unmet.includes('accuracy'))}
                ${bar('Distinct concepts', st.level_counts.concepts, st.level_needed.concepts, !st.level_unmet.includes('concepts'))}
              </div>`
           : `<p class="slug" style="margin:var(--space-4) 0 0">Top of the ladder — questions can reach tier 5 here.</p>`}` : '')
      + `<div class="chart" style="margin-top:var(--space-5)"><svg id="c-proj-${i}" role="img"
         aria-label="Thirty days of answers in this project"></svg></div>`);
  });

  const assessed = list.filter((p) => p.learning.answers);
  return [
    `<div>
       <h1 class="page__title">Projects</h1>
       <p class="page__sub">Difficulty is earned per codebase, not per person: the same developer is a different
         learner on their fourth Node service and their first Rust one. Everyone starts at easy (tiers 1–2)
         and climbs on evidence. A project appears here as soon as its work logs a concept — before a single
         question is asked.</p>
     </div>`,
    tiles([
      ['Projects', list.length, 'with logged or assessed work'],
      ['Assessed', assessed.length, `${list.length - assessed.length} with no assessments yet`],
      ['Answers', list.reduce((a, p) => a + p.learning.answers, 0), 'across all of them'],
      ['Best accuracy', assessed.length ? Math.max(...assessed.map((p) => pct(p.learning.passed, p.learning.answers))) + '%' : '—', 'of any project'],
      ['Active days', streaks(daily).days, 'with at least one answer'],
    ]),
    cards.join('') || '<p class="empty">No project has logged or answered anything yet.</p>',
    other.length
      ? card('Memory only', 'Recorded by capture, with no learning activity yet. Captured is not assessed.',

              <td class="num">${p.memory.events}</td><td class="num">${p.memory.entries}</td>
              <td class="num slug">${esc(ago(p.last_active))}</td></tr>`)))
      : '',
  ].join('');
}

function viewDomains() {
  const scoped = conceptsInScope();
  const byDomain = new Map();
  for (const c of scoped) {
    const d = byDomain.get(c.domain) ?? { domain:c.domain, catalogue:0, touched:0, mastered:0, due:0, attempts:0 };
    d.catalogue += 1;
    if (c.seen) { d.touched += 1; d.attempts += c.attempts; if (c.mastered) d.mastered += 1; if (c.due) d.due += 1; }
    byDomain.set(c.domain, d);
  }
  const list = [...byDomain.values()].sort((a, b) => b.touched - a.touched || b.catalogue - a.catalogue);

  const rows = list.map((d) => `
    <tr class="row" data-go="${esc(LH('domain', d.domain))}">
      <td><span class="title">${esc(d.domain)}</span>
        <div class="slug">${plural(d.catalogue, 'concept')} in the graph</div></td>
      <td style="min-width:130px">${d.touched
        ? meter(pct(d.mastered, d.touched)) + `<div class="slug">${d.mastered} mastered of ${d.touched} asked</div>`
        : '<span class="slug">your work has not reached it</span>'}</td>
      <td class="num">${d.attempts}</td>
      <td class="num">${d.due || '—'}</td>
      <td class="num slug">${d.catalogue - d.touched} not asked</td>
    </tr>`);

  const tierCount = [1,2,3,4,5].map((t) => scoped.filter((c) => c.seen && c.tier === t).length);
  // A sequential ramp mixed from the accent role rather than picked off the
  // accent scale: a fixed --vd-200 is legible on ink and invisible on paper.
  const COLORS = [100, 78, 58, 40, 24].map((p) => `color-mix(in srgb, var(--spot) ${p}%, var(--mass))`);

  return [
    `<div>
       <h1 class="page__title">Domains</h1>
       <p class="page__sub">What you are learning, grouped. The catalogue is a library, not a to-do list —
         a domain with untouched concepts is a domain your work has not reached yet.</p>
     </div>`,
    card('Coverage', 'Open a domain to see its concepts.',
      table([{t:'Domain'},{t:'Mastered'},{t:'Answers',n:1},{t:'Due',n:1},{t:'Catalogue',n:1}], rows)),
    card('Tier spread of what you have been asked', 'Tier is how hard one question is: recall, mechanism, judgement, failure modes, design.',
      segbar([1,2,3,4,5].map((t, i) => ({ label: tierLabel(t), n: tierCount[i], color: COLORS[i] })))),
  ].join('');
}

function viewDomain(name) {
  const all = conceptsInScope().filter((c) => c.domain === name);
  if (!all.length) return `<p class="empty">No concepts in <code>${esc(name)}</code> for this scope.
    <a class="link" data-go="${esc(LH('domains'))}">Back to domains</a>.</p>`;

  const seen = all.filter((c) => c.seen);
  const list = [...all].sort((a, b) => (a.seen === b.seen ? a.score - b.score : a.seen ? -1 : 1));
  const p = page('domain', list.length);
  const rows = slice(list, p).map((c) => `
    <tr class="row" data-go="${esc(LH('concept', c.slug))}">
      <td style="min-width:220px"><span class="title">${esc(c.name)}</span><div class="slug">${esc(c.slug)}</div></td>
      <td class="slug" style="white-space:nowrap">${esc(tierLabel(c.tier))}</td>
      <td style="min-width:104px">${c.seen ? meter(c.score * 100, c.score < 0.5 ? 'warn' : '')
        + `<div class="slug">${Math.round(c.score * 100)}%</div>` : '<span class="slug">—</span>'}</td>
      <td class="num">${c.attempts || '—'}</td>
      <td>${statePill(c)}</td>
      <td class="ctx" style="min-width:200px">${esc(c.context ?? '')}</td>
    </tr>`);

  return [
    `<div>
       <a class="page__back" data-go="${esc(LH('domains'))}">← Domains</a>
       <h1 class="page__title">${esc(name)}</h1>
       <p class="page__sub">${plural(all.length, 'concept')} in the graph · ${seen.length} asked ·
         ${seen.filter((c) => c.mastered).length} mastered.</p>
     </div>`,
    card(null, null, segbar([
      { label:'Mastered', n:seen.filter((c) => c.mastered).length, color:'var(--spot)' },
      { label:'Learning', n:seen.filter((c) => !c.mastered).length, color:'var(--warning)' },
      { label:'Not asked', n:all.length - seen.length, color:'var(--mass)' },
    ])),
    card(null, null, table([{t:'Concept'},{t:'Tier'},{t:'Score'},{t:'Asked',n:1},{t:'State'},{t:'From your code'}], rows)
      + pager('domain', list.length, p)),
  ].join('');
}

/* ---------- Memory: the timeline, paged over /api/memory ---------- */

function memoryQuery(type) {
  const t = T.memory;
  const p = memScope(new URLSearchParams());
  if (type && type !== 'all') p.set('type', type);
  if (t.tag !== 'all') p.set('tag', t.tag);
  if (t.q.trim()) p.set('q', t.q.trim());
  // A date input is a day, not an instant, and `occurred_at` is an ISO string —
  // so the bounds have to be ISO too, or the text comparison puts `T` after the
  // space in `23:59:59` and the last day of the range drops out.
  if (t.since) p.set('since', t.since + 'T00:00:00.000Z');
  if (t.until) p.set('until', t.until + 'T23:59:59.999Z');
  p.set('page', t.page);
  p.set('per', S.memory.per_page || 25);
  return p.toString();
}

function drawMemory(d) {
  T.memory.page = d.page;   // the server clamps a page number a filter shrank
  const rows = d.rows.map((e) => {
    const gone = e.deleted_at || e.superseded_by;
    const more = e.narrative_length > String(e.snippet ?? '').length;
    return `<tr class="row${gone ? ' gone' : ''}" data-go="${esc(MH('entry', e.id))}">
      <td class="slug" style="white-space:nowrap">${esc(stamp(e.occurred_at))}</td>
      <td style="min-width:280px"><span class="title">${esc(e.title)}</span>
        <div class="ctx">${esc(e.snippet ?? '')}${more ? '…' : ''}</div></td>
      <td><span class="pill">${esc(e.type ?? e.kind)}</span></td>
      <td style="min-width:120px"><div class="tags">${tagPills(e.tags)}</div></td>
      <td class="slug">${esc(pname(e.project))}</td>
      <td class="num">${e.event_count}</td>
      <td>${entryMark(e)}</td>
    </tr>`;
  });
  return table([{t:'When'},{t:'Observation'},{t:'Type'},{t:'Tags'},{t:'Project'},{t:'Evidence',n:1},{t:''}], rows)
    + pager('memory', d.total, d.page, d.per);
}

/**
 * The memory counts, scoped when they can be. The inventory counts evidence,
 * pending evidence, observations and sessions per project, so those follow the
 * selector; indexing, reuse, delivery and assessment are only aggregated for
 * the whole database, and say so rather than pretend to be this project's.
 */
function memTiles() {
  const M = S.memory;
  const scoped = PROJECT !== null;
  const inv = projectsInScope();
  const sum = (f) => inv.reduce((a, p) => a + f(p), 0);
  const events = scoped ? sum((p) => p.memory.events) : M.captured;
  const pending = scoped ? sum((p) => p.memory.pending) : M.pending;
  const entries = scoped ? sum((p) => p.memory.entries) : M.entries;
  const everywhere = scoped ? 'all projects · ' : '';
  return tiles([
    ['Observations', entries, scoped ? `live here · ${M.indexed} indexed across all projects`
      : `${M.entries_total} written · ${M.superseded} superseded · ${M.deleted} deleted · ${M.indexed} indexed`, '', MH('timeline')],
    ['Evidence', events, `${events - pending} distilled · ${pending} still pending`, pending ? 'warn' : '', MH('health')],
    ['Sessions', scoped ? sum((p) => p.memory.sessions) : INV.projects.reduce((a, p) => a + p.memory.sessions, 0), 'that captured or remembered', '', MH('sessions')],
    ['Reused', M.reused, `${everywhere}${M.exposed} actually delivered`, '', MH('reuse')],
    ['Assessed', M.assessed, everywhere + 'evidence concepts you were asked about', '', LH('concepts')],
  ]);
}

function viewMemory(param) {
  const t = T.memory;
  const M = S.memory;
  const types = M.types ?? [];
  // The URL holds the filters, so a filtered timeline is a link that reopens
  // filtered. A type with no live entries still filters — to nothing, visibly.
  const type = param || 'all';
  t.tag = CUR.query.get('tag') || 'all';
  t.since = CUR.query.get('from') || '';
  t.until = CUR.query.get('to') || '';
  fill('mem-rows', '/api/memory?' + memoryQuery(type), drawMemory);

  const chip = (k, label, n) =>
    `<button class="chip" data-mtype="${esc(k)}" aria-pressed="${type === k}">${esc(label)}${n === undefined ? '' : ' ' + n}</button>`;
  const typeChips = types.map((x) => chip(x.type, x.type, x.n)).join('')
    + (type !== 'all' && !types.some((x) => x.type === type) ? chip(type, type, 0) : '');

  return [
    `<div>
       <h1 class="page__title">Timeline</h1>
       <p class="page__sub">What your sessions actually did, distilled into observations and kept with the raw
         evidence behind each one. Corrections supersede rather than overwrite and deletions are marked, so what
         you see is the audit trail and not a tidied version of it.</p>
     </div>`,

    memTiles(),

    card(null, null,
      `<div class="filters">
         <div class="grow"><input type="search" id="mq" value="${esc(t.q)}" placeholder="Search titles, narrative, facts and files…" aria-label="Search memory"></div>
         <select id="mtag" aria-label="Tag">
           <option value="all">All tags</option>
           ${(M.tags ?? []).map((x) => `<option value="${esc(x.tag)}"${t.tag === x.tag ? ' selected' : ''}>${esc(x.tag)} (${x.n})</option>`).join('')}
         </select>
         <input type="date" id="mfrom" value="${esc(t.since)}" aria-label="From date">
         <input type="date" id="mto" value="${esc(t.until)}" aria-label="To date">
       </div>
       <div class="chips" id="mtypes">
         ${chip('all', 'All')}${typeChips}
       </div>
       <div style="margin-top:var(--space-4)" id="mem-rows"><p class="empty">Loading the timeline…</p></div>`),
  ].join('');
}

function drawEntry(d) {
  const e = d.entry;
  const gone = e.deleted_at || e.superseded_by;
  const facts = jsonList(e.facts);
  const files = jsonList(e.files);
  const link = (x) => `<a class="link" data-go="${esc(MH('entry', x.id))}">${esc(x.title)}</a> <span class="slug">${esc(fmtDate(x.occurred_at))}</span>`;

  const evidence = d.events.map((ev) => `
    <details class="qa">
      <summary class="qa__meta">
        <span>${esc(ev.kind)}</span>${ev.tool ? `<span>${esc(ev.tool)}</span>` : ''}
        <span>${esc(stamp(ev.occurred_at))}</span><span>${esc(ev.source)}</span>
        ${ev.redacted ? '<span class="pill due">redacted</span>' : ''}
        <span class="sp slug">${esc(ev.title ?? ev.event_uid.slice(0, 12))}</span>
      </summary>
      <pre class="raw">${esc(ev.body)}${ev.body_length > String(ev.body ?? '').length ? '\n… truncated' : ''}</pre>
      ${jsonList(ev.files).length ? `<div class="tags" style="margin-top:var(--space-3)">${jsonList(ev.files).map((f) => `<span class="pill">${esc(f)}</span>`).join('')}</div>` : ''}
    </details>`).join('');

  return [
    `<div>
       <p class="page__eyebrow">${esc(e.type ?? e.kind)}</p>
       <h1 class="page__title${gone ? ' gone-title' : ''}">${esc(e.title)}</h1>
       <p class="page__sub">${esc(stamp(e.occurred_at))} · ${esc(pname(e.project))} ·
         written by <code class="slug">${esc(e.generator)}</code>
         ${e.import_source ? ` · imported from ${esc(e.import_source)}` : ''}
         ${e.session_id ? ` · <a class="link" data-go="${esc(sessHref(e.session_id))}">that session</a>` : ''}</p>
     </div>`,

    e.deleted_at
      ? `<div class="banner"><p><strong>Deleted ${esc(ago(e.deleted_at))}.</strong> It is kept here so the record
           stays checkable, and it is excluded from search and recall.</p></div>` : '',
    d.replaced_by
      ? `<div class="banner"><p><strong>Superseded.</strong> A later observation corrected this one:
           ${link(d.replaced_by)}. Recall prefers the replacement; this row is the audit trail.</p></div>` : '',

    tiles([
      ['Confidence', e.confidence == null ? '—' : Math.round(e.confidence * 100) + '%', 'the summariser’s own, not a score'],
      ['Evidence', d.events.length, 'raw events behind this claim'],
      ['Candidates', d.candidates.length, 'concepts it proposed'],
      ['Reused', d.receipts.length, d.receipts.length ? 'times it was selected for context' : 'never selected yet', '', MH('reuse')],
    ]),

    card('What happened', 'The observation, as written.',
      `<p class="qa__q">${esc(e.narrative) || '<span class="empty">No narrative.</span>'}</p>
       ${facts.length ? `<ul class="facts">${facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
       ${files.length ? `<div class="tags" style="margin-top:var(--space-4)">${files.map((f) => `<span class="pill">${esc(f)}</span>`).join('')}</div>` : ''}
       ${d.tags.length ? `<div class="tags" style="margin-top:var(--space-3)">${tagPills(d.tags)}</div>` : ''}`),

    d.candidates.length
      ? card('Concepts it proposed', 'A candidate is a proposal, not a concept — and never a passing answer. Only a question you answered moves mastery.',
          table([{t:'Slug'},{t:'Domain'},{t:'Confidence',n:1},{t:'Status'}], d.candidates.map((c) => {
            const go = c.concept_slug ? ` class="row" data-go="${esc(LH('concept', c.concept_slug))}"` : '';
            return `<tr${go}><td><span class="title">${esc(c.name ?? c.slug)}</span><div class="slug">${esc(c.slug)}</div></td>
              <td><span class="pill">${esc(c.domain ?? '—')}</span></td>
              <td class="num">${Math.round((c.confidence ?? 0) * 100)}%</td>
              <td><span class="pill${c.status === 'accepted' ? ' ok' : ''}">${esc(c.status)}</span></td></tr>`;
          })))
      : '',

    d.replaces.length
      ? card('What this replaced', 'Earlier claims this observation corrected.',
          `<div class="list">${d.replaces.map((x) => `<div>${link(x)}</div>`).join('')}</div>`)
      : '',

    card('The raw evidence', 'Every event this was distilled from, exactly as captured. Open one to read it.',
      evidence || '<p class="empty">No evidence is linked — this entry was written by hand or imported.</p>'),

    d.receipts.length
      ? card('Where it was reused', 'Each time this entry was selected for a context injection.',
          table([{t:'When'},{t:'Scope'},{t:'Stage'},{t:'From source',n:1},{t:'Sent',n:1},{t:'Delivery'}],
            d.receipts.map((r) => `<tr><td class="slug">${esc(stamp(r.created_at))}</td>
              <td>${esc(r.scope)}</td><td class="slug">${esc(r.stage)}</td>
              <td class="num">${r.source_tokens}</td><td class="num">${r.sent_tokens}</td>
              <td>${deliveryPill(r.delivery)}</td></tr>`)))
      : '',
  ].join('');
}

function viewEntry(id) {
  fill('entry-body', '/api/memory/entry?id=' + encodeURIComponent(id), (d) =>
    d && d.entry ? drawEntry(d) : `<p class="empty">No observation <code>${esc(id)}</code>.</p>`);
  return `<div><a class="page__back" data-go="${esc(MH('timeline'))}">← Timeline</a></div>
    <div class="stack" id="entry-body"><p class="empty">Loading the observation…</p></div>`;
}

/* ---------- Reuse: the savings ledger, receipt by receipt ---------- */

function viewReuse() {
  const R = S.reuse;
  const rows = R.rows.filter((r) => inScope(r.project, r.session_id));
  const p = page('reuse', rows.length);
  const net = R.base - R.delivered;
  const verdict = R.savings.kind === 'saving' ? R.savings.percent + '%'
    : R.savings.kind === 'overhead' ? '+' + R.savings.tokens : '—';

  const body = slice(rows, p).map((r) => {
    // A saving is only a saving when the delivery was confirmed. An unknown or
    // prepared receipt has a B and a D but no verdict, and printing one would
    // be counting context that may never have reached the model.
    const saved = r.delivery === 'confirmed' && r.base_tokens > 0
      ? Math.round((100 * (r.base_tokens - r.delivered_tokens)) / r.base_tokens) + '%'
      : '—';
    return `<tr>
      <td class="slug" style="white-space:nowrap">${esc(stamp(r.created_at))}</td>
      <td><span class="title">${esc(r.scope)}</span><div class="slug">${esc(pname(r.project))}</div></td>
      <td class="num">${r.base_tokens}</td>
      <td class="num">${r.delivered_tokens}</td>
      <td class="num">${saved}</td>
      <td class="num">${r.item_count}</td>
      <td class="num">${r.detail_tokens ? '+' + r.detail_tokens : '—'}</td>
      <td>${deliveryPill(r.delivery)}</td>
      <td class="slug">${esc(r.method)}</td>
    </tr>`;
  });

  return [
    `<div>
       <h1 class="page__title">Context reuse</h1>
       <p class="page__sub"><strong>B</strong> is what the same material would have cost to read from source.
         <strong>D</strong> is what was actually delivered instead. Both are counted with the same estimator
         (<code class="slug">${esc(R.estimator)}</code>), and the percentage is an estimate of how much
         <em>context volume</em> was avoided — not a bill, not a price, and not a measure of model spend.</p>
     </div>`,

    tiles([
      ['B — from source', R.base, 'estimated tokens, confirmed receipts'],
      ['D — delivered', R.delivered, 'estimated tokens actually injected'],
      ['Net', net, net >= 0 ? 'fewer tokens of context' : 'more tokens than reading source', net < 0 ? 'warn' : ''],
      ['Verdict', verdict, 'estimated, all projects', R.savings.kind === 'saving' ? 'good' : R.savings.kind === 'overhead' ? 'warn' : ''],
      ['Receipts', R.receipts, `${R.confirmed} confirmed of ${R.receipts}`],
    ]),

    `<div class="banner"><p>${esc(savingsText(R.savings, R.receipts))}
       Receipts whose delivery is <code>unknown</code> or <code>prepared</code> are counted in the ledger below
       but never in the verdict — an injection that may not have reached the model is not a saving.</p></div>`,

    card('Every receipt', `${plural(rows.length, 'receipt')} in scope. One row per injection.`,
      table([{t:'When'},{t:'Scope'},{t:'B',n:1},{t:'D',n:1},{t:'Saved',n:1},{t:'Items',n:1},{t:'Detail fetch',n:1},{t:'Delivery'},{t:'Method'}], body)
      + pager('reuse', rows.length, p)
      + (R.receipts > R.receipts_shown
        ? `<p class="slug" style="margin:var(--space-4) 0 0">Showing the most recent ${R.receipts_shown} of ${R.receipts} receipts. The totals above cover all of them.</p>`
        : '')),
  ].join('');
}

/* ---------- Health: is capture actually working? ---------- */

function viewHealth() {

  return [

     </div>`,

    tiles([

      ['Failed', Q.failed, 'gave up after retries', Q.failed ? 'warn' : ''],

    card('Captured is not assessed', 'Each step is a place the pipeline can stop. A number that falls off between two rows is where to look.',
      `<div class="checks">` + ladder.map(([label, n, note]) => `
        <div><span class="${n ? 'mark-ok' : 'mark-no'}">${n ? '✓' : '○'}</span>
          <span style="min-width:110px">${esc(label)}</span>

            <div><b>Capture mode</b><span>${esc(H.capture.mode)}</span></div>
            <div><b>Newest event</b><span>${esc(H.capture.newest_event ? stamp(H.capture.newest_event) : 'never')}</span></div>
            <div><b>Redacted</b><span>${M.redacted}</span></div>
            <div><b>Retention</b><span>${H.capture.retention_days ? plural(H.capture.retention_days, 'day') : 'kept until deleted'}</span></div>
            <div><b>Last prune</b><span>${esc(H.capture.pruned_at ? ago(H.capture.pruned_at) : 'never')}</span></div>
          </div>`)}
       ${card('Providers', 'Nothing leaves this machine unless a provider is configured here.',
         `<div class="kv">
            <div><b>Observer</b><span>${H.providers.observer ? esc(H.providers.observer.kind + ' · ' + H.providers.observer.model) : 'local summariser'}</span></div>
            <div><b>Embeddings</b><span>${H.providers.embeddings ? esc(H.providers.embeddings.kind + ' · ' + H.providers.embeddings.model) : 'local embedder'}</span></div>
            <div><b>Retrieval</b><span>${esc(H.providers.retrieval_mode)}</span></div>
          </div>
          <p class="slug" style="margin:var(--space-4) 0 0">A configured model runs through Claude Code on
            your subscription.</p>`)}
     </div>`,

    card('Stalled jobs', 'Grouped by why they stopped. Transient retries on its own; auth, quota and missing need you.',
      H.stalled.length
        ? table([{t:'Status'},{t:'Why'},{t:'Jobs',n:1},{t:'Attempts',n:1},{t:'Last',n:1}],
            H.stalled.map((j) => `<tr>
              <td><span class="pill due">${esc(j.status)}</span></td>
              <td><code class="slug">${esc(j.error_class)}</code></td>
              <td class="num">${j.n}</td><td class="num">${j.attempts}</td>

/* ============================================================
   Workflows and routes

   Two workflows, one shell. The registry below is the only description of
   either: the sidebar, the picker, the route resolver and the page renderer all
   read it, so the selector, the highlighted item and the screen cannot disagree
   about where the reader is.

   The URL is the authority. `#/<workflow>/<page>/<param>?project=…` names the
   workflow, the page, the highlighted item and the project scope, so a refresh,
   a pasted link or Back/Forward rebuilds the same screen from nothing.
   ============================================================ */
const ICONS = {
  learning:  '<path d="M4 19V6a2 2 0 0 1 2-2h13v13H6a2 2 0 0 0-2 2z"/><path d="M6 21h13v-4"/><path d="M9 8h6"/>',
  memory:    '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  dashboard: '<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  concepts:  '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
  review:    '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',
  sessions:  '<rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M8 4v16"/>',
  projects:  '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  domains:   '<circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6M9 6h6a3 3 0 0 1 3 3v6"/>',
  timeline:  '<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/>',
  reuse:     '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>',
  health:    '<path d="M3 12h4l2-6 3 12 2-6h7"/>',
};
const svg = (paths, cls = '') =>
  `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

/**
 * `pages[key]` is `{ label, view }` for a page with a sidebar entry and
 * `{ parent, view }` for a detail page: a detail keeps its parent highlighted.
 * `query` lists the query keys that page reads, so a workflow switch or a link
 * to another page carries the project and drops filters that mean nothing there.
 */
const WORKFLOWS = {
  learning: {
    name: 'Learning',
    groups: [
      { id: 'learn', label: 'Learn', items: ['concepts', 'review'] },
      { id: 'history', label: 'History', items: ['sessions', 'projects', 'domains'] },
    ],
    pages: {
      dashboard: { label: 'Dashboard', view: () => viewLearningDashboard() },
      concepts:  { label: 'Concepts', view: (p) => viewConcepts(p), query: ['domain'] },
      concept:   { parent: 'concepts', view: (p) => viewConcept(p) },
      review:    { label: 'Review', view: (p) => viewReview(p) },
      sessions:  { label: 'Sessions', view: () => viewSessions() },
      session:   { parent: 'sessions', view: (p) => viewSession(p) },
      projects:  { label: 'Projects', view: () => viewProjects() },
      domains:   { label: 'Domains', view: () => viewDomains() },
      domain:    { parent: 'domains', view: (p) => viewDomain(p) },
    },
  },
  memory: {
    name: 'Memory',
    groups: [
      { id: 'memory', label: 'Memory', items: ['timeline', 'sessions', 'projects'] },
      { id: 'insights', label: 'Insights', items: ['reuse', 'health'] },
    ],
    pages: {
      dashboard: { label: 'Dashboard', view: () => viewMemoryDashboard() },
      timeline:  { label: 'Timeline', view: (p) => viewMemory(p), query: ['tag', 'from', 'to'] },
      entry:     { parent: 'timeline', view: (p) => viewEntry(p) },
      sessions:  { label: 'Sessions', view: () => viewMemorySessions() },
      session:   { parent: 'sessions', view: (p) => viewSession(p) },
      projects:  { label: 'Projects', view: () => viewMemoryProjects() },
      reuse:     { label: 'Reuse', view: () => viewReuse() },
      health:    { label: 'Health', view: () => viewHealth() },
    },
  },
};

/**
 * A canonical link. The project scope rides along unless `q` overrides it —
 * it is shared by both workflows — and nothing else does unless asked for.
 */
function href(wf, page, param, q = {}) {
  const qs = new URLSearchParams();
  const project = 'project' in q ? q.project : PROJECT;
  if (project !== null && project !== undefined && project !== '') qs.set('project', project);
  for (const [k, v] of Object.entries(q)) if (k !== 'project' && v !== null && v !== undefined && v !== '') qs.set(k, v);
  const tail = param !== undefined && param !== null && param !== '' ? '/' + encodeURIComponent(param) : '';
  const s = qs.toString();
  return `#/${wf}/${page}${tail}${s ? '?' + s : ''}`;
}
const LH = (page, param, q) => href('learning', page, param, q);
const MH = (page, param, q) => href('memory', page, param, q);
/** A session opened from Memory stays in Memory, and from Learning in Learning. */
const sessHref = (id) => href(CUR.wf, 'session', id);

/**
 * Bookmarks and older documentation link to the single-workflow routes. Each
 * one maps to its canonical home; the rest of the path and the query are kept.
 * `memory` is special-cased in `resolve()`: `#/memory/<type>` was the typed
 * timeline, and canonical Memory pages have to win over it.
 */
const LEGACY = {
  overview: ['learning', 'dashboard'],
  concepts: ['learning', 'concepts'],
  concept:  ['learning', 'concept'],
  review:   ['learning', 'review'],
  sessions: ['learning', 'sessions'],
  session:  ['learning', 'session'],
  projects: ['learning', 'projects'],
  domains:  ['learning', 'domains'],
  domain:   ['learning', 'domain'],
  entry:    ['memory', 'entry'],
  reuse:    ['memory', 'reuse'],
  health:   ['memory', 'health'],
};

/** Decodes a path parameter, or reports that it cannot be decoded. */
function decodeParam(raw) {
  try { return { param: decodeURIComponent(raw), bad: false }; }
  catch (e) { return { param: raw, bad: true }; }
}

/**
 * Reads a hash into a screen, and says whether it has to be rewritten first.
 *
 * Returns `{ wf, page, param, query, redirect, missing, bad }`: `redirect` is
 * the canonical hash when the one given is a legacy or partial form, `missing`
 * that no page answers to it, `bad` that its parameter is malformed encoding.
 * Pure: no DOM, no state beyond its arguments.
 */
function resolve(hash, savedProject) {
  let raw = String(hash || '').replace(/^#/, '');
  let qs = '';
  const qi = raw.indexOf('?');
  if (qi >= 0) { qs = raw.slice(qi + 1); raw = raw.slice(0, qi); }
  const parts = raw.replace(/^\/+/, '').split('/');
  while (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
  const query = new URLSearchParams(qs);
  const [head = '', ...rest] = parts;

  const canonical = (wf, page, restParts) => {
    // The old dashboard remembered the project across visits; a legacy link
    // that arrives with no project in it keeps that behaviour once, and the
    // canonical URL carries the scope from then on.
    if (!query.has('project') && savedProject) query.set('project', savedProject);
    const s = query.toString();
    const tail = restParts.length ? '/' + restParts.join('/') : '';
    return { redirect: `#/${wf}/${page}${tail}${s ? '?' + s : ''}` };
  };

  if (head === '' ) return canonical('learning', 'dashboard', []);
  // Own keys only: `#/constructor` would otherwise find Object's and crash the render.
  const own = (o, k) => Object.hasOwn(o, k);
  if (own(WORKFLOWS, head) && head === 'memory' && (rest.length === 0 || rest[0] === '')) {
    return canonical('memory', 'timeline', []);
  }
  if (own(WORKFLOWS, head)) {
    const W = WORKFLOWS[head];
    const [page = '', ...more] = rest;
    if (page === '') return { redirect: href(head, 'dashboard', null, { project: query.get('project') }) };
    if (own(W.pages, page)) {
      const { param, bad } = decodeParam(more.join('/'));
      return { wf: head, page, param, query, bad };
    }
    // `#/memory/<type>`: the typed timeline, from before there were two workflows.
    if (head === 'memory') return canonical('memory', 'timeline', rest);
    return { wf: head, page, param: '', query, missing: true };
  }
  if (own(LEGACY, head)) return canonical(LEGACY[head][0], LEGACY[head][1], rest);
  return { wf: 'learning', page: head, param: '', query, missing: true };
}

/* ---------- the sidebar ---------- */

/** Collapsed group ids, per workflow. Expanded is the default and is not stored. */
const collapseKey = (wf) => `eklavya-dash-nav-collapsed:${wf}`;
function readCollapsed(wf) {
  try {
    const v = JSON.parse(localStorage.getItem(collapseKey(wf)) || '[]');
    const known = WORKFLOWS[wf].groups.map((g) => g.id);
    return new Set(Array.isArray(v) ? v.filter((id) => known.includes(id)) : []);
  } catch (e) { return new Set(); }
}
function writeCollapsed(wf, set) {
  try { localStorage.setItem(collapseKey(wf), JSON.stringify([...set])); } catch (e) {}
}

function navCounts(wf) {
  const inv = projectsInScope();
  const sum = (f) => inv.reduce((a, p) => a + f(p), 0);
  if (wf === 'learning') {
    const seen = seenConcepts();
    return {
      concepts: conceptsInScope().length,
      review: seen.filter((c) => c.due).length,
      sessions: sessions().filter((s) => s.logged.length || s.asked.length).length,
      projects: inv.filter((p) => p.learning.answers || p.learning.logged_concepts).length,
      domains: new Set(conceptsInScope().map((c) => c.domain)).size,
    };
  }
  return {
    timeline: sum((p) => p.memory.entries),
    sessions: sum((p) => p.memory.sessions),
    projects: inv.filter((p) => p.memory.events || p.memory.entries).length,
    reuse: sum((p) => p.memory.receipts),
  };
}

function renderNav(wf, active) {
  const W = WORKFLOWS[wf];
  const counts = navCounts(wf);
  const collapsed = readCollapsed(wf);
  // A direct link into a collapsed group opens it: the reader has to be able to
  // see where they are. A collapse they make afterwards still takes effect.
  const home = W.groups.find((g) => g.items.includes(active));
  if (home && collapsed.has(home.id)) { collapsed.delete(home.id); writeCollapsed(wf, collapsed); }

  const item = (key) => {
    const pg = W.pages[key];
    const n = counts[key];
    return `<a href="${esc(href(wf, key))}"${key === active ? ' aria-current="page"' : ''} data-nav="${key}">
      ${svg(ICONS[key] ?? ICONS.dashboard)}${esc(pg.label)}${n !== undefined ? `<i class="${key === 'review' && n ? 'hot' : ''}">${n}</i>` : ''}
    </a>`;
  };
  $('nav').setAttribute('aria-label', `${W.name} sections`);
  $('nav').innerHTML = `<div>${item('dashboard')}</div>` + W.groups.map((g) => {
    const open = !collapsed.has(g.id);
    const id = `grp-${wf}-${g.id}`;
    return `<div class="nav__group">
      <button type="button" class="nav__toggle" id="tog-${wf}-${g.id}" data-group="${g.id}" aria-expanded="${open}" aria-controls="${id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>${esc(g.label)}
      </button>
      <div class="nav__items" id="${id}" role="group" aria-label="${esc(g.label)}"${open ? '' : ' hidden'}>${g.items.map(item).join('')}</div>
    </div>`;
  }).join('');
}

$('nav').addEventListener('click', (e) => {
  const tog = e.target.closest('[data-group]');
  if (tog) {
    const set = readCollapsed(CUR.wf);
    const open = tog.getAttribute('aria-expanded') === 'true';
    if (open) set.add(tog.dataset.group); else set.delete(tog.dataset.group);
    writeCollapsed(CUR.wf, set);
    tog.setAttribute('aria-expanded', String(!open));
    $(tog.getAttribute('aria-controls')).hidden = open;
    return;
  }
  // Following a link closes the drawer on a phone; the hashchange renders.
  if (e.target.closest('a[href]')) closeDrawer();
});

function renderShell() {
  const W = WORKFLOWS[CUR.wf];
  const home = href(CUR.wf, 'dashboard');
  for (const id of ['brand', 'brand-top']) {
    $(id).setAttribute('href', home);
    $(id).setAttribute('aria-label', `Eklavya, ${W.name} dashboard`);
  }
  $('wf-main').setAttribute('href', home);
  $('wf-main').innerHTML = `${svg(ICONS[CUR.wf])}<span>${esc(W.name)}</span>`;
  $('wf-main').setAttribute('aria-label', `${W.name} dashboard`);
  $('topbar-wf').textContent = W.name;
}

/* ---------- the workflow picker ---------- */
const menu = $('wf-menu');
const caret = $('wf-caret');

function pickerItems() { return [...menu.querySelectorAll('[role="menuitemradio"]')]; }

function placePicker() {
  const anchor = $('wf').getBoundingClientRect();
  const pad = 8;
  const vw = document.documentElement.clientWidth;
  const vh = window.innerHeight;
  menu.style.maxHeight = `${vh - pad * 2}px`;
  menu.style.minWidth = `${Math.min(Math.max(220, anchor.width), vw - pad * 2)}px`;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  const left = Math.max(pad, Math.min(anchor.left, vw - w - pad));
  let top = anchor.bottom + 4;
  // Below if it fits, above if that fits, otherwise as high as the window allows.
  if (top + h > vh - pad) top = anchor.top - h - 4 >= pad ? anchor.top - h - 4 : Math.max(pad, vh - h - pad);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

function openPicker() {
  menu.innerHTML = `<p class="picker__label" aria-hidden="true">Workflow</p>` + Object.entries(WORKFLOWS).map(([key, W]) =>
    `<button type="button" role="menuitemradio" aria-checked="${key === CUR.wf}" data-wf="${key}" tabindex="-1">
       ${svg(ICONS[key])}<span>${esc(W.name)}</span>
       <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
     </button>`).join('');
  menu.hidden = false;
  caret.setAttribute('aria-expanded', 'true');
  placePicker();
  (pickerItems().find((b) => b.dataset.wf === CUR.wf) ?? pickerItems()[0]).focus();
}

function closePicker(restore = true) {
  if (menu.hidden) return;
  const hadFocus = menu.contains(document.activeElement);
  menu.hidden = true;
  caret.setAttribute('aria-expanded', 'false');
  if (restore || hadFocus) caret.focus();
}

caret.addEventListener('click', () => (menu.hidden ? openPicker() : closePicker()));
caret.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); openPicker(); }
});
menu.addEventListener('click', (e) => {
  const b = e.target.closest('[data-wf]');
  if (!b) return;
  switchWorkflow(b.dataset.wf);
});
menu.addEventListener('keydown', (e) => {
  const items = pickerItems();
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePicker(); }
  // A menu is one Tab stop: Tab leaves it, back to the control that opened it.
  else if (e.key === 'Tab') { e.preventDefault(); closePicker(); }
});
document.addEventListener('pointerdown', (e) => {
  if (!menu.hidden && !menu.contains(e.target) && !caret.contains(e.target)) closePicker(false);
});
addEventListener('resize', () => { if (!menu.hidden) placePicker(); });

/**
 * Opens the other workflow's Dashboard. The project and the ground carry over;
 * screen filters do not, because a tag filter on the timeline means nothing on
 * the Learning Dashboard. A real navigation, so Back returns to where they were.
 */
function switchWorkflow(wf) {
  closePicker(false);
  const target = href(wf, 'dashboard');
  closeDrawer(false);
  if (location.hash === target) render(); else location.hash = target;
  (narrow.matches ? $('menu') : caret).focus();
}

/* ---------- the drawer (900px and below) ---------- */
const side = $('side');
const narrow = matchMedia('(max-width: 900px)');
let drawerOpen = false;

const focusables = (root) => [...root.querySelectorAll(
  'a[href], button:not([disabled]), select, input, [tabindex]:not([tabindex="-1"])',
)].filter((el) => !el.closest('[hidden]') && el.getClientRects().length);

/**
 * The drawer is a modal only while it is open on a narrow screen. On a wide
 * one the rail is the page's navigation and must stay available to assistive
 * technology whatever the drawer last did, so every modal attribute comes off.
 */
function syncDrawer() {
  if (!narrow.matches) {
    drawerOpen = false;
    side.classList.remove('is-open');
    side.inert = false;
    side.removeAttribute('role');
    side.removeAttribute('aria-modal');
    $('main').inert = false;
    $('topbar').inert = false;
    $('scrim').classList.remove('is-open');
    document.body.classList.remove('drawer-open');
    $('menu').setAttribute('aria-expanded', 'false');
    return;
  }
  side.classList.toggle('is-open', drawerOpen);
  side.inert = !drawerOpen;
  if (drawerOpen) { side.setAttribute('role', 'dialog'); side.setAttribute('aria-modal', 'true'); }
  else { side.removeAttribute('role'); side.removeAttribute('aria-modal'); }
  $('main').inert = drawerOpen;
  $('topbar').inert = drawerOpen;
  $('scrim').classList.toggle('is-open', drawerOpen);
  document.body.classList.toggle('drawer-open', drawerOpen);
  $('menu').setAttribute('aria-expanded', String(drawerOpen));
}

function openDrawer() {
  if (!narrow.matches) return;
  drawerOpen = true;
  syncDrawer();
  $('side-close').focus();
}
function closeDrawer(restore = true) {
  if (!drawerOpen) return;
  closePicker(false);
  drawerOpen = false;
  syncDrawer();
  if (restore) $('menu').focus();
}

$('menu').addEventListener('click', openDrawer);
$('side-close').addEventListener('click', () => closeDrawer());
$('scrim').addEventListener('click', () => closeDrawer());
narrow.addEventListener('change', syncDrawer);
document.addEventListener('keydown', (e) => {
  if (!drawerOpen) return;
  if (e.key === 'Escape' && menu.hidden) { e.preventDefault(); closeDrawer(); return; }
  // Hold focus inside the open drawer.
  if (e.key === 'Tab' && menu.hidden) {
    const f = focusables(side);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !side.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !side.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});
syncDrawer();

/* ---------- rendering ---------- */

function viewNotFound(what, bad) {
  return `<div>
      <h1 class="page__title">${bad ? 'This link is malformed' : 'No page here'}</h1>
      <p class="page__sub">${bad ? 'Part of' : 'Nothing answers to'} <code class="slug">${esc(what)}</code>${bad ? ' is not valid URL encoding, so it cannot be opened.' : '.'}
        Open the <a class="link" data-go="${esc(LH('dashboard'))}">Learning dashboard</a> or the
        <a class="link" data-go="${esc(MH('dashboard'))}">Memory dashboard</a>.</p>
    </div>`;
}

/**
 * Brings the screen in line with the URL: canonicalises a legacy or partial
 * link in place (no extra history entry), reads the project from the query,
 * then renders. Every navigation — a click, a pasted link, Back — lands here.
 */
function syncFromUrl() {
  let saved = null;
  try { saved = localStorage.getItem('eklavya-dash-project'); } catch (e) {}
  if (saved && !INV.projects.some((p) => p.id === saved)) saved = null;
  const r = resolve(location.hash, saved);
  if (r.redirect) {
    history.replaceState(history.state, '', location.pathname + location.search + r.redirect);
    return syncFromUrl();
  }
  const project = r.query.get('project');
  const known = project !== null && INV.projects.some((p) => p.id === project);
  const next = known ? project : null;
  if (next !== PROJECT) { PROJECT = next; for (const k of Object.keys(T)) T[k].page = 1; recomputeScope(); }
  CUR = { wf: r.wf, page: r.page, param: r.param, query: r.query, missing: r.missing, bad: r.bad };
  $('proj').value = PROJECT ?? '';
  render();
}

function render(keepFocus) {
  const W = WORKFLOWS[CUR.wf];
  const pg = CUR.missing ? null : W.pages[CUR.page];
  const active = pg ? (pg.parent ?? CUR.page) : null;
  GEN += 1;
  renderShell();
  renderNav(CUR.wf, active);
  const label = pg ? (W.pages[pg.parent ?? CUR.page].label) : 'Not found';
  $('crumb').innerHTML = `<span>${esc(W.name)}</span><span class="dim">${esc(label)}</span><span class="dim">${esc(scopeName())}</span>`;
  document.title = `${label} · ${W.name} — Eklavya`;

  AFTER.length = 0;
  $('view').innerHTML = !pg ? viewNotFound('#/' + CUR.wf + '/' + CUR.page, false)
    : CUR.bad ? viewNotFound(CUR.param, true)
    : pg.view(CUR.param);
  // A clickable row has to be reachable by Tab as well as by mouse.
  focusable($('view'));
  for (const fn of AFTER) fn();

  if (keepFocus) {
    const el = $(keepFocus.id);
    if (el) { el.focus(); if (el.setSelectionRange && keepFocus.pos != null) el.setSelectionRange(keepFocus.pos, keepFocus.pos); }
  } else {
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  // Which URL the screen was last drawn for. The tests wait on it rather than on
  // a timer, and it costs nothing to leave in.
  document.documentElement.dataset.rendered = location.hash;
}

/* ---------- events, all delegated ---------- */
/** Navigates, re-rendering in place when the hash is already what we want. */
function goTo(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}
/**
 * Rewrites the current URL's query without a history entry: a select or a
 * date box is adjusting this screen, not going somewhere new.
 */
function setQuery(changes) {
  const q = new URLSearchParams(CUR.query);
  for (const [k, v] of Object.entries(changes)) { if (v === null || v === '' || v === 'all') q.delete(k); else q.set(k, v); }
  const s = q.toString();
  const path = location.hash.replace(/\?.*$/, '');
  history.replaceState(history.state, '', location.pathname + location.search + path + (s ? '?' + s : ''));
  syncFromUrl();
}

function onActivate(e) {
  const pg = e.target.closest('[data-page]');
  if (pg && !pg.disabled) { T[pg.dataset.pager].page = +pg.dataset.page; render(); return; }
  // The filter and the tab live in the hash, so a filtered list is a link the
  // reader can bookmark, share and come back to.
  const chipState = e.target.closest('[data-state]');
  if (chipState) {
    T.concepts.page = 1;
    const s = chipState.dataset.state;
    return goTo(LH('concepts', s === 'all' ? null : s, { domain: CUR.query.get('domain') }));
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { T.review.page = 1; return goTo(LH('review', tab.dataset.tab === 'due' ? null : tab.dataset.tab)); }
  const mtype = e.target.closest('[data-mtype]');
  if (mtype) {
    T.memory.page = 1;
    const q = CUR.query;
    return goTo(MH('timeline', mtype.dataset.mtype === 'all' ? null : mtype.dataset.mtype,
      { tag: q.get('tag'), from: q.get('from'), to: q.get('to') }));
  }
  const go = e.target.closest('[data-go]');
  if (go) return goTo(go.dataset.go);
}

$('view').addEventListener('click', onActivate);
// Anything clickable is operable from the keyboard: rows, tiles and the pills
// are divs and table rows, so Enter and Space have to be wired by hand.
$('view').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (!e.target.closest('[data-go],[data-state],[data-tab],[data-page],[data-mtype]')) return;
  e.preventDefault();
  onActivate(e);
});

$('view').addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    T.concepts.q = e.target.value;
    T.concepts.page = 1;
    render({ id:'q', pos:e.target.selectionStart });
  }
  if (e.target.id === 'mq') {
    T.memory.q = e.target.value;
    T.memory.page = 1;
    render({ id:'mq', pos:e.target.selectionStart });
  }
});

$('view').addEventListener('change', (e) => {
  if (e.target.id === 'dom') { T.concepts.page = 1; setQuery({ domain: e.target.value }); }
  if (e.target.id === 'sort') { T.concepts.sort = e.target.value; T.concepts.page = 1; render(); }
  if (e.target.id === 'mtag') { T.memory.page = 1; setQuery({ tag: e.target.value }); }
  if (e.target.id === 'mfrom') { T.memory.page = 1; setQuery({ from: e.target.value }); }
  if (e.target.id === 'mto') { T.memory.page = 1; setQuery({ to: e.target.value }); }
});

addEventListener('hashchange', () => { if (INV) { closePicker(false); syncFromUrl(); } });

let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (S) render({ id:'q', pos:null }); }, 120);
});

document.querySelectorAll('[data-ground]').forEach((b) => {
  b.addEventListener('click', () => { window.eklavyaGround.set(b.dataset.ground); if (S) render(); });
});

/* ---------- staying honest about how old this page is ---------- */
// ponytail: a poll, not SSE. Ceiling: a change shows up to POLL_MS late, and
// each tick rebuilds the whole payload server-side to read one field off it.
// Both are nothing for one reader over loopback once a minute. The upgrade is
// SSE over an event cursor (PRD DASH-01) — `s.cursor` is already the cursor,
// so that swap is this function, not the page.
const POLL_MS = 60000;
let polling = false;

/**
 * Announced, never silent, and that is the whole design.
 *
 * A silent re-render moves the table the reader is halfway down, scrolls them
 * back to the top and drops the caret out of the search box — the page would
 * be fighting the person reading it. So the poll touches nothing but a button:
 * the view keeps rendering from the payload it booted with until the reader
 * asks for the new one. That also means there is no live state to reconcile
 * with a view derived from the old snapshot; the reload does that.
 */
function poll() {
  // Nothing to do if we never loaded, a request is already out, the notice is
  // already up, or nobody is looking — a background tab must not poll at all.
  if (!S || polling || !$('stale').hidden || document.visibilityState !== 'visible') return;
  polling = true;
  fetch('/api/state')
    .then((r) => r.json())
    .then((s) => { if (s.cursor !== S.cursor) $('stale').hidden = false; })
    // A failed poll changes nothing: the page keeps working on the data it has.
    // One unreachable server must not blank a dashboard that is merely stale.
    .catch(() => {})
    .then(() => { polling = false; });
}

setInterval(poll, POLL_MS);
// Coming back to a tab left open all afternoon should not mean waiting out the
// interval before the page admits it is stale.
addEventListener('visibilitychange', poll);
$('stale').addEventListener('click', () => location.reload());

/* ---------- boot ---------- */
// The head script runs before the toggle exists, so its aria-pressed state has
// to be applied again once the markup is there — otherwise a reader on paper is
// shown "ink" as the active ground.
window.eklavyaGround.apply(window.eklavyaGround.read());

const json = (url) => fetch(url).then((r) => {
  if (!r.ok) throw new Error(`${url} answered ${r.status}`);
  return r.json();
});

Promise.all([json('/api/state'), json('/api/projects')]).then(([s, inv]) => {
  S = s;
  INV = inv;
  $('dbline').textContent = s.db_path;
  // Totals are aggregated in SQL over the whole table, so a cap can only
  // shorten a history list — but say so rather than let it look complete.
  if (s.attempts_shown < s.attempts_total) {
    $('foot-note').textContent =
      ` Question histories show the most recent ${s.attempts_shown} of ${s.attempts_total} answers.`;
  }
  const c = s.config;
  // Same rule as the status bar in `statusline.ts`: `enforced` is a word worth
  // a slot, unenforced quizzing is not -- it was the default on three bars in
  // four and said nothing. Questions off is its own state and says so, because
  // an empty-looking dial line is what sent people looking for a broken plugin.
  const dials = [
    c.quiz_enabled ? (c.quiz_enforced ? 'enforced' : null) : 'questions off',
    c.focus,
    c.cadence,
    c.difficulty,
  ].filter(Boolean);
  $('dials').innerHTML = `<span class="mono">${dials.map(esc).join(' · ')}</span>`;

  // One selector for both workflows, built from the one inventory: a project
  // that logged concepts but was never asked a question, or that only ever
  // captured memory, is a project and is listed.
  const sel = $('proj');
  for (const p of inv.projects) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name + (p.available === false ? ' (checkout gone)' : '');
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    const v = sel.value || null;
    try { if (v) localStorage.setItem('eklavya-dash-project', v); else localStorage.removeItem('eklavya-dash-project'); } catch (e) {}
    // A real navigation: the scope is part of the URL, so Back undoes it.
    goTo(href(CUR.wf, CUR.page, CUR.param || null, { project: v, ...Object.fromEntries(
      (WORKFLOWS[CUR.wf].pages[CUR.page]?.query ?? []).map((k) => [k, CUR.query.get(k)])) }));
  });

  syncFromUrl();
}).catch((e) => {
  $('view').innerHTML = `<p class="empty">Could not read the database: ${esc(e.message)}</p>`;
});
</script>
</body>
</html>

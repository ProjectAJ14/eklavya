name: Test

# Every pull request, and every push to `main`. Nothing else: a push to a
# feature branch that has a PR open would otherwise run this suite twice, once
# per event, and put two "Test / test" checks on the same PR.
#
# Release also installs and tests before it publishes, so `main` is covered
# twice. That is deliberate — the release step is load-bearing there, and this
# one is the check branch protection can point at.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch per event. `head_ref` is the source branch on a
# pull_request and empty on a push, so the event stays in the group: a PR
# merged to `main` would otherwise collide with its own merge push and get
# cancelled, and GitHub renders a cancelled run as a failed check.
#
# `cancel-in-progress` drops the stale run when you push again a minute later.
concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mcp
      # Usually 17-30s. The OS packages come from the Azure apt mirror, which is
      # sometimes slow or stalls. Retrying the whole install under `timeout` did
      # not work: `timeout` killed npx but not the apt-get it had started, so that
      # apt-get kept the dpkg lock and every retry failed on it. So apt runs once,
      # and apt itself drops and retries a connection that sends nothing for 20s;
      # a slow but moving download is left to finish. Only the browser download,
      # which is plain Node and dies with `timeout`, is cut and retried.
      # timeout-minutes still bounds the whole step if the mirror is down.
      - name: Install Chromium
        timeout-minutes: 5
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          npx playwright-core install-deps chromium
          for attempt in 1 2 3; do
            timeout -k 5 60 npx playwright-core install chromium && exit 0
            echo "Chromium download attempt $attempt failed or timed out"
          done
          exit 1
        working-directory: mcp
      - name: Build server
        run: npm run build
        working-directory: mcp
      - name: Run test shard
        run: node ../.github/scripts/test-shard.mjs ${{ matrix.shard }}/5
        working-directory: mcp
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: mcp/coverage/shard-${{ matrix.shard }}.tgz
          if-no-files-found: error
          compression-level: 0 # The tarball is already compressed.
          retention-days: 1
          # A re-run of a failed shard would otherwise add a second artifact of
          # the same name, and the merge job could download the failed one.
          overwrite: true

  # Preserve the required Test / test check. Never accept partial coverage or
  # a failed/missing shard, even when its artifact was uploaded successfully.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require successful shards
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mcp
      - name: Build server for source maps
        run: npm run build
        working-directory: mcp
      - name: Verify shard failure handling
        run: node .github/scripts/test-ci.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: mcp/coverage/shards
          merge-multiple: true
      - name: Merge results and enforce coverage
        run: node ../.github/scripts/merge-coverage.mjs 5
        working-directory: mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            mcp/coverage/
            !mcp/coverage/tmp/
            !mcp/coverage/shard-*/
            !mcp/coverage/shards/
            !mcp/coverage/*.tgz
          retention-days: 7

  # A PR that changes product code must also change the manual and a README.
  # The script's header lists what counts as product code.
  docs-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: .github/scripts/check-docs-sync.sh "origin/${{ github.base_ref }}"

  # Code ported from microsoft/TokenEconomizer keeps its Apache-2.0 attribution.
  economy-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: .github/scripts/check-economy-headers.sh

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # postbuild validates every public page, preview image, sitemap and local link.
      - run: npm run build
        working-directory: web

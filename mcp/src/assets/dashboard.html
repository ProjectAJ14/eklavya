<script>
/* ============================================================
   One payload, many views.

   `/api/state` ships flat rows — every attempt, every logged context, one row
   per day — and everything on screen is derived here. That is why a new view is
   a render function and not a new endpoint.
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
const base = (p) => (p ? p.split('/').filter(Boolean).pop() : 'unattributed');
const DAY_MS = 86400000;

/* SQLite writes `2026-09-05 21:04:00` in UTC with no zone marker; `new Date()`
   would read that as local time and shift every timestamp by the offset. */
const parse = (ts) => (ts ? new Date(String(ts).replace(' ', 'T') + (String(ts).endsWith('Z') ? '' : 'Z')) : null);
const dayKey = (d) => d.toISOString().slice(0, 10);
const fromKey = (k) => new Date(k + 'T00:00:00Z');

const fmtDay = (k) => fromKey(k).toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' });
const fmtDate = (ts) => {
  const d = parse(ts); if (!d) return '—';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year: sameYear ? undefined : 'numeric' });
};
const ago = (ts) => {
  const d = parse(ts); if (!d) return '—';
  const n = Math.floor((Date.now() - d.getTime()) / DAY_MS);
  return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n < 30 ? n + ' days ago'
       : n < 60 ? 'a month ago' : Math.round(n / 30) + ' months ago';
};
const inDays = (ts) => {
  const d = parse(ts); if (!d) return null;
  return Math.round((d.getTime() - Date.now()) / DAY_MS);
};
const whenDue = (ts) => {
  const n = inDays(ts);
  if (n === null) return 'not scheduled';
  return n < 0 ? Math.abs(n) + ' days overdue' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days';
};
const stamp = (ts) => {
  const d = parse(ts); if (!d) return '—';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' })
    + ', ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
};
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const TIER = { 1:'recall', 2:'mechanism', 3:'judgement', 4:'failure modes', 5:'design' };
const tierLabel = (t) => `T${t}${TIER[t] ? ' ' + TIER[t] : ''}`;

let S = null;                 // the payload
let INV = null;               // /api/projects: the one project inventory both workflows share
let PROJECT = null;           // project scope: null for all, else an inventory id ('~' unattributed, '*' no repository)
let SCOPE = null;             // Set of slugs touched in scope, or null for all
const AFTER = [];             // render hooks that need a laid-out DOM (charts)
/** The screen being shown, as the URL says it: `{ wf, page, param, query }`. */
let CUR = { wf:'learning', page:'dashboard', param:'', query:new URLSearchParams() };

/* ---------- per-view control state, kept across re-renders ---------- */
const T = {
  concepts: { page:1, q:'', state:'all', domain:'all', sort:'weakest' },
  review:   { page:1, tab:'due' },
  sessions: { page:1 },
  msessions:{ page:1 },
  attempts: { page:1 },
  domain:   { page:1 },
  concept:  { page:1 },
  session:  { page:1 },
  memory:   { page:1, q:'', tag:'all', since:'', until:'' },
  reuse:    { page:1, only:'all' },
  artifacts:{ page:1, q:'' },
};
const PER = 20;

/* ============================================================
   Scope

   Every row names its project in whatever spelling it was written with: a
   folded checkout on an attempt, the unfolded worktree on a gate, nothing at
   all on a pre-migration row. `/api/projects` resolves every spelling to one
   id (`aliases`), plus the sessions whose gate named no project but whose own
   answers or evidence did (`sessions`). `pid()` is the only place a row is
   given a project, so the selector, the filters and every count agree.
   ============================================================ */
const pid = (raw, sid) => {
  const v = raw == null ? '' : String(raw).trim();
  if (!v) return (sid && INV.sessions[sid]) || '~';
  return INV.aliases[v] ?? v;
};
const inScope = (raw, sid) => PROJECT === null || pid(raw, sid) === PROJECT;
const projectById = (id) => INV.projects.find((p) => p.id === id) ?? null;
const pname = (raw, sid) => { const id = pid(raw, sid); return projectById(id)?.name ?? base(id); };

function recomputeScope() {
  if (PROJECT === null) { SCOPE = null; return; }
  SCOPE = new Set();
  for (const a of S.attempts) if (inScope(a.repo, a.session_id)) SCOPE.add(a.slug);
  for (const l of S.logged) if (inScope(l.repo, l.session_id)) SCOPE.add(l.slug);
}
const conceptsInScope = () => (SCOPE ? S.concepts.filter((c) => SCOPE.has(c.slug)) : S.concepts);
const seenConcepts = () => conceptsInScope().filter((c) => c.seen);
const attemptsInScope = () => S.attempts.filter((a) => inScope(a.repo, a.session_id));
const loggedInScope = () => S.logged.filter((l) => inScope(l.repo, l.session_id));
const scopeName = () => (PROJECT === null ? 'all projects' : projectById(PROJECT)?.name ?? PROJECT);
/** Inventory rows in scope — one, or all of them. */
const projectsInScope = () => INV.projects.filter((p) => PROJECT === null || p.id === PROJECT);

/** One row per calendar day in scope: { day, passed, missed, skipped, total }. */
function dailyInScope() {
  const m = new Map();
  for (const d of S.daily) {
    if (!inScope(d.repo)) continue;
    const cur = m.get(d.day) ?? { day:d.day, passed:0, missed:0, skipped:0, total:0 };
    cur.passed += d.passed; cur.missed += d.missed; cur.skipped += d.skipped;
    cur.total = cur.passed + cur.missed + cur.skipped;
    m.set(d.day, cur);
  }
  return m;
}

/** Fills every day in a window, including the empty ones — the gaps are data. */
function fillDays(map, n, endKey) {
  const out = [];
  const end = endKey ? fromKey(endKey) : new Date();
  end.setUTCHours(0, 0, 0, 0);
  const cur = new Date(end.getTime() - (n - 1) * DAY_MS);
  for (let i = 0; i < n; i++) {
    const k = dayKey(cur);
    out.push(map.get(k) ?? { day:k, passed:0, missed:0, skipped:0, total:0 });
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  return out;
}

/** Consecutive days with at least one answer, counting back from today. */
function streaks(map) {
  const active = new Set([...map.values()].filter((d) => d.total > 0).map((d) => d.day));
  let current = 0;
  const cur = new Date(); cur.setUTCHours(0, 0, 0, 0);
  if (!active.has(dayKey(cur))) cur.setUTCDate(cur.getUTCDate() - 1); // today may not have started yet
  while (active.has(dayKey(cur))) { current += 1; cur.setUTCDate(cur.getUTCDate() - 1); }

  let best = 0, run = 0, prev = null;
  for (const k of [...active].sort()) {
    run = prev && fromKey(k).getTime() - fromKey(prev).getTime() === DAY_MS ? run + 1 : 1;
    best = Math.max(best, run);
    prev = k;
  }
  return { current, best, days: active.size };
}

/** Sessions, rebuilt from the two row sets that mention a session id. */
function sessions() {
  const m = new Map();
  const get = (id) => {
    if (!m.has(id)) m.set(id, { id, repo:null, logged:[], asked:[], mem:null, first:null, last:null });
    return m.get(id);
  };
  /* Two timestamp shapes meet here: SQLite's `2026-09-05 21:04:00` from
     attempts, and the ISO string evidence carries. Compared as text, 'T' sorts
     after ' ', so the same instant from the two halves would order wrongly —
     flatten both to one shape before comparing. */
  const flat = (ts) => String(ts ?? '').replace('T', ' ').replace('Z', '');
  const touch = (s, ts) => {
    const t = flat(ts);
    if (!t) return;
    if (!s.first || t < s.first) s.first = t;
    if (!s.last || t > s.last) s.last = t;
  };
  for (const l of loggedInScope()) { const s = get(l.session_id); s.logged.push(l); s.repo = s.repo ?? l.repo; touch(s, l.ts); }
  for (const a of attemptsInScope()) {
    if (!a.session_id) continue;
    const s = get(a.session_id); s.asked.push(a); s.repo = s.repo ?? a.repo; touch(s, a.ts);
  }
  // A session that captured evidence but logged no concept is still a session:
  // leaving it out would make the memory half invisible in the one place the
  // two halves are supposed to line up.
  for (const mem of S.memory_sessions ?? []) {
    if (!inScope(mem.project, mem.session_id)) continue;
    const s = get(mem.session_id);
    s.mem = mem; s.repo = s.repo ?? mem.project;
    touch(s, mem.first); touch(s, mem.last);
  }
  return [...m.values()]
    .map((s) => ({ ...s, passed: s.asked.filter((a) => a.grade >= 3).length }))
    .sort((a, b) => String(b.last).localeCompare(String(a.last)));
}

/**
 * What a session is called in a list. The context line the agent wrote is the
 * only human description there is; a session that logged nothing readable is
 * named by its concepts rather than by its uuid, and never by a question — a
 * question stem in the description slot reads as if the session were about
 * asking it.
 */
function sessionLabel(s) {
  const ctx = s.logged.find((l) => l.context && String(l.context).trim());
  if (ctx) return ctx.context;
  const names = s.logged.map((l) => l.name);
  if (names.length) return names.slice(0, 4).join(' · ') + (names.length > 4 ? ` +${names.length - 4}` : '');
  if (s.asked.length) return plural(s.asked.length, 'question') + ' answered';
  if (s.mem) return plural(s.mem.events, 'evidence event') + ' captured';
  return s.id;
}

/* ============================================================
   Small view helpers
   ============================================================ */
const meter = (p, kind) => `<div class="meter${kind ? ' ' + kind : ''}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`;
const gradeBadge = (a) => {
  if (a.outcome === 'declined') return '<span class="grade">skipped</span>';
  if (a.outcome === 'dont_know') return '<span class="grade">blanked</span>';
  return `<span class="grade ${a.grade >= 3 ? 'pass' : 'miss'}">${a.grade}/5</span>`;
};
const statePill = (c) =>
  !c.seen ? '<span class="pill new">not asked</span>'
  : c.mastered ? '<span class="pill ok">mastered</span>'
  : c.due ? '<span class="pill due">due</span>'
  : '<span class="pill">learning</span>';

/**
 * `[label, value, note, kind, go]`. A tile with a `go` is a link: a number the
 * reader wants to act on — 36 due, 28 sessions — should take them to the list it
 * counts, not make them find it in the sidebar.
 */
function tiles(items) {
  return `<div class="stats">` + items.map(([k, v, n, kind, go]) =>
    `<div class="tile${kind ? ' is-' + kind : ''}"${go ? ` data-go="${esc(go)}" tabindex="0" role="link"` : ''}>`
    + `<b>${esc(k)}</b><strong>${esc(v)}</strong><span>${esc(n)}</span></div>`
  ).join('') + `</div>`;
}

function card(title, hint, body, opts = {}) {
  const head = title
    ? `<div class="head${opts.aside ? ' head--row' : ''}"><div><h2>${esc(title)}</h2>${hint ? `<p>${esc(hint)}</p>` : ''}</div>${opts.aside ?? ''}</div>`
    : '';
  return `<section class="card">${head}${body}</section>`;
}

/* ---------- progressive disclosure ---------- */

/**
 * Which folds the reader opened or closed, by id, so a page they come back to
 * — or one re-rendered by a resize or a ground switch — keeps the detail they
 * asked for. Per-viewer convenience only: storage that throws means defaults.
 */
const FOLD_KEY = 'eklavya-dash-folds';
let FOLD = {};
try {
  const v = JSON.parse(localStorage.getItem(FOLD_KEY) || '{}');
  if (v && typeof v === 'object' && !Array.isArray(v)) FOLD = v;
} catch (e) { FOLD = {}; }
const isOpen = (id, dflt) => (typeof FOLD[id] === 'boolean' ? FOLD[id] : dflt);
const openAttr = (id, dflt) => (isOpen(id, dflt) ? ' open' : '');

/**
 * A page's head: its title, one mono line of counts, and the explanation of how
 * the numbers are counted folded under a "How this works" line. `title` and
 * every count are HTML the caller escaped.
 */
function pageHead(title, counts = [], about = '', back = '') {
  const id = `about:${CUR.wf}:${CUR.page}`;
  return `<div>${back}<h1 class="page__title">${title}</h1>
    ${counts.length ? `<p class="counts">${counts.join(' · ')}</p>` : ''}
    ${about ? `<details class="about" data-fold="${esc(id)}"${openAttr(id, false)}><summary>How this works</summary><p>${about}</p></details>` : ''}</div>`;
}

/**
 * A secondary card, folded: the summary line carries the title and a peek at
 * what is inside (a count, a verdict), so a closed fold still answers
 * something. A chart inside a closed fold is drawn when it opens.
 */
function fold(id, title, peek, body, opts = {}) {
  return `<details class="card fold" data-fold="${esc(id)}"${openAttr(id, !!opts.open)}>
    <summary><h2>${esc(title)}</h2>${peek ? `<span class="fold__peek${opts.warn ? ' warn' : ''}">${peek}</span>` : ''}</summary>
    <div class="fold__body">${opts.hint ? `<p class="hint">${esc(opts.hint)}</p>` : ''}${body}</div></details>`;
}

/** The one thing waiting on the reader, or nothing. `html` is escaped by the caller. */
const nextStep = (html, ok) => `<div class="next${ok ? ' ok' : ''}"><p>${html}</p></div>`;

/**
 * One line per item: `{ t, s, v, go, cls }` — a title, a quiet mono second
 * line, one value on the right, and where it opens. All HTML the caller escaped.
 */
function lines(items, empty = 'Nothing here yet.') {
  if (!items.length) return `<p class="empty">${empty}</p>`;
  return `<ul class="lines">` + items.map((x) =>
    `<li${x.go ? ` data-go="${esc(x.go)}" role="link"` : ''}${x.cls ? ` class="${x.cls}"` : ''}>`
    + `<div class="ln__main"><span class="ln__t">${x.t}</span>${x.s ? `<span class="ln__s">${x.s}</span>` : ''}</div>`
    + (x.v != null && x.v !== '' ? `<div class="ln__v">${x.v}</div>` : '') + `</li>`).join('') + `</ul>`;
}

/**
 * A question and its answer as one line that opens to the options and the
 * feedback. `lead` is plain text (a summary holds no links); `linkConcept` puts
 * the way to the concept's page inside the opened body instead.
 */
function qaLine(a, lead, linkConcept = false) {
  let opts = [];
  try { opts = a.options ? JSON.parse(a.options) : []; } catch { opts = []; }
  return `<details class="qa">
    <summary class="qa__meta">${lead}<span class="qa__line">${esc(a.question)}</span>${gradeBadge(a)}</summary>
    <div class="qa__meta" style="margin-top:var(--space-3)"><span>${esc(tierLabel(a.tier))}</span>
      ${a.format ? `<span>${esc(a.format)}</span>` : ''}${a.level ? `<span>${esc(a.level)}</span>` : ''}
      ${a.repo ? `<span>${esc(pname(a.repo, a.session_id))}</span>` : ''}
      ${linkConcept ? `<a class="link sp" data-go="${esc(LH('concept', a.slug))}">${esc(a.name)} →</a>` : ''}</div>
    ${opts.length ? `<ul class="qa__opts">${opts.map((o) =>
      `<li class="${a.answer && o === a.answer ? 'picked' : ''}">${esc(o)}</li>`).join('')}</ul>` : ''}
    ${a.answer && !opts.length ? `<p class="qa__a"><b>You said:</b> ${esc(a.answer)}</p>` : ''}
    ${a.feedback ? `<p class="qa__f">${esc(a.feedback)}</p>` : ''}
  </details>`;
}

function table(cols, rows) {
  if (!rows.length) return '<p class="empty">Nothing here yet.</p>';
  return `<div class="scroll"><table><thead><tr>`
    + cols.map((c) => `<th${c.n ? ' class="num"' : ''}${c.w ? ` style="width:${c.w}"` : ''}>${esc(c.t)}</th>`).join('')
    + `</tr></thead><tbody>` + rows.join('') + `</tbody></table></div>`;
}

/**
 * Pagination as a pure function of (total, page): the caller slices, this draws
 * the controls. Windowed to seven buttons so a hundred pages still fit a card.
 */
function pager(key, total, page, per = PER) {
  const pages = Math.max(1, Math.ceil(total / per));
  if (total <= per) return '';
  const from = (page - 1) * per + 1;
  const to = Math.min(total, page * per);
  const win = [];
  const push = (n) => { if (n >= 1 && n <= pages && !win.includes(n)) win.push(n); };
  push(1); for (let i = page - 2; i <= page + 2; i++) push(i); push(pages);
  win.sort((a, b) => a - b);

  let btns = `<button data-pager="${key}" data-page="${page - 1}"${page === 1 ? ' disabled' : ''} aria-label="Previous page">‹</button>`;
  let last = 0;
  for (const n of win) {
    if (n - last > 1) btns += `<button disabled aria-hidden="true">…</button>`;
    btns += `<button data-pager="${key}" data-page="${n}"${n === page ? ' aria-current="true"' : ''}>${n}</button>`;
    last = n;
  }
  btns += `<button data-pager="${key}" data-page="${page + 1}"${page === pages ? ' disabled' : ''} aria-label="Next page">›</button>`;
  return `<div class="pager"><span class="pager__count">${from}–${to} of ${total}</span><div class="pager__btns">${btns}</div></div>`;
}

/** Clamps a stored page number to a list that may have shrunk under a filter. */
function page(key, total, per = PER) {
  const pages = Math.max(1, Math.ceil(total / per));
  if (T[key].page > pages) T[key].page = pages;
  if (T[key].page < 1) T[key].page = 1;
  return T[key].page;
}
const slice = (arr, p, per = PER) => arr.slice((p - 1) * per, p * per);

/* ============================================================
   Charts — hand-rolled SVG. No library, no network, both grounds.
   ============================================================ */

/** Stacked daily bars: right at the base, then missed, then skipped. */
function chartActivity(el, days) {
  const tip = el.parentElement.querySelector('.tip');
  const W = Math.max(320, el.parentElement.clientWidth || 900);
  const H = 190, PAD_B = 22, PAD_L = 26;
  const max = Math.max(...days.map((d) => d.total), 1);
  const step = (W - PAD_L) / days.length;
  const bw = Math.min(26, Math.max(4, step - 5));
  const y = (v) => (H - PAD_B) - (v / max) * (H - PAD_B - 10);
  const SEGMENTS = [['passed', 'var(--spot)'], ['missed', 'var(--warning)'], ['skipped', 'var(--faint-2)']];

  let out = '';
  for (let i = 0; i <= 2; i++) {
    const v = Math.round((max / 2) * i);
    out += `<line class="gridline" x1="${PAD_L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`
         + `<text class="axis" x="0" y="${y(v) + 3}">${v}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(48 / step));
  days.forEach((d, i) => {
    const x = PAD_L + i * step + (step - bw) / 2;
    let acc = 0, seg = '', top = 'var(--spot)';
    for (const [key, color] of SEGMENTS) {
      if (!d[key]) continue;
      const h = (d[key] / max) * (H - PAD_B - 10);
      const inset = acc ? 2 : 0;   // a 2px surface gap between stacked fills
      seg += `<rect x="${x}" y="${y(acc) - h + inset}" width="${bw}" height="${Math.max(1, h - inset)}" fill="${color}"/>`;
      acc += d[key]; top = color;
    }
    out += `<rect class="hit" x="${PAD_L + i * step}" y="0" width="${step}" height="${H - PAD_B}" data-i="${i}" tabindex="0"/>`
         + `<g class="col">${seg}${acc ? `<rect x="${x}" y="${y(acc)}" width="${bw}" height="3" fill="${top}"/>` : ''}</g>`;
    if (i === 0 || i === days.length - 1 || (i % labelEvery === 0 && i < days.length - labelEvery)) {
      out += `<text class="axis" x="${x + bw / 2}" text-anchor="middle" y="${H - 6}">${fmtDay(d.day)}</text>`;
    }
  });
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.style.height = H + 'px';
  el.innerHTML = out;

  if (!tip) return;
  el.querySelectorAll('.hit').forEach((hit) => {
    const show = () => {
      const d = days[+hit.dataset.i];
      tip.innerHTML = `<div class="mono">${esc(fmtDay(d.day))}</div>`
        + [['Right', d.passed], ['Missed', d.missed], ['Skipped', d.skipped]]
          .map(([k, v]) => `<div class="r"><span>${k}</span><span>${v}</span></div>`).join('');
      const r = hit.getBoundingClientRect(), p = el.parentElement.getBoundingClientRect();
      tip.style.left = (r.left - p.left + r.width / 2) + 'px';
      tip.style.top = (r.top - p.top - 8) + 'px';
      tip.classList.add('on');
    };
    hit.addEventListener('mouseenter', show);
    hit.addEventListener('focus', show);
    hit.addEventListener('mouseleave', () => tip.classList.remove('on'));
    hit.addEventListener('blur', () => tip.classList.remove('on'));
  });
}

/**
 * Calendar heatmap: one column per week, one row per weekday. Every day in the
 * window gets a cell, empty ones included — a fortnight of silence has to read
 * as a fortnight of silence, not close up into the next session.
 */
function chartHeatmap(el, map) {
  const CELL = 13, GAP = 3, PAD_T = 18, PAD_L = 26;
  // The window is chosen from the width rather than the width from the window:
  // a wide card shows a year, a phone shows a quarter, and the cell stays the
  // same size on both. Capped at 53 because that is all the payload carries.
  const avail = (el.parentElement.clientWidth || 700) - PAD_L - 2;
  const weeks = Math.max(12, Math.min(53, Math.floor(avail / (CELL + GAP))));
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  end.setUTCDate(end.getUTCDate() + (6 - end.getUTCDay()));      // to the end of this week
  const total = weeks * 7;
  const days = fillDays(map, total, dayKey(end));
  const max = Math.max(...days.map((d) => d.total), 1);

  let out = '', lastMonth = '';
  days.forEach((d, i) => {
    const col = Math.floor(i / 7), row = i % 7;
    const x = PAD_L + col * (CELL + GAP), y = PAD_T + row * (CELL + GAP);
    const date = fromKey(d.day);
    if (row === 0) {
      const m = date.toLocaleDateString(undefined, { month:'short', timeZone:'UTC' });
      // Not in the last two columns: a month label starting there runs off the
      // right edge of the card.
      if (m !== lastMonth) { if (col < weeks - 2) out += `<text class="axis" x="${x}" y="${PAD_T - 6}">${m}</text>`; lastMonth = m; }
    }
    const future = date.getTime() > Date.now();
    const fill = d.total ? 'var(--spot)' : future ? 'transparent' : 'var(--mass)';
    const op = d.total ? (0.3 + 0.7 * Math.min(1, d.total / max)).toFixed(2) : 1;
    out += `<rect class="cell" x="${x}" y="${y}" width="${CELL}" height="${CELL}" fill="${fill}" fill-opacity="${op}">`
         + `<title>${fmtDate(d.day)} — ${d.total ? plural(d.total, 'answer') + ` (${d.passed} right)` : 'nothing'}</title></rect>`;
  });
  ['Mon', 'Wed', 'Fri'].forEach((label, n) => {
    const row = [1, 3, 5][n];
    out += `<text class="axis" x="0" y="${PAD_T + row * (CELL + GAP) + CELL - 3}">${label}</text>`;
  });
  const W = PAD_L + weeks * (CELL + GAP), H = PAD_T + 7 * (CELL + GAP);
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.setAttribute('width', W); el.setAttribute('height', H);
  el.innerHTML = out;
}

/** Review load for the next fortnight, with everything overdue in one column. */
function chartForecast(el, buckets) {
  const W = Math.max(300, el.parentElement.clientWidth || 600), H = 150, PAD_B = 26, PAD_L = 24;
  const max = Math.max(...buckets.map((b) => b.n), 1);
  const step = (W - PAD_L) / buckets.length;
  const bw = Math.min(30, Math.max(6, step - 8));
  const y = (v) => (H - PAD_B) - (v / max) * (H - PAD_B - 14);

  let out = `<line class="gridline" x1="${PAD_L}" x2="${W}" y1="${H - PAD_B}" y2="${H - PAD_B}"/>`;
  buckets.forEach((b, i) => {
    const x = PAD_L + i * step + (step - bw) / 2;
    const fill = b.overdue ? 'var(--warning)' : 'var(--spot)';
    if (b.n) {
      out += `<rect x="${x}" y="${y(b.n)}" width="${bw}" height="${(H - PAD_B) - y(b.n)}" fill="${fill}">`
           + `<title>${esc(b.label)}: ${plural(b.n, 'concept')}</title></rect>`
           + `<text class="axis" x="${x + bw / 2}" text-anchor="middle" y="${y(b.n) - 5}">${b.n}</text>`;
    }
    out += `<text class="axis" x="${x + bw / 2}" text-anchor="middle" y="${H - 8}">${esc(b.short)}</text>`;
  });
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.style.height = H + 'px';
  el.innerHTML = out;
}

/** One concept's grades in order — the shape of learning it, not a number. */
function chartGrades(el, attempts) {
  const pts = [...attempts].reverse();
  const W = Math.max(240, el.parentElement.clientWidth || 480), H = 120, PAD_B = 20, PAD_L = 20;
  const step = pts.length > 1 ? (W - PAD_L - 10) / (pts.length - 1) : 0;
  const y = (g) => (H - PAD_B) - (g / 5) * (H - PAD_B - 12);

  let out = '';
  for (const g of [0, 3, 5]) {
    out += `<line class="gridline" x1="${PAD_L}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/>`
         + `<text class="axis" x="0" y="${y(g) + 3}">${g}</text>`;
  }
  const xy = pts.map((a, i) => [PAD_L + i * step + (pts.length === 1 ? (W - PAD_L) / 2 : 0), y(a.grade)]);
  if (xy.length > 1) {
    out += `<polyline fill="none" stroke="var(--line-2)" stroke-width="1.5" points="${xy.map((p) => p.join(',')).join(' ')}"/>`;
  }
  pts.forEach((a, i) => {
    const [x, cy] = xy[i];
    const fill = a.outcome === 'declined' || a.outcome === 'dont_know' ? 'var(--faint-2)'
      : a.grade >= 3 ? 'var(--spot)' : 'var(--warning)';
    out += `<circle cx="${x}" cy="${cy}" r="4.5" fill="${fill}"><title>${esc(fmtDate(a.ts))} — grade ${a.grade}, ${esc(tierLabel(a.tier))}</title></circle>`;
  });
  out += `<text class="axis" x="${PAD_L}" y="${H - 4}">${esc(fmtDate(pts[0].ts))}</text>`;
  if (pts.length > 1) out += `<text class="axis" x="${W}" text-anchor="end" y="${H - 4}">${esc(fmtDate(pts.at(-1).ts))}</text>`;
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.style.height = H + 'px';
  el.innerHTML = out;
}

/** A whole, split — mastered / learning / never asked. */
function segbar(parts) {
  const total = parts.reduce((a, p) => a + p.n, 0) || 1;
  return `<div class="seg">`
    + parts.map((p) => `<span style="width:${(p.n / total) * 100}%;background:${p.color}" title="${esc(p.label)}: ${p.n}"></span>`).join('')
    + `</div><div class="seg__key">`
    + parts.map((p) => `<span><b style="background:${p.color}"></b>${esc(p.label)} ${p.n}</span>`).join('')
    + `</div>`;
}

/**
 * A chart measures its parent, and a closed <details> has no width — so a
 * chart inside a closed fold waits in `LAZY` until the fold opens.
 */
const LAZY = new Map();
const chart = (id, fn) => {
  AFTER.push(() => {
    const el = $(id);
    if (!el) return;
    if (el.closest('details:not([open])')) LAZY.set(id, fn);
    else fn(el);
  });
};

/* ============================================================
   The memory half

   Everything above is derived from one payload. The corpus is the exception:
   an observation carries a narrative and the tool output behind it, so the
   timeline is paged over `/api/memory` instead of shipped whole on every load.
   That makes exactly two views asynchronous, and both go through `fill()`.
   ============================================================ */

/**
 * Which render a response belongs to. `render()` bumps it, so a response that
 * lands after the reader has moved on — to another page, another project or the
 * other workflow — is dropped instead of painting over the screen they are on.
 * Per render rather than per request: a view with two fills keeps both.
 */
let GEN = 0;

/**
 * Renders a placeholder now and the real markup when the fetch lands. Queued
 * through `AFTER` like a chart, for the same reason — the target element does
 * not exist until `render()` has written the view's `innerHTML`.
 */
function fill(id, url, draw) {
  const gen = GEN;
  AFTER.push(() => {
    fetch(url).then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    }).then((d) => {
      const el = $(id);
      if (!el || gen !== GEN) return;
      // A draw can queue its own charts and fills (a session page drawn from a
      // lookup does); the render that queued this one has already run its hooks.
      AFTER.length = 0;
      el.innerHTML = draw(d);
      focusable(el);
      for (const fn of AFTER.splice(0)) fn();
    }).catch((e) => {
      const el = $(id);
      if (el && gen === GEN) el.innerHTML = `<p class="empty">Could not load: ${esc(e.message)}</p>`;
    });
  });
}

/**
 * Anything with a `data-go` is a link, so it has to be reachable by Tab: rows,
 * tiles and the `<a class="link">` shorthand, which has no `href` and so is
 * not focusable on its own.
 */
function focusable(root) {
  root.querySelectorAll('tr.row, [data-go]').forEach((el) => {
    if (el.tabIndex < 0) el.tabIndex = 0;
    if (el.tagName === 'A' && !el.hasAttribute('href')) el.setAttribute('role', 'link');
  });
}

/** Everything stored is untrusted text: a title is whatever a tool printed. */
const tagPills = (tags) => (tags ?? []).map((t) => `<span class="pill">${esc(t)}</span>`).join(' ');
const jsonList = (raw) => { try { const v = JSON.parse(raw || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };

/** The visible marker on a row that is no longer the current claim. */
function entryMark(e) {
  if (e.deleted_at) return '<span class="pill gone">deleted</span>';
  if (e.superseded_by) return '<span class="pill gone">superseded</span>';
  return '';
}

/** Project scope as a query parameter; `~` (unattributed) predates memory entirely. */
function memScope(params) {
  if (PROJECT !== null) params.set('project', PROJECT);
  return params;
}

const deliveryPill = (d) =>
  d === 'confirmed' ? '<span class="pill ok">confirmed</span>'
  : d === 'prepared' ? '<span class="pill due">prepared</span>'
  : '<span class="pill">unknown</span>';

/**
 * The one sentence that says what a savings verdict means, in words, not a bare
 * percentage. `none` has two readings and they are not the same story: nothing
 * was ever reused, or plenty was and none of it was ever confirmed delivered —
 * which is why the receipt count is part of the sentence.
 */
function savingsText(s, receipts) {
  if (!s) return 'No receipts yet.';
  if (s.kind === 'saving') return `${s.percent}% less context than reading the same material from source (estimated).`;
  if (s.kind === 'overhead') return `${s.tokens} tokens more than reading from source — reuse cost more than it saved.`;
  if (s.kind === 'unavailable') return 'No confirmed delivery yet, so there is no saving to report.';
  return receipts
    ? `${plural(receipts, 'receipt')}, none of them a confirmed delivery — so there is no saving to report.`
    : 'No context has been reused yet.';
}

/* ============================================================
   Views
   ============================================================ */

function viewLearningDashboard() {
  const daily = dailyInScope();
  const st = streaks(daily);
  const seen = seenConcepts();
  const scoped = conceptsInScope();
  const atts = attemptsInScope();
  const answered = atts.length;
  const passed = atts.filter((a) => a.grade >= 3).length;
  const due = seen.filter((c) => c.due);
  const mastered = seen.filter((c) => c.mastered);
  // Learning's sessions; a memory-only one belongs to the other workflow.
  const sess = sessions().filter((x) => x.logged.length || x.asked.length);
  const last30 = fillDays(daily, 30);

  const weakest = seen.filter((c) => !c.mastered).sort((a, b) => a.score - b.score || b.attempts - a.attempts).slice(0, 5);

  // Logged is what the work touched; assessed is what a question was actually
  // asked about. They are different claims and the page keeps them apart.
  const logged = new Set(loggedInScope().filter((l) => (l.origin ?? 'work') === 'work').map((l) => l.slug));
  const asked = new Set(atts.map((a) => a.slug));
  const loggedAsked = [...logged].filter((x) => asked.has(x)).length;
  const inv = projectsInScope();
  const unassessed = inv.filter((p) => !p.learning.answers && p.learning.logged_concepts);

  chart('c-activity', (el) => chartActivity(el, last30));
  chart('c-heat', (el) => chartHeatmap(el, daily));

  // One next step, the most useful one. Due work outranks an empty scope.
  const next = due.length
    ? nextStep(`<strong>${plural(due.length, 'concept')} ${due.length === 1 ? 'is' : 'are'} due.</strong>
        Run <code>/eklavya:quiz</code> in Claude Code, or open the
        <a class="link" data-go="${esc(LH('review'))}">review queue</a>.`)
    : PROJECT !== null && !answered
      ? nextStep(`<strong>No assessments yet in ${esc(scopeName())}.</strong>
          ${logged.size ? `${plural(logged.size, 'concept')} recorded from its work will come up in a quiz.` : 'Nothing has been logged here either.'}`, true)
      : '';

  return [
    pageHead('Am I actually getting better?', [
      `${plural(seen.length, 'concept')} asked of ${S.totals.catalogue}`,
      plural(answered, 'answer'),
      `${logged.size} recorded from your work, ${loggedAsked} assessed`,
      `since ${esc(fmtDate(S.totals.first_answer))}`,
      ...(PROJECT === null && unassessed.length
        ? [`<a class="link" data-go="${esc(LH('projects'))}">${plural(unassessed.length, 'project')} not assessed yet</a>`] : []),
    ], `A concept is mastered at score 0.7 with two or more passes. Its score decays about 5% a week once a
       review is overdue, so mastery is kept, not banked. The catalogue is a library, not a to-do list:
       untouched concepts are not debt. Captured memory is never counted as an answer — only a question you
       answered moves a score.`),

    tiles([
      ['Accuracy', answered ? pct(passed, answered) + '%' : '—', answered ? `${passed} right of ${answered}` : 'No assessments yet', answered && pct(passed, answered) >= 70 ? 'good' : '', LH('sessions')],
      ['Mastered', mastered.length, `of ${seen.length} asked`, mastered.length ? 'good' : '', LH('concepts', 'mastered')],
      ['Due now', due.length, due.length ? 'ready for review' : 'nothing waiting', due.length ? 'warn' : '', LH('review')],
      ['Streak', st.current ? plural(st.current, 'day') : '—', st.best ? `best ${plural(st.best, 'day')}` : 'no answers yet'],
    ]),

    next,

    card('Answers, last 30 days', null,
      `<div class="legend">
         <span><b style="background:var(--spot)"></b>Right</span>
         <span><b style="background:var(--warning)"></b>Missed</span>
         <span><b style="background:var(--faint-2)"></b>Skipped</span>
       </div>
       <div class="chart"><div class="tip" id="tip"></div><svg id="c-activity" role="img"
         aria-label="Daily answers, split into right, missed and skipped"></svg></div>`),

    `<div class="g2">
       ${card('Weakest five', null,
         lines(weakest.map((c) => ({
           t: esc(c.name),
           s: `${esc(c.domain)} · ${esc(tierLabel(c.tier))}`,
           v: `${Math.round(c.score * 100)}%${meter(c.score * 100, c.score < 0.5 ? 'warn' : '')}`,
           go: LH('concept', c.slug),
         })), 'Nothing asked in this scope yet.'),
         { aside: `<a class="link" data-go="${esc(LH('concepts'))}">All concepts →</a>` })}
       ${card('Recent sessions', null,
         lines(sess.slice(0, 5).map((s) => ({
           t: esc(pname(s.repo, s.id)),
           s: esc(sessionLabel(s)),
           v: `${s.asked.length ? `${s.passed}/${s.asked.length} right` : plural(s.logged.length, 'concept')}<div class="slug">${esc(ago(s.last))}</div>`,
           go: sessHref(s.id),
         })), 'No sessions in this scope yet.'),
         { aside: `<a class="link" data-go="${esc(href(CUR.wf, 'sessions'))}">All ${sess.length} →</a>` })}
     </div>`,

    fold('learn:stand', 'Where you stand', `${mastered.length} mastered · ${seen.length - mastered.length} learning`,
      segbar([
        { label:'Mastered', n:mastered.length, color:'var(--spot)' },
        { label:'Learning', n:seen.length - mastered.length, color:'color-mix(in srgb, var(--spot) 45%, var(--mass))' },
        { label:'Not asked', n:Math.max(0, scoped.length - seen.length), color:'var(--mass)' },
      ])),

    fold('learn:heat', 'Practice history', plural(st.days, 'active day'),
      `<div class="heat"><svg id="c-heat" role="img" aria-label="Calendar heatmap of daily answers"></svg></div>`,
      { hint: 'One cell per day, up to a year back. Darker means more answered that day.' }),
  ].join('');
}

/** The state filter lives in the hash — `#/concepts/due` is a link worth having. */
const CONCEPT_STATES = ['all', 'due', 'learning', 'mastered', 'unseen'];

function viewConcepts(param) {
  const t = T.concepts;
  t.state = CONCEPT_STATES.includes(param) ? param : 'all';
  t.domain = CUR.query.get('domain') || 'all';
  const all = conceptsInScope();
  const domains = [...new Set(all.map((c) => c.domain))].sort();
  const q = t.q.trim().toLowerCase();

  let list = all.filter((c) => {
    if (t.state === 'mastered' && !c.mastered) return false;
    if (t.state === 'learning' && (!c.seen || c.mastered)) return false;
    if (t.state === 'due' && !c.due) return false;
    if (t.state === 'unseen' && c.seen) return false;
    if (t.domain !== 'all' && c.domain !== t.domain) return false;
    if (q && !(`${c.name} ${c.slug} ${c.domain} ${c.context ?? ''}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const SORTS = {
    weakest: (a, b) => (a.seen === b.seen ? a.score - b.score || b.attempts - a.attempts : a.seen ? -1 : 1),
    strongest: (a, b) => b.score - a.score,
    recent: (a, b) => String(b.last_seen ?? '').localeCompare(String(a.last_seen ?? '')),
    asked: (a, b) => b.attempts - a.attempts,
    name: (a, b) => a.name.localeCompare(b.name),
    tier: (a, b) => a.tier - b.tier || a.name.localeCompare(b.name),
  };
  list = [...list].sort(SORTS[t.sort] ?? SORTS.weakest);

  // Four columns: what it is, how strong, how often asked, and its state. The
  // code context and the slug live on the concept's own page.
  const p = page('concepts', list.length);
  const rows = slice(list, p).map((c) => `
    <tr class="row" data-go="${esc(LH('concept', c.slug))}">
      <td style="min-width:220px"><span class="title">${esc(c.name)}</span>
        <div class="slug">${esc(c.domain)} · ${esc(tierLabel(c.tier))}</div></td>
      <td style="min-width:104px">${c.seen ? meter(c.score * 100, c.score < 0.5 ? 'warn' : '') +
        `<div class="slug">${Math.round(c.score * 100)}%</div>` : '<span class="slug">—</span>'}</td>
      <td class="num">${c.attempts || '—'}</td>
      <td>${statePill(c)}</td>
    </tr>`);

  const counts = {
    all: all.length,
    due: all.filter((c) => c.due).length,
    learning: all.filter((c) => c.seen && !c.mastered).length,
    mastered: all.filter((c) => c.mastered).length,
    unseen: all.filter((c) => !c.seen).length,
  };
  const chip = (k, label) => `<button class="chip" data-state="${k}" aria-pressed="${t.state === k}">${label} ${counts[k]}</button>`;

  return [
    pageHead('Concepts', [plural(all.length, 'concept'), `${counts.all - counts.unseen} asked`, `${counts.mastered} mastered`],
      `Everything in your graph — what you have been asked, and what is still just catalogue. Open a concept
       for every question you were given on it and the code that logged it.`),
    card(null, null,
      `<div class="filters">
         <div class="grow"><input type="search" id="q" value="${esc(t.q)}" placeholder="Search concepts" aria-label="Search concepts"></div>
         <select id="dom" aria-label="Domain">
           <option value="all">All domains</option>
           ${domains.map((d) => `<option value="${esc(d)}"${t.domain === d ? ' selected' : ''}>${esc(d)}</option>`).join('')}
         </select>
         <select id="sort" aria-label="Sort">
           ${[['weakest','Weakest first'],['strongest','Strongest first'],['recent','Recently seen'],['asked','Most asked'],['tier','By tier'],['name','A–Z']]
             .map(([v, l]) => `<option value="${v}"${t.sort === v ? ' selected' : ''}>${l}</option>`).join('')}
         </select>
       </div>
       <div class="chips" id="chips">
         ${chip('all','All')}${chip('due','Due')}${chip('learning','Learning')}${chip('mastered','Mastered')}${chip('unseen','Not asked')}
       </div>
       <div style="margin-top:var(--space-4)">
         ${table([{t:'Concept'},{t:'Score'},{t:'Asked',n:1},{t:'State'}], rows)}
         ${pager('concepts', list.length, p)}
       </div>`),
  ].join('');
}

function viewConcept(slug) {
  const c = S.concepts.find((x) => x.slug === slug);
  if (!c) return `<p class="empty">No concept called <code>${esc(slug)}</code>. <a class="link" data-go="${esc(LH('concepts'))}">Back to concepts</a>.</p>`;

  const atts = S.attempts.filter((a) => a.slug === slug);
  // A logged row with no context line is a bookkeeping row, not a memory: it
  // would render as a date attached to nothing.
  const ctx = S.logged.filter((l) => l.slug === slug && l.context && String(l.context).trim());
  const byName = new Map(S.concepts.map((x) => [x.slug, x]));
  const links = (label, slugs) => `<div style="display:grid;gap:var(--space-2)"><b class="slug">${esc(label)}</b>` + (slugs.length
    ? `<div class="tags">` + slugs.map((s) => `<a class="pill link" data-go="${esc(LH('concept', s))}">${esc(byName.get(s)?.name ?? s)}</a>`).join('') + `</div>`
    : '<span class="slug">None recorded.</span>') + `</div>`;

  // Collapsed, a question is one line, so ten fit where five cards did.
  const PER_Q = 10;
  const p = page('concept', atts.length, PER_Q);
  const history = slice(atts, p, PER_Q).map((a) => qaLine(a, `<span>${esc(fmtDate(a.ts))}</span>`)).join('');

  if (atts.length) chart('c-grades', (el) => chartGrades(el, atts));
  const decayed = c.stored_score > c.score;
  const back = `<a class="page__back" data-go="${esc(LH('concepts'))}">← Concepts</a>`;

  return [
    pageHead(esc(c.name), [
      `<code class="slug">${esc(c.slug)}</code>`, esc(c.domain), esc(tierLabel(c.tier)),
      esc(c.source === 'seed' ? 'from the seed graph' : 'minted from your work'),
    ], c.description ? esc(c.description) : '', back),

    tiles([
      ['Score', c.seen ? Math.round(c.score * 100) + '%' : '—', decayed ? `decayed from ${Math.round(c.stored_score * 100)}%` : 'last five grades, recent first', c.mastered ? 'good' : c.score < 0.5 && c.seen ? 'warn' : ''],
      ['State', c.mastered ? 'mastered' : c.seen ? (c.due ? 'due' : 'learning') : 'not asked', c.seen ? `${c.passed} of ${c.attempts} right` : 'no questions yet', c.due ? 'warn' : ''],
      ['Next review', c.owed ? whenDue(c.next_review) : '—', c.interval_d ? `every ${Math.round(c.interval_d)}d · ease ${c.ease ? c.ease.toFixed(2) : '—'} · ${plural(c.reps, 'rep')}` : 'not scheduled', c.due ? 'warn' : ''],
    ]),

    card('Every question you were asked', atts.length ? `${plural(atts.length, 'attempt')}, newest first. Open one for the options and the feedback.` : '',
      atts.length ? history + pager('concept', atts.length, p, PER_Q)
        : '<p class="empty">Not asked yet. It will come up when your work touches it.</p>'),

    atts.length
      ? fold('concept:grades', 'How the grades went', plural(atts.length, 'grade'),
          `<div class="chart"><svg id="c-grades" role="img" aria-label="Grades over time for this concept"></svg></div>`,
          { hint: 'Every graded answer in order. Grey points are skips and blanks.' })
      : '',

    fold('concept:ctx', 'Where it came from', ctx.length ? plural(ctx.length, 'context line') : 'seed graph',
      ctx.length
        ? lines(ctx.slice(0, 12).map((l) => ({
            t: esc(l.context ?? ''),
            s: `${esc(ago(l.ts))} · ${esc(pname(l.repo, l.session_id))} · ${esc(l.origin ?? 'work')}`,
            go: sessHref(l.session_id),
          })))
        : '<p class="empty">No context recorded — this one came from the seed graph.</p>',
      { hint: 'What the agent said the concept was for, in the code it wrote. Open a line for that session.' }),

    fold('concept:graph', 'Connected concepts',
      `${c.prereqs.length} prerequisites · ${c.unlocks.length} unlocks · ${c.related.length} related`,
      `<div style="display:grid;gap:var(--space-5)">${links('Prerequisites — asked first', c.prereqs)}${links('Unlocks — lean on this one', c.unlocks)}${links('Related', c.related)}</div>`),
  ].join('');
}

const REVIEW_TABS = ['due', 'upcoming', 'skipped'];

function viewReview(param) {
  const t = T.review;
  t.tab = REVIEW_TABS.includes(param) ? param : 'due';
  const seen = seenConcepts();
  const due = seen.filter((c) => c.due).sort((a, b) => (b.overdue_days ?? 0) - (a.overdue_days ?? 0));
  const upcoming = seen.filter((c) => c.owed && !c.due && c.next_review)
    .sort((a, b) => String(a.next_review).localeCompare(String(b.next_review)));
  const skipped = attemptsInScope().filter((a) => a.outcome === 'declined' || a.outcome === 'dont_know');

  // Fourteen days of scheduled reviews, with everything already overdue in one
  // column — a backlog that grows off the left of the chart is a backlog nobody
  // sees.
  const buckets = [{ label:'Overdue', short:'late', n:due.length, overdue:true }];
  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() + i);
    const k = dayKey(d);
    buckets.push({
      label: i === 0 ? 'Today' : fmtDay(k),
      short: i === 0 ? 'today' : String(fromKey(k).getUTCDate()),
      n: upcoming.filter((c) => String(c.next_review).slice(0, 10) === k).length,
      overdue: false,
    });
  }
  chart('c-forecast', (el) => chartForecast(el, buckets));
  const week = buckets.slice(1, 8).reduce((a, b) => a + b.n, 0);
  const longest = due.length ? Math.max(...due.map((c) => c.overdue_days ?? 0)) : 0;

  const tabs = [['due', `Due now ${due.length}`], ['upcoming', `Upcoming ${upcoming.length}`], ['skipped', `Skipped ${skipped.length}`]];
  const list = t.tab === 'due' ? due : t.tab === 'upcoming' ? upcoming : skipped;
  const p = page('review', list.length);
  const rows = slice(list, p).map((x) => t.tab === 'skipped'
    ? `<tr class="row" data-go="${esc(LH('concept', x.slug))}">
         <td style="min-width:260px"><span class="title">${esc(x.name)}</span><div class="ctx">${esc(x.question)}</div></td>
         <td><span class="pill">${x.outcome === 'declined' ? 'declined' : 'blanked'}</span></td>
         <td class="num slug">${esc(ago(x.ts))}</td></tr>`
    : `<tr class="row" data-go="${esc(LH('concept', x.slug))}">
         <td style="min-width:220px"><span class="title">${esc(x.name)}</span><div class="slug">${esc(x.domain)} · ${esc(tierLabel(x.tier))}</div></td>
         <td style="min-width:104px">${meter(x.score * 100, x.score < 0.5 ? 'warn' : '')}
           <div class="slug">${Math.round(x.score * 100)}%</div></td>
         <td class="num slug">${esc(whenDue(x.next_review))}</td></tr>`);

  const cols = t.tab === 'skipped'
    ? [{t:'Concept and question'},{t:'How'},{t:'When',n:1}]
    : [{t:'Concept'},{t:'Score'},{t:t.tab === 'due' ? 'Overdue' : 'Due',n:1}];

  return [
    pageHead('Review queue', [
      due.length ? `<span class="warn">${due.length} due now</span>` : 'nothing due',
      `${week} in the next 7 days`, `${skipped.length} skipped`,
      ...(due.length ? [`longest overdue ${plural(longest, 'day')}`] : []),
    ], `SM-2 decides when a concept comes back: one day after a miss, then 6, then the interval times its
       ease. A score decays about 5% a week while a review is overdue, so this list is also the list of
       things quietly getting weaker. A skipped question comes back a tier lower.`),

    due.length
      ? nextStep(`<strong>${plural(due.length, 'concept')} waiting.</strong> Run <code>/eklavya:quiz</code> in Claude Code to work through them.`)
      : '',

    card('The next fortnight', null,
      `<div class="chart"><svg id="c-forecast" role="img" aria-label="Scheduled reviews for the next fourteen days"></svg></div>`),

    card(null, null,
      `<div class="chips" id="tabs">` + tabs.map(([k, label]) =>
        `<button class="chip" data-tab="${k}" aria-pressed="${t.tab === k}">${esc(label)}</button>`).join('') + `</div>
       <div style="margin-top:var(--space-4)">${table(cols, rows)}${pager('review', list.length, p)}</div>`),
  ].join('');
}

function viewSessions() {
  // Learning's sessions: the ones that logged a concept or asked a question.
  // A session that only captured memory is the Memory workflow's, and is
  // counted here so it is never silently missing.
  const every = sessions();
  const all = every.filter((s) => s.logged.length || s.asked.length);
  const memOnly = every.length - all.length;
  const p = page('sessions', all.length);
  const rows = slice(all, p).map((s) => {
    const acc = s.asked.length ? pct(s.passed, s.asked.length) : null;
    return `<tr class="row" data-go="${esc(sessHref(s.id))}">
      <td style="min-width:260px"><span class="title">${esc(pname(s.repo, s.id))}</span>
        <div class="slug">${esc(sessionLabel(s).slice(0, 120))}</div></td>
      <td class="num">${s.logged.filter((l) => (l.origin ?? 'work') === 'work').length}</td>
      <td style="min-width:110px">${acc === null ? '<span class="slug">not assessed</span>'
        : meter(acc, acc < 70 ? 'warn' : '') + `<div class="slug">${s.passed}/${s.asked.length} right</div>`}</td>
      <td class="num slug">${esc(ago(s.last))}</td></tr>`;
  });

  const withQuestions = all.filter((s) => s.asked.length).length;
  return [
    pageHead('Sessions', [
      plural(all.length, 'session'), `${withQuestions} with questions`,
      plural(all.reduce((a, s) => a + s.asked.length, 0), 'answer'),
    ], `One row per Claude Code session that logged a concept or asked a question. Open one for the whole
       thread: the concepts the work touched, every question you were asked, and — joined on the same
       session id — what the session captured and remembered.`),
    card(null, null,
      table([{t:'Session'},{t:'Concepts',n:1},{t:'Answers'},{t:'When',n:1}], rows)
      + pager('sessions', all.length, p)
      + (memOnly ? `<p class="slug" style="margin:var(--space-4) 0 0">${plural(memOnly, 'session')} captured memory and logged no concept —
          <a class="link" data-go="${esc(MH('sessions'))}">see them in Memory → Sessions</a>.</p>` : '')),
  ].join('');
}

const noSession = (id) => `<p class="empty">No session <code>${esc(id)}</code> in this scope.
    <a class="link" data-go="${esc(href(CUR.wf, 'sessions'))}">Back to sessions</a>.</p>`;

/**
 * One session, from either workflow. Shared rendering: the learning half and
 * the memory half of a session are joined on the session id the host handed
 * both, which is the one association between them that is recorded rather
 * than inferred. The back link and the sidebar stay in the workflow the reader
 * came from.
 */
function viewSession(id) {
  const s = sessions().find((x) => x.id === id);
  if (s) return sessionBody(s);
  // Not in the payload: a memory-only session past `memory_sessions`' cap, or
  // one outside the current scope. The paged resource answers for it exactly.
  fill('sess-lookup', '/api/memory/sessions?' + memScope(new URLSearchParams({ session: id })), (d) => {
    const row = d.rows[0];
    if (!row) return noSession(id);
    return sessionBody({ id, repo: row.project, logged: [], asked: [], mem: row, first: row.first, last: row.last, passed: 0 });
  });
  return `<div class="stack" id="sess-lookup"><p class="empty">Looking up this session…</p></div>`;
}

function sessionBody(s) {
  const id = s.id;

  const byName = new Map(S.concepts.map((c) => [c.slug, c]));
  const work = s.logged.filter((l) => (l.origin ?? 'work') === 'work');
  const review = s.logged.filter((l) => l.origin === 'review');

  const conceptLine = (l) => {
    const c = byName.get(l.slug);
    return { t: esc(c?.name ?? l.slug), s: esc(l.context ?? l.domain ?? ''), v: c ? statePill(c) : '', go: LH('concept', l.slug) };
  };

  // Collapsed to one line each: which concept, the question, the grade.
  const qa = s.asked.slice().reverse().map((a) =>
    qaLine(a, `<span style="color:var(--spot)">${esc(a.name)}</span>`, true)).join('');

  // The memory half of this session, folded: what it remembered and what it
  // proposed are the audit trail behind the learning, not the headline.
  if (s.mem) {
    fill('sess-mem', '/api/memory?per=100&session=' + encodeURIComponent(id), (d) => {
      const entries = d.rows.map((e) => ({
        t: `<span${e.deleted_at || e.superseded_by ? ' class="gone-title"' : ''}>${esc(e.title)}</span>`,
        s: `${esc(stamp(e.occurred_at))} · ${esc(e.type ?? e.kind)} · ${plural(e.event_count, 'evidence event')}`,
        v: entryMark(e),
        go: MH('entry', e.id),
      }));
      const cands = (d.candidates ?? []).map((c) => ({
        t: esc(c.name ?? c.slug),
        s: `${esc(c.domain ?? '—')} · ${Math.round((c.confidence ?? 0) * 100)}% confidence`,
        v: `<span class="pill${c.status === 'accepted' ? ' ok' : ''}">${esc(c.status)}</span>`,
        go: c.concept_slug ? LH('concept', c.concept_slug) : null,
      }));
      return fold('sess:mem', 'What the session remembered', plural(entries.length, 'observation'), lines(entries),
          { hint: 'Observations distilled from the evidence this session captured.' })
        + (cands.length
          ? fold('sess:cands', 'Concepts it proposed', plural(cands.length, 'candidate'), lines(cands),
              { hint: 'Derived from evidence, and still only a proposal — nothing here moved mastery.' })
          : '');
    });
  }

  const back = `<a class="page__back" data-go="${esc(href(CUR.wf, 'sessions'))}">← Sessions</a>`;
  return [
    pageHead(esc(pname(s.repo, s.id)), [
      `${esc(stamp(s.first))} → ${esc(stamp(s.last))}`,
      `${plural(work.length, 'concept')} logged`,
      s.asked.length ? `${s.passed}/${s.asked.length} right (${pct(s.passed, s.asked.length)}%)` : 'no questions',
      ...(s.mem ? [`${s.mem.events} captured${s.mem.redacted ? `, ${s.mem.redacted} redacted` : ''}`, `${s.mem.entries} remembered`] : []),
    ], `Session <code class="slug">${esc(s.id)}</code>. The learning half and the memory half are joined on the
       session id the host handed both — the one association between them that is recorded rather than inferred.`, back),

    work.length
      ? card('What the work taught', 'Each line is what the agent said the concept was for, in the code it wrote.', lines(work.map(conceptLine)))
      : '',

    s.asked.length ? card('What you were asked', `${plural(s.asked.length, 'question')}, in order. Open one for the options and the feedback.`, qa) : '',

    review.length
      ? fold('sess:review', 'Pulled in for review', plural(review.length, 'concept'), lines(review.map(conceptLine)),
          { hint: 'Not from this diff — the tutor widened to prerequisites and neighbours.' })
      : '',

    s.mem ? `<div class="stack" id="sess-mem"><p class="empty">Loading what this session remembered…</p></div>` : '',
  ].join('');
}

/** Where a project was last seen, said plainly. A gone checkout is history, not an error. */
const whereLine = (p) => p.kind === 'global' ? 'work done outside any repository'
  : p.kind === 'unattributed' ? 'recorded before projects were tracked, or by a session that named none'
  : p.path + (p.available === false ? ' — checkout no longer on disk' : '');

function viewProjects() {
  const inv = projectsInScope();
  const list = inv.filter((p) => p.learning.answers || p.learning.logged_concepts);
  const other = inv.filter((p) => !p.learning.answers && !p.learning.logged_concepts);
  const daily = dailyInScope();

  // One fold per project. Its summary line is the standing — level, accuracy,
  // answers, last active — and it opens to the runway and thirty days of work.
  const folds = list.map((p, i) => {
    const L = p.learning;
    const acc = L.answers ? pct(L.passed, L.answers) + '%' : null;
    const st = L.answers ? S.projects.filter((x) => pid(x.repo) === p.id).sort((x, y) => y.answers - x.answers)[0] : null;
    const peek = [st ? st.level : 'not assessed', acc ? `${acc} of ${plural(L.answers, 'answer')}` : plural(L.logged_concepts, 'concept') + ' recorded', esc(ago(L.last))].join(' · ');
    const detail = `<div class="kv" style="margin-bottom:var(--space-5)">
         <div><b>Assessed</b><span>${plural(L.assessed_concepts, 'concept')}</span></div>
         <div><b>Recorded</b><span>${plural(L.logged_concepts, 'concept')}</span></div>
         <div><b>Sessions</b><span>${L.sessions}</span></div>
       </div>`;
    const links = `<p class="more"><a class="link" data-go="${esc(LH('dashboard', null, { project: p.id }))}">Its dashboard →</a>
       &nbsp; <a class="link" data-go="${esc(LH('sessions', null, { project: p.id }))}">Its sessions →</a></p>`;
    const opts = { hint: whereLine(p), open: list.length === 1 };
    if (!L.answers) {
      return fold('proj:' + p.id, p.name, peek, detail
        + `<p class="slug" style="margin:0">No assessments yet. The concepts this project's work recorded come up in a
            quiz like any others; nothing counts toward a level until one is answered.</p>` + links, opts);
    }
    const bar = (label, value, target, ok) => `
      <div><span class="${ok ? 'mark-ok' : 'mark-no'}">${ok ? '✓' : '○'}</span>
        <span style="min-width:150px">${esc(label)}</span>
        <span class="bar">${meter(pct(value, target), ok ? '' : 'mute')}</span>
        <span class="slug" style="white-space:nowrap">${value} / ${target}</span></div>`;
    const ladder = st ? ['easy', 'medium', 'hard'].map((l, idx) => {
      const cur = ['easy', 'medium', 'hard'].indexOf(st.level);
      return `<div class="${idx === cur ? 'on' : idx < cur ? 'done' : ''}">${l}</div>`;
    }).join('') : '';

    chart('c-proj-' + i, (el) => {
      const m = new Map();
      for (const d of S.daily) {
        if (pid(d.repo) !== p.id) continue;
        const cur = m.get(d.day) ?? { day:d.day, passed:0, missed:0, skipped:0, total:0 };
        cur.passed += d.passed; cur.missed += d.missed; cur.skipped += d.skipped;
        cur.total = cur.passed + cur.missed + cur.skipped;
        m.set(d.day, cur);
      }
      chartActivity(el, fillDays(m, 30));
    });

    return fold('proj:' + p.id, p.name, peek, detail
      + (st ? `<div class="ladder">${ladder}</div>
       ${st.pinned
         ? `<p class="slug" style="margin:var(--space-4) 0 0">Difficulty is pinned in config, so this project does not promote.</p>`
         : st.next_level
           ? `<p class="slug" style="margin:var(--space-4) 0 var(--space-2)">To reach <strong>${esc(st.next_level)}</strong>, counting answers since ${esc(st.promoted_at ? fmtDate(st.promoted_at) : 'you started')}:</p>
              <div class="checks">
                ${bar('Passing answers', st.level_counts.passed, st.level_needed.answers, !st.level_unmet.includes('answers'))}
                ${bar('Accuracy', Math.round(st.level_accuracy * 100), Math.round(st.level_needed.accuracy * 100), !st.level_unmet.includes('accuracy'))}
                ${bar('Distinct concepts', st.level_counts.concepts, st.level_needed.concepts, !st.level_unmet.includes('concepts'))}
              </div>`
           : `<p class="slug" style="margin:var(--space-4) 0 0">Top of the ladder — questions can reach tier 5 here.</p>`}` : '')
      + `<div class="chart" style="margin-top:var(--space-5)"><svg id="c-proj-${i}" role="img"
         aria-label="Thirty days of answers in this project"></svg></div>` + links, opts);
  });

  const assessed = list.filter((p) => p.learning.answers);
  return [
    pageHead('Projects', [
      plural(list.length, 'project'), `${assessed.length} assessed`,
      plural(list.reduce((a, p) => a + p.learning.answers, 0), 'answer'), plural(streaks(daily).days, 'active day'),
    ], `Difficulty is earned per codebase, not per person: the same developer is a different learner on their
       fourth Node service and their first Rust one. Everyone starts at easy (tiers 1–2) and climbs on
       evidence — a promotion needs passing answers <em>and</em> accuracy <em>and</em> distinct concepts. A
       project appears here as soon as its work logs a concept, before a single question is asked.`),
    folds.join('') || '<p class="empty">No project has logged or answered anything yet.</p>',
    other.length
      ? fold('proj:memory-only', 'Memory only', plural(other.length, 'project'),
          lines(other.map((p) => ({
            t: esc(p.name),
            s: `${esc(whereLine(p))}`,
            v: `${p.memory.entries} obs.<div class="slug">${esc(ago(p.last_active))}</div>`,
            go: MH('projects', null, { project: p.id }),
          }))),
          { hint: 'Recorded by capture, with no learning activity yet. Captured is not assessed.' })
      : '',
  ].join('');
}

function viewDomains() {
  const scoped = conceptsInScope();
  const byDomain = new Map();
  for (const c of scoped) {
    const d = byDomain.get(c.domain) ?? { domain:c.domain, catalogue:0, touched:0, mastered:0, due:0, attempts:0 };
    d.catalogue += 1;
    if (c.seen) { d.touched += 1; d.attempts += c.attempts; if (c.mastered) d.mastered += 1; if (c.due) d.due += 1; }
    byDomain.set(c.domain, d);
  }
  const list = [...byDomain.values()].sort((a, b) => b.touched - a.touched || b.catalogue - a.catalogue);
  const rows = list.map((d) => `
    <tr class="row" data-go="${esc(LH('domain', d.domain))}">
      <td><span class="title">${esc(d.domain)}</span>
        <div class="slug">${d.touched} asked of ${d.catalogue} in the graph</div></td>
      <td style="min-width:130px">${d.touched
        ? meter(pct(d.mastered, d.touched)) + `<div class="slug">${d.mastered} mastered</div>`
        : '<span class="slug">not reached yet</span>'}</td>
      <td class="num">${d.due || '—'}</td>
    </tr>`);
  const tierCount = [1,2,3,4,5].map((t) => scoped.filter((c) => c.seen && c.tier === t).length);
  // A sequential ramp mixed from the accent role rather than picked off the
  // accent scale: a fixed --vd-200 is legible on ink and invisible on paper.
  const COLORS = [100, 78, 58, 40, 24].map((p) => `color-mix(in srgb, var(--spot) ${p}%, var(--mass))`);
  return [
    pageHead('Domains', [plural(list.length, 'domain'), `${list.filter((d) => d.touched).length} reached by your work`],
      `What you are learning, grouped. The catalogue is a library, not a to-do list — a domain with untouched
       concepts is a domain your work has not reached yet.`),
    card(null, null, table([{t:'Domain'},{t:'Mastered'},{t:'Due',n:1}], rows)),
    fold('domains:tiers', 'Tier spread', `${tierCount.reduce((a, b) => a + b, 0)} asked`,
      segbar([1,2,3,4,5].map((t, i) => ({ label: tierLabel(t), n: tierCount[i], color: COLORS[i] }))),
      { hint: 'Tier is how hard one question is: recall, mechanism, judgement, failure modes, design.' }),
  ].join('');
}

function viewDomain(name) {
  const all = conceptsInScope().filter((c) => c.domain === name);
  if (!all.length) return `<p class="empty">No concepts in <code>${esc(name)}</code> for this scope.
    <a class="link" data-go="${esc(LH('domains'))}">Back to domains</a>.</p>`;
  const seen = all.filter((c) => c.seen);
  const list = [...all].sort((a, b) => (a.seen === b.seen ? a.score - b.score : a.seen ? -1 : 1));
  const p = page('domain', list.length);
  const rows = slice(list, p).map((c) => `
    <tr class="row" data-go="${esc(LH('concept', c.slug))}">
      <td style="min-width:220px"><span class="title">${esc(c.name)}</span><div class="slug">${esc(tierLabel(c.tier))}</div></td>
      <td style="min-width:104px">${c.seen ? meter(c.score * 100, c.score < 0.5 ? 'warn' : '')
        + `<div class="slug">${Math.round(c.score * 100)}%</div>` : '<span class="slug">—</span>'}</td>
      <td class="num">${c.attempts || '—'}</td>
      <td>${statePill(c)}</td>
    </tr>`);
  const back = `<a class="page__back" data-go="${esc(LH('domains'))}">← Domains</a>`;
  return [
    pageHead(esc(name), [plural(all.length, 'concept'), `${seen.length} asked`, `${seen.filter((c) => c.mastered).length} mastered`], '', back),
    card(null, null, segbar([
      { label:'Mastered', n:seen.filter((c) => c.mastered).length, color:'var(--spot)' },
      { label:'Learning', n:seen.filter((c) => !c.mastered).length, color:'color-mix(in srgb, var(--spot) 45%, var(--mass))' },
      { label:'Not asked', n:all.length - seen.length, color:'var(--mass)' },
    ]) + `<div style="margin-top:var(--space-5)">${table([{t:'Concept'},{t:'Score'},{t:'Asked',n:1},{t:'State'}], rows)}${pager('domain', list.length, p)}</div>`),
  ].join('');
}

/* ---------- Memory: the timeline, paged over /api/memory ---------- */

function memoryQuery(type) {
  const t = T.memory;
  const p = memScope(new URLSearchParams());
  if (type && type !== 'all') p.set('type', type);
  if (t.tag !== 'all') p.set('tag', t.tag);
  if (t.q.trim()) p.set('q', t.q.trim());
  // A date input is a day, not an instant, and `occurred_at` is an ISO string —
  // so the bounds have to be ISO too, or the text comparison puts `T` after the
  // space in `23:59:59` and the last day of the range drops out.
  if (t.since) p.set('since', t.since + 'T00:00:00.000Z');
  if (t.until) p.set('until', t.until + 'T23:59:59.999Z');
  p.set('page', t.page);
  p.set('per', S.memory.per_page || 25);
  return p.toString();
}

const dayName = (d) => d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const clock = (d) => d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });

/** One entry on the timeline: a line that opens to its snippet and a link to the full entry. */
function tlEntry(e) {
  const d = parse(e.occurred_at);
  const more = e.narrative_length > String(e.snippet ?? '').length;
  const gone = e.deleted_at || e.superseded_by;
  return `<li><details class="tl-item${gone ? ' gone' : ''}" data-entry="${esc(e.id)}">
    <summary><span class="tl-time">${d ? esc(clock(d)) : '—'}</span>
      <span class="tl-title">${esc(e.title)}</span><span class="tl-type">${esc(e.type ?? e.kind)}</span></summary>
    <div class="tl-body">
      ${e.snippet ? `<p>${esc(e.snippet)}${more ? '…' : ''}</p>` : ''}
      <div class="tl-meta"><span>${esc(pname(e.project))}</span><span>${plural(e.event_count, 'evidence event')}</span>
        ${entryMark(e)}<a class="link" data-go="${esc(MH('entry', e.id))}">Open entry →</a></div>
    </div></details></li>`;
}

/**
 * The page's entries as a timeline: grouped by local day, and an entry that
 * shares a session with a session summary on this page folds under that
 * summary. Grouping is per page — a session whose summary sits on the next page
 * shows its observations as ordinary lines here — because the server pages
 * entries, not sessions.
 */
function drawMemory(d) {
  T.memory.page = d.page;   // the server clamps a page number a filter shrank
  if (!d.rows.length) return '<p class="empty">Nothing in memory matches these filters.</p>';
  const summaries = new Map(d.rows.filter((e) => e.kind === 'session_summary' && e.session_id).map((e) => [e.session_id, e]));
  const kids = new Map();
  for (const e of d.rows) {
    if (e.kind === 'session_summary' || !summaries.has(e.session_id)) continue;
    if (!kids.has(e.session_id)) kids.set(e.session_id, []);
    kids.get(e.session_id).push(e);
  }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const out = [];
  let last = null;
  for (const e of d.rows) {
    if (e.kind !== 'session_summary' && summaries.has(e.session_id)) continue;   // drawn under its summary
    const at = parse(e.occurred_at);
    const day = at ? new Date(at.getFullYear(), at.getMonth(), at.getDate()) : null;
    if (day && (!last || day.getTime() !== last.getTime())) {
      if (last) {
        const gap = Math.round((last - day) / DAY_MS) - 1;
        const after = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
        const before = new Date(last.getFullYear(), last.getMonth(), last.getDate() - 1);
        if (gap === 1) out.push(`<li class="tl-gap">Nothing on ${esc(dayName(after))}</li>`);
        if (gap > 1) out.push(`<li class="tl-gap">Nothing from ${esc(dayName(after))} to ${esc(dayName(before))}</li>`);
      }
      const note = day.getTime() === today ? 'Today' : Math.round((today - day.getTime()) / DAY_MS) === 1 ? 'Yesterday' : '';
      out.push(`<li class="tl-day"><h2>${esc(dayName(day))}</h2>${note ? `<span>${note}</span>` : ''}</li>`);
      last = day;
    }
    const inner = kids.get(e.session_id);
    if (e.kind === 'session_summary' && inner) {
      out.push(`<li><details class="tl-item tl-session">
        <summary><span class="tl-time">${at ? esc(clock(at)) : '—'}</span>
          <span class="tl-title">${esc(e.title.replace(/^Session:\s*/, ''))}</span>
          <span class="tl-type">Session · ${plural(inner.length, 'observation')}</span></summary>
        <ol class="tl-kids">${inner.map(tlEntry).join('')}
          <li class="tl-gap"><a class="link" data-go="${esc(MH('entry', e.id))}">The session summary →</a></li></ol></details></li>`);
    } else out.push(tlEntry(e));
  }
  return `<ol class="tl" aria-label="Timeline">${out.join('')}</ol>` + pager('memory', d.total, d.page, d.per);
}

/**
 * The memory counts, scoped when they can be. The inventory counts evidence,
 * pending evidence, observations and sessions per project, so those follow the
 * selector; indexing, reuse, delivery and assessment are only aggregated for
 * the whole database, and say so rather than pretend to be this project's.
 */
function memCounts() {
  const M = S.memory;
  const scoped = PROJECT !== null;
  const inv = projectsInScope();
  const sum = (f) => inv.reduce((a, p) => a + f(p), 0);
  return {
    scoped,
    events: scoped ? sum((p) => p.memory.events) : M.captured,
    pending: scoped ? sum((p) => p.memory.pending) : M.pending,
    entries: scoped ? sum((p) => p.memory.entries) : M.entries,
    sessions: scoped ? sum((p) => p.memory.sessions) : INV.projects.reduce((a, p) => a + p.memory.sessions, 0),
  };
}

function memTiles() {
  const M = S.memory;
  const { scoped, events, pending, entries, sessions } = memCounts();
  const everywhere = scoped ? 'all projects · ' : '';
  return tiles([
    ['Observations', entries, scoped ? 'live in this project' : `${M.indexed} indexed`, '', MH('timeline')],
    ['Sessions', sessions, 'captured or remembered', '', MH('sessions')],
    ['Pending', pending, pending ? `of ${events} evidence events` : `all ${events} distilled`, pending ? 'warn' : '', MH('health')],
    ['Reused', M.reused, `${everywhere}${M.exposed} delivered`, '', MH('reuse')],
  ]);
}

/** `YYYY-MM-DD` for n days before today, local — what a date input holds. */
const daysAgo = (n) => {
  const d = new Date(); d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const WHEN = { today:0, '7d':6, '30d':29 };

function viewMemory(param) {
  const t = T.memory;
  const M = S.memory;
  const types = M.types ?? [];
  // The URL holds the filters, so a filtered timeline is a link that reopens
  // filtered. A type with no live entries still filters — to nothing, visibly.
  const type = param || 'all';
  t.tag = CUR.query.get('tag') || 'all';
  t.since = CUR.query.get('from') || '';
  t.until = CUR.query.get('to') || '';
  fill('mem-rows', '/api/memory?' + memoryQuery(type), drawMemory);

  // A preset is only a `from` date, so the URL stays the one date format and a
  // shared link reads the same; anything else is a custom range.
  const when = !t.since && !t.until ? 'any'
    : !t.until && Object.keys(WHEN).find((k) => daysAgo(WHEN[k]) === t.since) || 'custom';
  const opt = (v, label, on) => `<option value="${esc(v)}"${on ? ' selected' : ''}>${esc(label)}</option>`;
  const typeOpts = opt('all', 'All types', type === 'all')
    + types.map((x) => opt(x.type, `${x.type} (${x.n})`, type === x.type)).join('')
    + (type !== 'all' && !types.some((x) => x.type === type) ? opt(type, `${type} (0)`, true) : '');
  const { entries, sessions, pending } = memCounts();

  return [
    pageHead('Timeline', [plural(entries, 'observation'), plural(sessions, 'session'),
      ...(pending ? [`<a class="link warn" data-go="${esc(MH('health'))}">${pending} evidence pending</a>`] : [])],
      `What your sessions actually did, distilled into observations and kept with the raw evidence behind each
       one. Corrections supersede rather than overwrite and deletions are marked and struck through, so what
       you see is the audit trail and not a tidied version of it.`),

    `<div>
       <div class="filters">
         <div class="grow"><input type="search" id="mq" value="${esc(t.q)}" placeholder="Search memory" aria-label="Search memory"></div>
         <select id="mtype" aria-label="Type">${typeOpts}</select>
         <select id="mtag" aria-label="Tag">
           <option value="all">All tags</option>
           ${(M.tags ?? []).map((x) => opt(x.tag, `${x.tag} (${x.n})`, t.tag === x.tag)).join('')}
         </select>
         <select id="mwhen" aria-label="When">
           ${opt('any', 'Any time', when === 'any')}${opt('today', 'Today', when === 'today')}
           ${opt('7d', 'Last 7 days', when === '7d')}${opt('30d', 'Last 30 days', when === '30d')}
           ${opt('custom', 'Custom range', when === 'custom')}
         </select>
         ${when === 'custom' ? `<input type="date" id="mfrom" value="${esc(t.since)}" aria-label="From date">
         <input type="date" id="mto" value="${esc(t.until)}" aria-label="To date">` : ''}
       </div>
       <div id="mem-rows"><p class="empty">Loading the timeline…</p></div>
     </div>`,
  ].join('');
}

function viewMemoryDashboard() {
  const R = S.reuse, H = S.health, Q = H.queue, M = S.memory;
  const scope = () => memScope(new URLSearchParams());
  const q6 = scope(); q6.set('per', '6');
  fill('mem-recent', '/api/memory?' + q6, (d) => lines(d.rows.map((e) => ({
    t: `<span${e.deleted_at || e.superseded_by ? ' class="gone-title"' : ''}>${esc(e.title)}</span>`,
    s: `${esc(stamp(e.occurred_at))} · ${esc(e.type ?? e.kind)} · ${esc(pname(e.project))}`,
    v: entryMark(e),
    go: MH('entry', e.id),
  })), 'Nothing remembered in this scope yet.'));
  const q5 = scope(); q5.set('per', '5');
  fill('mem-sessions', '/api/memory/sessions?' + q5, (d) => lines(d.rows.map((m) => ({
    t: esc(pname(m.project, m.session_id)),
    s: `${m.events} captured · ${m.entries} remembered`,
    v: esc(ago(m.last)),
    go: MH('session', m.session_id),
  })), 'No session has captured anything in this scope.'));

  // The pipeline in two lines: is reuse paying for itself, and is capture alive.
  // Each opens its page; the arithmetic lives there.
  const verdict = R.savings.kind === 'saving' ? `${R.savings.percent}% less context`
    : R.savings.kind === 'overhead' ? `+${R.savings.tokens} tokens of overhead` : 'no confirmed receipts yet';
  const stuck = Q.failed + Q.paused;
  const pipeline = lines([
    { t: 'Context reuse', s: `${plural(R.receipts, 'receipt')}, ${R.confirmed} confirmed · estimated, all projects`,
      v: esc(verdict), go: MH('reuse') },
    { t: 'Health', s: `last capture ${esc(H.capture.newest_event ? ago(H.capture.newest_event) : 'never')} · capture ${H.capture.enabled ? esc(H.capture.mode) : 'off'} · ${Q.pending} queued`,
      v: stuck ? `<span style="color:var(--warning)">${stuck} stalled</span>` : 'running', go: MH('health') },
  ]);

  return [
    pageHead('What does memory hold?', [
      `${M.processed} distilled`, `${M.indexed} indexed`, `${M.reused} reused`, `${M.exposed} delivered`, `${M.assessed} assessed`,
    ], `Captured, processed, stored, retrieved, delivered, assessed — six different things that can happen to one
       piece of evidence, counted separately. None of them is an answer: only a question you answered moves
       mastery. Reuse, delivery and assessment are counted across all projects.`),
    memTiles(),
    card('Pipeline', null, pipeline),
    `<div class="g2">
       ${card('Recent observations', null, `<div id="mem-recent"><p class="empty">Loading…</p></div>`,
         { aside: `<a class="link" data-go="${esc(MH('timeline'))}">Timeline →</a>` })}
       ${card('Recent sessions', null, `<div id="mem-sessions"><p class="empty">Loading…</p></div>`,
         { aside: `<a class="link" data-go="${esc(MH('sessions'))}">All sessions →</a>` })}
     </div>`,
  ].join('');
}

  // The learning half of the same session, joined on its id, where there is one.

        const l = learned.get(m.session_id);

          .filter(Boolean).join(' · ');

function viewMemoryProjects() {
  const inv = projectsInScope();

  const none = inv.length - list.length;
  const rows = list.map((p) => {
    const sub = [`${p.memory.events} captured`, p.memory.pending ? `${p.memory.pending} pending` : '',
      p.memory.receipts ? `${p.memory.receipts} receipts` : ''].filter(Boolean).join(' · ');
    return `<tr class="row" data-go="${esc(MH('timeline', null, { project: p.id }))}">

      plural(list.length, 'project'), plural(list.reduce((a, p) => a + p.memory.entries, 0), 'observation'),
      `${list.reduce((a, p) => a + p.memory.events, 0)} evidence events`,
      ...(pending ? [`<span class="warn">${pending} pending</span>`] : []),

       processed into an observation. Open one to read its timeline.`),
    card(null, null,
      table([{t:'Project'},{t:'Observations',n:1},{t:'Sessions',n:1},{t:'Last capture',n:1}], rows)
      + (none ? `<p class="slug" style="margin:var(--space-4) 0 0">${plural(none, 'project')} in scope ${none === 1 ? 'has' : 'have'} learning activity and no memory —
          <a class="link" data-go="${esc(LH('projects'))}">see Learning → Projects</a>.</p>` : '')),

name: Test

# Every pull request, and every push to `main`. Nothing else: a push to a
# feature branch that has a PR open would otherwise run this suite twice, once
# per event, and put two "Test / test" checks on the same PR.
#
# Release also installs and tests before it publishes, so `main` is covered
# twice. That is deliberate — the release step is load-bearing there, and this
# one is the check branch protection can point at.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch per event. `head_ref` is the source branch on a
# pull_request and empty on a push, so the event stays in the group: a PR
# merged to `main` would otherwise collide with its own merge push and get
# cancelled, and GitHub renders a cancelled run as a failed check.
#
# `cancel-in-progress` drops the stale run when you push again a minute later.
concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about a minute. A synchronous hang is invisible to
    # vitest's per-test timeout, and without this it runs to GitHub's 6h cap.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Must satisfy the package's own `engines` (>=22). Below that,
      # better-sqlite3 has no prebuilt binary and the suite fails on node-gyp
      # rather than on anything it meant to test.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # `npm run coverage` builds, then runs vitest over mcp/test/ under c8,
      # which also counts the hooks and CLI the suites spawn from dist/. It
      # fails below the thresholds in mcp/.c8rc.json (100% on every metric).
      - name: Install and test the server
        working-directory: mcp
        run: |
          npm ci
          # The dashboard's browser suite drives a real Chromium, and fails rather
          # than skips on CI when there is none -- a skipped suite is a green one.
          npx playwright-core install --with-deps chromium
          npm run coverage

      # The per-file table on the run page, and the HTML report to download
      # when a line is uncovered.
      - name: Coverage summary
        if: always()
        working-directory: mcp
        run: |
          {
            echo '```'
            npx c8 report --reporter=text | grep -v '|     100 |      100 |     100 |     100 |'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          # Not tmp/: the raw per-process V8 dumps run to hundreds of MB.
          path: |
            mcp/coverage/
            !mcp/coverage/tmp/
          retention-days: 7

  # A PR that changes product code must also change the manual, the landing
  # page and a README. The script's header lists what counts as product code.
  docs-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: .github/scripts/check-docs-sync.sh "origin/${{ github.base_ref }}"

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # postbuild validates every public page, preview image, sitemap and local link.
      - run: npm run build
        working-directory: web

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="eklavya:project" content="{{PROJECT}}">
<meta name="eklavya:kind" content="{{KIND}}">
<meta name="eklavya:concept" content="{{CONCEPT}}">
<meta name="eklavya:created" content="{{CREATED}}">
<!-- Eklavya type. Offline, the stacks fall back to system faces; nothing breaks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Eklavya design tokens, inlined from web/public/tokens.css when this page was
   created. Ink (dark) is the default on screen and in the PDF; data-mode="paper"
   on <html> switches to the paper ground. Components below name ROLES only. */
/*{{TOKENS}}*/
</style>
<style>
  :root{ --ok:var(--spot); --maxw:880px; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font-body)}
  ::selection{background:var(--spot);color:var(--spot-ink)}
  main{max-width:var(--maxw);margin:0 auto;padding:64px 16px 96px}

  .eyebrow{margin:0 0 14px;font:400 11px/1 var(--font-mono);letter-spacing:var(--tracking-caps-wide);
    text-transform:uppercase;color:var(--spot)}
  h1{font:900 clamp(34px,5.4vw,64px)/.95 var(--font-disp);letter-spacing:var(--tracking-display);margin:0 0 .35em}
  h2{font:800 clamp(24px,3vw,34px)/1 var(--font-disp);letter-spacing:var(--tracking-tight);
    margin:2.4em 0 .7em;padding-top:1em;border-top:1px solid var(--line-2)}
  h3{font:800 18px/1.3 var(--font-disp);letter-spacing:var(--tracking-snug);margin:1.8em 0 .4em}
  p,li{color:var(--ink)}
  .lede{color:var(--dim);font-size:17px;max-width:620px;margin:0 0 2.4em}
  .muted{color:var(--dim)}
  a{color:var(--spot);text-decoration:none;border-bottom:1px solid var(--spot)}
  strong{font-weight:600}

  code{font-family:var(--font-mono);font-size:.88em;background:var(--mass);padding:.1em .38em}
  pre{background:var(--panel);border:1px solid var(--line-2);padding:14px 16px;overflow:auto;font-size:13px}
  pre code{background:none;padding:0}

  table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
  th{font:400 11px var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--faint)}
  td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  blockquote{margin:1.2em 0;padding:.2em 0 .2em 16px;border-left:2px solid var(--spot);color:var(--dim)}

  .card{background:var(--panel);border:1px solid var(--line);padding:24px}
  .card h3{margin-top:0}
  .card p{color:var(--dim);font-size:14.5px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:1.4em 0}
  .chip{display:inline-block;font:12px var(--font-mono);color:var(--spot);background:var(--spot-soft);
    border:1px solid var(--spot);padding:2px 9px}
  .chip.warn{color:var(--warning);border-color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
  .chip.bad{color:var(--error);border-color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
  .stat{border:1px solid var(--line-2);padding:18px 20px}
  .stat .k{font:400 11px var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--faint)}
  .stat .v{font:900 40px/1.1 var(--font-disp);letter-spacing:var(--tracking-tight);margin-top:6px}
  .stat .d{color:var(--dim);font-size:13px}
  .callout{border:1px solid var(--spot);background:var(--spot-soft);padding:14px 18px;margin:1.4em 0}

  figure{margin:1.8em 0;background:var(--panel);border:1px solid var(--line-2);
    padding:20px;text-align:center;break-inside:avoid}
  figure svg{max-width:100%;height:auto}
  figcaption{margin-top:12px;color:var(--dim);font-size:13px;text-align:center}
  .svg-ink{fill:var(--ink)} .svg-muted{fill:var(--dim)}
  .svg-box{fill:var(--mass);stroke:var(--line-2);stroke-width:1}
  .svg-box-spot{fill:var(--spot-soft);stroke:var(--spot);stroke-width:1.5}
  .svg-line{stroke:var(--faint);stroke-width:1.5;fill:none}
  .svg-line-spot{stroke:var(--spot);stroke-width:1.5;fill:none}
  .svg-label{font:500 13px var(--font-body);fill:var(--ink)}
  .svg-small{font:11px var(--font-mono);fill:var(--dim)}

  .actions{position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .actions button{display:inline-flex;gap:7px;align-items:center;padding:8px 14px;
    border:1px solid var(--line-2);border-radius:0;background:var(--panel);color:var(--ink);
    font:500 12px var(--font-mono);letter-spacing:.06em;cursor:pointer}
  .actions button:hover{border-color:var(--spot);color:var(--spot)}
  .actions button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--spot)}

  @media screen{
    body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:72px 72px}
    main{background:var(--bg);border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);
      padding-left:40px;padding-right:40px;min-height:100vh}
  }
  @media (max-width:640px){ main{padding:76px 16px 64px!important} .actions{top:12px;right:12px} }

  @media print{
    /* Dark in the PDF too. The @page margin is canvas and prints white, so the
       page has none, a fixed layer covers the sheet, and the gutter lives on
       <main>, repeated on every page fragment by box-decoration-break. */
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{background:var(--bg);color:var(--ink)}
    @page{margin:0}
    body::before{content:"";position:fixed;inset:0;background:var(--bg);z-index:-1}
    .actions{display:none}
    body{font-size:11pt}
    main{padding:12mm 16mm;max-width:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
    h1,h2,h3{break-after:avoid;break-inside:avoid}
    p,li{orphans:3;widows:3}
    /* Anything that can outgrow a page must be allowed to split. */
    table,pre,section,div{break-inside:auto}
    thead{display:table-header-group}
    tfoot{display:table-footer-group}
    tr,td,th,li,.card,.stat{break-inside:avoid}
    figure,blockquote{break-inside:avoid}
    figure svg,figure img{max-height:170mm}
    a{color:inherit;border:0}
  }
</style>
</head>
<body>
<div class="actions">
  <button type="button" onclick="window.print()" aria-label="Download this page as PDF">PDF</button>
  <button type="button" onclick="saveHtml()" aria-label="Download this page as an HTML file">HTML</button>
</div>
<script>
function saveHtml(){
  var name=(location.pathname.split('/').pop()||'').replace(/\.html?$/,'')||'artifact';
  var blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
</script>

<main>
  <p class="eyebrow">{{EYEBROW}} · {{PROJECT_NAME}}</p>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{DESCRIPTION}}</p>

  <!-- CONTENT: replace this comment with the page. Sections under <h2>, a
       <figure> with an inline SVG (the .svg-* classes) for every sequence,
       branch or before/after, a <figcaption> that states the takeaway. -->

</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eklavya — dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230E6E66'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M7 5a11 11 0 0 1 0 14'/%3E%3Cpath d='M6 12h12'/%3E%3Cpath d='M14 9l3 3-3 3'/%3E%3C/g%3E%3C/svg%3E">
<script>
/* Ground selection, shared with the site: same localStorage key, same default.
   Runs before the stylesheet so the page never paints one ground then swaps.
   Ink is the default and an absent choice stays ink — deliberately not the
   reader's OS setting, because this is a terminal tool. */
(function () {
  window.eklavyaGround = {
    read: function () {
      try { return localStorage.getItem('eklavya-ground') === 'paper' ? 'paper' : 'ink'; }
      catch (e) { return 'ink'; }
    },
    apply: function (mode) {
      document.documentElement.setAttribute('data-mode', mode);
      document.querySelectorAll('[data-ground]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.ground === mode));
      });
      return mode;
    },
    set: function (mode) {
      try { localStorage.setItem('eklavya-ground', mode); } catch (e) {}
      this.apply(mode);
    }
  };
  window.eklavyaGround.apply(window.eklavyaGround.read());
})();
</script>
<!-- Tokens only, and served with their remote font import stripped: nothing on
     this page is fetched from anywhere but this loopback server. The font
     stacks fall through to the system faces they already name. -->
<link rel="stylesheet" href="/tokens.css">
<style>
  /* ============================================================
     Layout: a fixed rail and one scrolling column.

     Every view is a stack of cards on the same rhythm — 24px between
     cards, 16px from a card's heading block to its content. Nothing
     sets its own vertical margins; `.stack` owns the gaps, so a new
     card can never invent a different one.
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; font-family:var(--font-body); background:var(--bg); color:var(--ink);
         font-size:14.5px; line-height:1.65; }
  ::selection { background:var(--spot); color:var(--spot-ink); }
  code, .mono { font-family:var(--font-mono); }
  a { color:inherit; }

  .app { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }

  /* ---------- the rail ---------- */
  .side { position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
          background:var(--panel); border-right:1px solid var(--line-2);
          display:flex; flex-direction:column; gap:var(--space-6); padding:var(--space-6) 0; }
  /* The wordmark is the way home, the way it is on every other site the reader
     has ever used. */
  .side__brand { display:flex; align-items:center; gap:var(--space-3); padding:0 var(--space-5);
                 text-decoration:none; color:inherit; }
  .side__brand:hover b { color:var(--spot); }
  .mark { width:30px; height:30px; background:var(--spot); color:var(--spot-ink);
          display:grid; place-items:center; flex:none; }
  .side__brand b { font-family:var(--font-disp); font-size:17px; font-weight:var(--weight-extra);
                   letter-spacing:var(--tracking-tight); display:block; line-height:1.2; }
  .side__brand span { font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
                      text-transform:uppercase; color:var(--faint); }

  .side__controls { display:flex; flex-direction:column; gap:var(--space-6); margin-top:auto; }
  .side__group { padding:0 var(--space-5); }
  .side__label { font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
                 text-transform:uppercase; color:var(--faint); margin:0 0 var(--space-2); }

  /* ---------- the workflow control: open this workflow, or switch ---------- */
  /* Two targets in one row, the way the reference shell does it: the name opens
     the active workflow's Dashboard, the caret opens the picker. They are two
     buttons rather than one, because "go home" and "go somewhere else" are two
     different intentions and one click should never guess between them. */
  .wf { display:flex; margin:0 var(--space-5); border:1px solid var(--line-2); background:var(--bg); }
  .wf__main { flex:1; min-width:0; display:flex; align-items:center; gap:var(--space-3);
              padding:var(--space-2) var(--space-3); text-decoration:none; color:var(--ink);
              font-weight:var(--weight-semibold); font-size:14px; }
  .wf__main:hover { background:var(--mass); }
  .wf__main svg, .picker svg { width:17px; height:17px; flex:none; color:var(--spot); }
  .wf__caret { flex:none; width:36px; background:none; border:0; border-left:1px solid var(--line-2);
               color:var(--dim); cursor:pointer; display:grid; place-items:center; }
  .wf__caret:hover, .wf__caret[aria-expanded="true"] { background:var(--mass); color:var(--ink); }
  .wf__caret svg { width:14px; height:14px; transition:transform var(--duration-fast) var(--ease); }
  .wf__caret[aria-expanded="true"] svg { transform:rotate(180deg); }

  /* The picker lives at the end of <body>, outside the rail: a menu inside a
     scrolling sidebar is clipped by it. Its position is computed and clamped to
     the viewport, so it never opens off-screen on a phone or a short window. */
  .picker { position:fixed; z-index:40; min-width:220px; max-width:calc(100vw - 16px);
            background:var(--panel); border:1px solid var(--line-2); padding:var(--space-1) 0;
            box-shadow:var(--shadow-lg); overflow-y:auto; }
  .picker[hidden] { display:none; }
  .picker__label { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-caps);
                   text-transform:uppercase; color:var(--faint); padding:var(--space-2) var(--space-4) var(--space-1); margin:0; }
  .picker button { display:flex; align-items:center; gap:var(--space-3); width:100%; text-align:left;
                   background:none; border:0; color:var(--dim); font:inherit; font-size:14px;
                   padding:var(--space-2) var(--space-4); cursor:pointer; }
  .picker button:hover, .picker button:focus-visible { background:var(--mass); color:var(--ink); box-shadow:none; outline:none; }
  .picker button:focus-visible { box-shadow:inset 2px 0 0 var(--spot); } /* inset: the picker scrolls, so an outset ring would clip */
  .picker button[aria-checked="true"] { color:var(--ink); }
  .picker button span { flex:1; }
  .picker .check { width:15px; height:15px; color:var(--spot); visibility:hidden; }
  .picker button[aria-checked="true"] .check { visibility:visible; }

  /* ---------- the sidebar navigation ---------- */
  nav.side__nav { display:flex; flex-direction:column; gap:var(--space-4); }
  nav.side__nav a { display:flex; align-items:center; gap:var(--space-3); text-decoration:none;
                    padding:var(--space-2) var(--space-5); color:var(--dim); font-size:14px;
                    border-left:2px solid transparent;
                    transition:color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease); }
  nav.side__nav a:hover { color:var(--ink); background:var(--mass); }
  nav.side__nav a[aria-current="page"] { color:var(--ink); border-left-color:var(--spot); background:var(--mass); }
  /* --faint misses 4.5:1 on --mass in ink */
  nav.side__nav a[aria-current="page"] i, nav.side__nav a:hover i { color:var(--dim); }
  nav.side__nav a svg { width:17px; height:17px; flex:none; color:var(--faint); }
  nav.side__nav a[aria-current="page"] svg { color:var(--spot); }
  nav.side__nav a i { margin-left:auto; font-style:normal; font-family:var(--font-mono);
                      font-size:11px; color:var(--faint); }
  nav.side__nav a i.hot { color:var(--warning); }
  .nav__toggle { display:flex; align-items:center; gap:var(--space-2); width:100%; background:none; border:0;
                 font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
                 text-transform:uppercase; color:var(--faint); padding:var(--space-1) var(--space-5);
                 cursor:pointer; text-align:left; }
  .nav__toggle:hover { color:var(--ink); }
  .nav__toggle svg { width:12px; height:12px; transition:transform var(--duration-fast) var(--ease); }
  .nav__toggle[aria-expanded="false"] svg { transform:rotate(-90deg); }
  .nav__items[hidden] { display:none; }

  /* ---------- phone chrome: a top bar and a drawer ---------- */
  .topbar { display:none; }
  .scrim { display:none; }
  .side__close { display:none; }
  .crumb { display:flex; gap:var(--space-2); flex-wrap:wrap; }
  .crumb span + span::before { content:'·'; margin-right:var(--space-2); color:var(--faint); }
  .crumb .dim { color:var(--faint); }

  .foot { margin-top:var(--space-12); padding-top:var(--space-5); border-top:1px solid var(--line);
          color:var(--faint); font-size:var(--text-xs); display:flex; gap:var(--space-4);
          justify-content:space-between; flex-wrap:wrap; }
  .foot code { font-family:var(--font-mono); word-break:break-all; color:var(--dim); }
  #dials { font-family:var(--font-mono); }

  select, input[type="search"], input[type="text"] {
    font:inherit; font-size:13.5px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line-2); border-radius:0; padding:7px var(--space-3); width:100%;
  }
  select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible,
  [tabindex]:focus-visible { outline:none; box-shadow:var(--ring); }

  .ground { display:flex; border:1px solid var(--line-2); width:max-content; }
  .ground button { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; background:none; border:0; color:var(--faint);
    padding:5px 10px; cursor:pointer; line-height:1.4;
    transition:background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease); }
  .ground button:hover { color:var(--ink); }
  .ground button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }

  /* ---------- the column ---------- */
  main { padding:var(--space-8) var(--space-10) var(--space-20); min-width:0; }
  .inner { max-width:1080px; }
  .stack > * + * { margin-top:var(--space-6); }

  .page__eyebrow { font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
                   text-transform:uppercase; color:var(--spot); margin:0 0 var(--space-2); }
  .page__title { font-family:var(--font-disp); font-size:var(--text-2xl); font-weight:var(--weight-extra);
                 letter-spacing:var(--tracking-tight); line-height:1.1; margin:0; }
  .page__sub { color:var(--dim); margin:var(--space-2) 0 0; max-width:70ch; }
  .page__back { display:inline-block; font-family:var(--font-mono); font-size:11.5px;
                letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
                text-decoration:none; margin:0 0 var(--space-3); cursor:pointer; }
  .page__back:hover { color:var(--spot); }

  .card { background:var(--panel); border:1px solid var(--line); padding:var(--space-6); }
  .card--flush { padding:0; }
  .head { margin-bottom:var(--space-4); }
  .head h2 { font-size:var(--text-md); font-weight:var(--weight-bold); letter-spacing:-.01em; margin:0; }
  .head p { color:var(--faint); font-size:13.5px; margin:2px 0 0; max-width:78ch; overflow-wrap:anywhere; }
  .head--row { display:flex; align-items:flex-end; gap:var(--space-4); flex-wrap:wrap; }
  .head--row > :first-child { flex:1 1 180px; }

  .g2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-6); }
  .g3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-6); }
  .g2 > *, .g3 > * { margin-top:0 !important; }

  /* ---------- stat tiles ---------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--space-4); }
  .tile { background:var(--panel); border:1px solid var(--line-2); padding:var(--space-4) var(--space-5); }
  .tile b { display:block; font-size:10.5px; font-family:var(--font-mono); font-weight:var(--weight-medium);
            letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--faint); }
  .tile strong { display:block; font-family:var(--font-disp); font-size:var(--text-2xl);
                 font-weight:var(--weight-extra); letter-spacing:-.03em; line-height:1.15;
                 margin-top:var(--space-2); }
  .tile span { display:block; font-size:12.5px; color:var(--dim); margin-top:2px; }
  .tile.is-good strong { color:var(--spot); }
  .tile.is-warn strong { color:var(--warning); }

  /* ---------- tables ---------- */
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-family:var(--font-mono); font-size:10.5px; font-weight:var(--weight-medium);
       letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--faint);
       padding:0 var(--space-4) var(--space-3) 0; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  td { padding:var(--space-3) var(--space-4) var(--space-3) 0; border-bottom:1px solid var(--line);
       vertical-align:top; }
  th:last-child, td:last-child { padding-right:0; }
  tbody tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:var(--mass); }
  /* Rows are keyboard-operable: `tabindex` is set on render, Enter and Space
     open them. A row you can only reach with a mouse is a dead end. */
  tr.row:focus-visible { outline:2px solid var(--spot); outline-offset:-2px; }
  .tile[data-go] { cursor:pointer; transition:border-color var(--duration-fast) var(--ease); }
  .tile[data-go]:hover { border-color:var(--spot); }
  .tile[data-go]:focus-visible { outline:none; box-shadow:var(--ring); }
  td .title { font-weight:var(--weight-semibold); color:var(--ink); }
  .slug { font-family:var(--font-mono); font-size:11.5px; color:var(--faint); word-break:break-word; }
  .ctx { color:var(--dim); }
  .empty { color:var(--faint); padding:var(--space-5) 0; font-size:13.5px; }

  /* A bar above the view, not a banner over it: the reader is mid-page and the
     notice must not move what they are reading. */
  .stale { display:block; width:100%; text-align:left; margin-bottom:var(--space-6);
           font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em;
           text-transform:uppercase; background:none; border:1px solid var(--spot);
           color:var(--spot); padding:7px 10px; cursor:pointer;
           transition:background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease); }
  .stale:hover { background:var(--spot); color:var(--spot-ink); }
  .stale[hidden] { display:none; }

  /* ---------- controls ---------- */
  .filters { display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:center;
             margin-bottom:var(--space-4); }
  .filters .grow { flex:1 1 220px; min-width:180px; }
  .filters select { width:auto; }
  .chips { display:flex; gap:var(--space-2); flex-wrap:wrap; }
  .chip { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
          background:none; border:1px solid var(--line-2); color:var(--faint); padding:5px 10px;
          cursor:pointer; transition:color var(--duration-fast) var(--ease),
          border-color var(--duration-fast) var(--ease); }
  .chip:hover { color:var(--ink); }
  .chip[aria-pressed="true"] { color:var(--spot); border-color:var(--spot); }

  .pager { display:flex; align-items:center; gap:var(--space-3); margin-top:var(--space-4);
           padding-top:var(--space-4); border-top:1px solid var(--line); }
  .pager__count { font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .pager__btns { margin-left:auto; display:flex; gap:var(--space-2); }
  .pager button { font-family:var(--font-mono); font-size:12px; background:none;
                  border:1px solid var(--line-2); color:var(--dim); padding:4px 10px; cursor:pointer;
                  min-width:32px; }
  .pager button:hover:not(:disabled) { color:var(--ink); border-color:var(--spot); }
  .pager button[aria-current="true"] { color:var(--spot-ink); background:var(--spot); border-color:var(--spot); }
  .pager button:disabled { opacity:.4; cursor:default; }

  /* ---------- meters, pills, badges ---------- */
  .meter { height:6px; background:var(--mass); overflow:hidden; min-width:72px; }
  .meter > i { display:block; height:100%; background:var(--spot); }
  .meter.warn > i { background:var(--warning); }
  .meter.mute > i { background:var(--faint-2); }

  .pill { display:inline-block; font-family:var(--font-mono); font-size:11px; padding:2px 8px;
          border-radius:0; background:var(--mass); color:var(--dim); white-space:nowrap; }
  .pill.ok { background:var(--spot-soft); color:var(--spot); }
  .pill.due { color:var(--warning); }
  .pill.new { color:var(--dim); }

  .grade { font-family:var(--font-mono); font-size:11.5px; padding:2px 8px; white-space:nowrap;
           background:var(--mass); color:var(--dim); }
  .grade.pass { background:var(--spot-soft); color:var(--spot); }
  .grade.miss { color:var(--warning); }

  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:var(--space-4) var(--space-5); }
  .kv div b { display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
              text-transform:uppercase; color:var(--faint); font-weight:var(--weight-medium); }
  .kv div span { display:block; font-size:15px; color:var(--ink); margin-top:2px; }

  /* ---------- segmented bar (a whole, split) ---------- */
  .seg { display:flex; height:10px; background:var(--mass); overflow:hidden; }
  .seg > span { display:block; height:100%; }
  .seg__key { display:flex; gap:var(--space-5); flex-wrap:wrap; margin-top:var(--space-3);
              font-size:12.5px; color:var(--dim); }
  .seg__key b { display:inline-block; width:9px; height:9px; margin-right:var(--space-2); border:1px solid var(--line-2); }

  /* ---------- charts ---------- */
  .legend { display:flex; gap:var(--space-5); font-size:12.5px; color:var(--dim);
            margin-bottom:var(--space-4); flex-wrap:wrap; }
  .legend b { display:inline-block; width:9px; height:9px; margin-right:var(--space-2); }
  .chart { position:relative; }
  .chart svg { display:block; width:100%; overflow:visible; }
  .gridline { stroke:var(--line-2); stroke-width:1; }
  .axis { font-family:var(--font-mono); font-size:10px; fill:var(--faint); }
  .hit { fill:transparent; cursor:pointer; }
  .hit:hover + .col, .hit:focus-visible + .col { opacity:.72; }
  .hit:focus-visible { outline:2px solid var(--spot); outline-offset:-2px; }
  .tip { position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
         background:var(--bg); border:1px solid var(--line-2); color:var(--ink);
         padding:var(--space-3); font-size:var(--text-xs); line-height:1.6; white-space:nowrap;
         transition:opacity var(--duration-fast) var(--ease); z-index:3; }
  .tip.on { opacity:1; }
  .tip .r { display:flex; justify-content:space-between; gap:var(--space-4); }
  .heat { overflow-x:auto; }
  .heat svg { width:auto; max-width:none; }
  .heat rect.cell { stroke:var(--panel); stroke-width:1; }

  /* ---------- question & answer records ---------- */
  .qa { border:1px solid var(--line); padding:var(--space-4) var(--space-5); }
  .qa + .qa { margin-top:var(--space-3); }
  .qa__meta { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap;
              font-family:var(--font-mono); font-size:11px; color:var(--faint); }
  .qa__meta .sp { margin-left:auto; }
  .qa__q { margin:var(--space-3) 0 0; color:var(--ink); }
  .qa__opts { list-style:none; margin:var(--space-3) 0 0; padding:0; display:grid; gap:var(--space-1); }
  .qa__opts li { font-size:13px; color:var(--dim); padding-left:var(--space-5); position:relative; }
  .qa__opts li::before { content:'○'; position:absolute; left:0; color:var(--faint-2); }
  .qa__opts li.picked { color:var(--ink); }
  .qa__opts li.picked::before { content:'●'; color:var(--spot); }
  .qa__f { margin:var(--space-3) 0 0; padding-left:var(--space-4); border-left:2px solid var(--spot);
           color:var(--dim); font-size:13.5px; }
  .qa__a { margin:var(--space-3) 0 0; font-size:13.5px; color:var(--dim); }
  .qa__a b { color:var(--faint); font-weight:var(--weight-semibold); }

  .ladder { display:flex; gap:var(--space-2); }
  .ladder div { flex:1; border:1px solid var(--line-2); padding:var(--space-2) var(--space-3);
                font-family:var(--font-mono); font-size:11.5px; color:var(--faint); text-align:center;
                text-transform:uppercase; letter-spacing:.08em; }
  .ladder div.on { border-color:var(--spot); color:var(--spot-ink); background:var(--spot); }
  .ladder div.done { border-color:var(--spot); color:var(--spot); }

  .checks { display:grid; gap:var(--space-3); margin-top:var(--space-4); }
  .checks div { display:flex; align-items:center; gap:var(--space-3); font-size:13.5px; color:var(--dim); }
  .checks .mark-ok { color:var(--spot); }
  .checks .mark-no { color:var(--faint); }
  .checks .bar { flex:1; }

  .list { display:grid; gap:var(--space-3); }
  .link { color:var(--spot); text-decoration:none; cursor:pointer; }
  .link:hover { text-decoration:underline; }
  .tags { display:flex; gap:var(--space-2); flex-wrap:wrap; }

  /* ---------- memory ---------- */
  /* A superseded or deleted row stays in the list — it is the audit trail — but
     it must never read as current, so the title is struck through as well as
     labelled. Colour alone is not a marker. */
  tr.gone .title, .gone-title { text-decoration:line-through; color:var(--faint); }
  .pill.gone { color:var(--faint); border:1px dashed var(--line-2); background:none; }
  /* A <details> is the drill-down: native, keyboard-operable, no JS. */
  summary.qa__meta { cursor:pointer; list-style:none; }
  summary.qa__meta::-webkit-details-marker { display:none; }
  summary.qa__meta::before { content:'▸'; color:var(--faint); }
  details[open] > summary.qa__meta::before { content:'▾'; color:var(--spot); }
  summary.qa__meta:focus-visible { outline:none; box-shadow:var(--ring); }

  /* ---------- memory timeline ----------
     One line per entry on a vertical rule. A row is a <details>: the title is
     the summary, the snippet and the link to the full entry open under it, so
     the list stays scannable and detail costs one click. */
  .counts { margin:var(--space-2) 0 0; font-family:var(--font-mono); font-size:12px; color:var(--faint); }
  .counts .warn { color:var(--warning); }
  .tl { list-style:none; margin:var(--space-4) 0 0; padding:0; position:relative; }
  .tl::before { content:''; position:absolute; left:67px; top:8px; bottom:8px; width:1px; background:var(--line-2); }
  .tl-day { display:flex; align-items:baseline; gap:var(--space-3); padding:var(--space-5) 0 var(--space-2) 88px; position:relative; }
  .tl-day:first-child { padding-top:0; }
  .tl-day::before { content:''; position:absolute; left:62px; top:calc(var(--space-5) + 6px); width:11px; height:11px; background:var(--line-2); }
  .tl-day:first-child::before { top:6px; }
  .tl-day h2 { margin:0; font-family:var(--font-disp); font-size:var(--text-lg); font-weight:var(--weight-bold); letter-spacing:-.02em; }
  .tl-day span { font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--spot); }
  .tl-gap { padding:var(--space-2) 0 var(--space-2) 88px; font-family:var(--font-mono); font-size:11.5px; color:var(--faint); }
  .tl-item > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:52px minmax(0,1fr) auto;
                       align-items:center; column-gap:36px; min-height:44px; padding-right:var(--space-3); position:relative; }
  .tl-item > summary::-webkit-details-marker { display:none; }
  .tl-item > summary::before { content:''; position:absolute; left:62px; top:50%; width:11px; height:11px; margin-top:-5.5px;
                               box-sizing:border-box; border-radius:50%; border:2px solid var(--dim); background:var(--bg); }
  .tl-item > summary:hover { background:var(--panel); }
  .tl-item > summary:focus-visible { outline:none; box-shadow:var(--ring); }
  .tl-item[open] > summary::before { background:var(--spot); border-color:var(--spot); }
  .tl-item[open] { background:var(--panel); }
  .tl-time { font-family:var(--font-mono); font-size:12px; color:var(--faint); text-align:right; font-variant-numeric:tabular-nums; }
  .tl-title { font-size:15px; font-weight:var(--weight-medium); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-item[open] > summary .tl-title { font-weight:var(--weight-semibold); }
  .tl-type { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  .tl-body { padding:0 var(--space-4) var(--space-4) 88px; display:grid; gap:var(--space-3); }
  .tl-body p { margin:0; color:var(--dim); font-size:13.5px; max-width:72ch; overflow-wrap:anywhere; }
  .tl-meta { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2) var(--space-4);
             font-family:var(--font-mono); font-size:11.5px; color:var(--faint); }
  .tl-meta .link { margin-left:auto; font-family:var(--font-body); font-size:13.5px; font-weight:var(--weight-semibold); }
  .tl-item.gone .tl-title { text-decoration:line-through; color:var(--faint); }
  /* A session is a larger ring; its observations fold under it. */
  .tl-session > summary::before { width:15px; height:15px; margin-top:-7.5px; left:60px; border-color:var(--spot); }
  .tl-session[open] > summary::before { background:var(--bg); }
  .tl-session[open] { background:none; }
  .tl-session > summary .tl-title { font-weight:var(--weight-medium); }
  .tl-session > summary .tl-type { color:var(--spot); }
  .tl-kids { list-style:none; margin:0; padding:0; }
  .tl-kids .tl-item > summary::before { left:64px; width:7px; height:7px; margin-top:-3.5px; border-color:var(--faint-2); }
  .tl-kids .tl-item[open] > summary::before { border-color:var(--spot); }
  .tl-kids .tl-title { font-size:14px; padding-left:var(--space-6); }
  .tl-kids .tl-body { padding-left:112px; }
  .tl-kids .tl-gap { padding-left:112px; }
  #mwhen, #mtype, #mtag { max-width:100%; min-width:0; }
  /* Narrow: the title gets the width and two lines; the type drops under it. */
  @media (max-width:560px) {
    .tl-item > summary { grid-template-columns:52px minmax(0,1fr); padding:var(--space-2) var(--space-2) var(--space-2) 0; }
    .tl-item > summary::before { top:calc(var(--space-2) + 11px); margin-top:0; }
    .tl-session > summary::before { top:calc(var(--space-2) + 9px); }
    .tl-kids .tl-item > summary::before { top:calc(var(--space-2) + 13px); }
    .tl-time { align-self:start; padding-top:3px; }
    .tl-title { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .tl-type { grid-column:2; margin-top:2px; }
    .tl-kids .tl-type { padding-left:var(--space-6); }
    .tl-body, .tl-kids .tl-body, .tl-kids .tl-gap { padding-left:88px; }
  }
  .raw { font-family:var(--font-mono); font-size:12px; line-height:1.55; white-space:pre-wrap;
         word-break:break-word; color:var(--dim); background:var(--mass); padding:var(--space-3);
         max-height:320px; overflow:auto; margin:var(--space-3) 0 0; }
  .facts { margin:var(--space-3) 0 0; padding-left:var(--space-5); color:var(--dim); font-size:13.5px; }
  .facts li + li { margin-top:var(--space-1); }

  .banner { border:1px solid var(--line-2); border-left:2px solid var(--spot); padding:var(--space-4) var(--space-5);
            background:var(--panel); display:flex; gap:var(--space-4); align-items:center; flex-wrap:wrap; }
  .banner p { margin:0; color:var(--dim); font-size:13.5px; }
  .banner code { background:var(--mass); padding:2px 6px; font-size:12.5px; color:var(--ink); }

  /* ---------- progressive disclosure ----------
     The timeline's rule, applied to every page: the answer first, one line per
     item, and detail one click away. A page opens with its title, one mono line
     of counts, the action that is waiting (if any) and the lists; explanations
     and secondary cards are folded and remembered open once the reader opens
     them. Every fold is a native <details>: keyboard-operable, no JS to open. */
  .about { margin-top:var(--space-2); }
  .about > summary, .fold > summary { list-style:none; cursor:pointer; }
  .about > summary::-webkit-details-marker, .fold > summary::-webkit-details-marker { display:none; }
  .about > summary { display:inline-flex; align-items:center; gap:var(--space-2); min-height:32px;
                     font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .about > summary:hover { color:var(--spot); }
  .about > summary::before, .fold > summary::before { content:'▸'; color:var(--faint); flex:none; }
  .about[open] > summary::before, .fold[open] > summary::before { content:'▾'; color:var(--spot); }
  .about > summary:focus-visible, .fold > summary:focus-visible { outline:none; box-shadow:var(--ring); }
  .about p { margin:var(--space-2) 0 0; color:var(--dim); font-size:13.5px; max-width:72ch; }
  .fold { padding:0; }
  /* Consecutive folds read as one list, not a column of separate cards. */
  .stack > .fold + .fold { margin-top:var(--space-2); }
  .fold > summary { display:flex; align-items:center; gap:var(--space-3); min-height:56px; padding:var(--space-4) var(--space-6); }
  .fold > summary:hover { background:var(--mass); }
  .fold > summary h2 { margin:0; font-size:var(--text-md); font-weight:var(--weight-bold); letter-spacing:-.01em; }
  .fold > summary .fold__peek { margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--faint);
                                text-align:right; overflow-wrap:anywhere; }
  .fold > summary .fold__peek.warn { color:var(--warning); }
  .fold__body { padding:0 var(--space-6) var(--space-6); }
  .fold__body > .hint { color:var(--faint); font-size:13.5px; margin:0 0 var(--space-4); max-width:78ch; overflow-wrap:anywhere; }

  /* The one next step, when there is one. Not a banner per fact. */
  .next { display:flex; align-items:center; gap:var(--space-4); flex-wrap:wrap; padding:var(--space-4) var(--space-5);
          border:1px solid var(--line-2); border-left:2px solid var(--warning); background:var(--panel); }
  .next p { margin:0; flex:1 1 280px; color:var(--dim); font-size:13.5px; }
  .next p strong { color:var(--ink); }
  .next code { background:var(--mass); padding:2px 6px; font-size:12.5px; color:var(--ink); }
  .next.ok { border-left-color:var(--spot); }

  /* One line per item: a name, a quiet second line, and one number on the right. */
  .lines { list-style:none; margin:0; padding:0; }
  .lines > li { display:flex; align-items:center; gap:var(--space-4); min-height:48px; padding:var(--space-2) var(--space-2);
                margin:0 calc(-1 * var(--space-2)); border-bottom:1px solid var(--line); }
  .lines > li:last-child { border-bottom:none; }
  .lines > li[data-go] { cursor:pointer; }
  .lines > li[data-go]:hover { background:var(--mass); }
  .lines > li[data-go]:focus-visible { outline:none; box-shadow:var(--ring); }
  .lines .ln__main { flex:1; min-width:0; }
  .lines .ln__t { display:block; color:var(--ink); font-weight:var(--weight-medium); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lines .ln__s { display:block; font-family:var(--font-mono); font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lines .ln__v { flex:none; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .lines .ln__v .meter { width:88px; margin-top:4px; }
  .more { margin:var(--space-4) 0 0; font-size:13.5px; }

  /* A question answered: one line — concept, grade, the question — and it opens
     to the options and the feedback. */
  details.qa > summary { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  details.qa > summary .qa__line { flex:1 1 240px; min-width:0; font-family:var(--font-body); font-size:13.5px; color:var(--ink);
                                   letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  details.qa[open] > summary .qa__line { white-space:normal; }

  @media (max-width:1080px) {
    .g3 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  /* At 900 and below the rail becomes a drawer: the same navigation, the same
     workflow control and the same controls, behind a menu button. It is a modal
     while open (focus is held inside it, the page behind is inert) and it is
     `inert` while closed, so a hidden drawer is never in the Tab order. */
  @media (max-width:900px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .topbar { display:flex; align-items:center; gap:var(--space-3); position:sticky; top:0; z-index:20;
              background:var(--panel); border-bottom:1px solid var(--line-2); padding:var(--space-2) var(--space-4); }
    .topbar__menu { background:none; border:1px solid var(--line-2); color:var(--ink); width:38px; height:38px;
                    display:grid; place-items:center; cursor:pointer; flex:none; }
    .topbar__menu svg { width:18px; height:18px; }
    .topbar__brand { display:flex; align-items:center; gap:var(--space-2); text-decoration:none; color:inherit;
                     font-family:var(--font-disp); font-weight:var(--weight-extra); letter-spacing:var(--tracking-tight); }
    .topbar__brand .mark { width:26px; height:26px; }
    .topbar__wf { margin-left:auto; font-family:var(--font-mono); font-size:10.5px; letter-spacing:var(--tracking-caps);
                  text-transform:uppercase; color:var(--spot); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .side { position:fixed; top:0; bottom:0; left:0; z-index:30; width:min(300px, 86vw); height:100vh; height:100dvh;
            border-right:1px solid var(--line-2); visibility:hidden; left:-100%;
            transition:left var(--duration-base) var(--ease), visibility 0s linear var(--duration-base); }
    .side.is-open { visibility:visible; left:0; transition:left var(--duration-base) var(--ease); }
    .side__close { display:grid; place-items:center; position:absolute; top:var(--space-4); right:var(--space-4);
                   background:none; border:1px solid var(--line-2); color:var(--ink); width:34px; height:34px; cursor:pointer; }
    .side__close svg { width:16px; height:16px; }
    .side__brand { padding-right:64px; }
    .scrim { position:fixed; inset:0; z-index:25; background:color-mix(in srgb, var(--bg) 70%, transparent); }
    .scrim.is-open { display:block; }
    body.drawer-open { overflow:hidden; }
    main { padding:var(--space-6) var(--space-5) var(--space-16); }
    .g2, .g3 { grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width:560px) {
    /* The check rows carry a label, a bar and a sentence; on a phone the
       sentence goes under the bar rather than off the edge of the screen. */
    .checks div { flex-wrap:wrap; }
    .checks .bar { flex:1 1 120px; }
    .checks .slug { white-space:normal !important; flex-basis:100%; }
    main { padding:var(--space-5) var(--space-4) var(--space-16); }
    .stats { grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
    .tile strong { font-size:var(--text-xl); }
    .card { padding:var(--space-5) var(--space-4); }
    .fold { padding:0; }
    .fold > summary { padding:var(--space-3) var(--space-4); flex-wrap:wrap; }
    .fold > summary .fold__peek { margin-left:0; flex-basis:100%; text-align:left; padding-left:var(--space-5); }
    .fold__body { padding:0 var(--space-4) var(--space-5); }
    .lines .ln__v .meter { width:56px; }
    .page__title { font-size:var(--text-xl); }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    * { transition:none !important; animation:none !important; }
  }
</style>

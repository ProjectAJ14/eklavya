name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        # The npm package is mcp/; the repository root is the Claude Code plugin.
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1, newer than the npm
      # bundled with Node 20. Pin to the 11.x major: `npm@latest` moved to 12.x
      # (needs Node 22+) and aborts on this runner.
      - run: npm install -g npm@11

      - run: npm ci

      # Guards the release, not just the code. The suite asserts that
      # .claude-plugin/plugin.json, mcp/package.json and the launcher's
      # PINNED_VERSION all carry the same version — a release that bumps only
      # some of them would ship a plugin that runs a different server than it
      # claims to.
      - run: npm test

      - name: Check the tag matches the version being published
        working-directory: .
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi

      # If this step fails with a provenance error, the cause is repository
      # visibility: drop `--provenance` and publish without an attestation, or
      # make the repository public. Everything else here works either way.
      - run: npm publish --provenance --access public

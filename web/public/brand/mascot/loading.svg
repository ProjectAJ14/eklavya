<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 4 214 214" width="200" height="200" class="ek-mascot ek-mascot--loading" data-expression="cool" data-variant="loading" role="img"><style>:root {/* ---------- MASCOT IDENTITY ----------
     Archer Cloak artwork keeps its approved identity across both grounds.
     UI chrome continues to use the surface, text and accent roles below. */
  --mascot-coral: #ef9875;
  --mascot-coral-dark: #c96d51;
  --mascot-highlight: #ffc8a6;
  --mascot-cloak: #0E6E66;
  --mascot-cloak-dark: #07403C;
  --mascot-thread: #C4EDE4;
  --mascot-ink: #302c2a;
  --mascot-metal: #5b7c73;
  --mascot-wood: #bc9569;
  --mascot-wood-dark: #74583f;
  --mascot-string: #EAE7E1;
  --mascot-shadow: #26262a;
  /* ---------- END MASCOT IDENTITY ---------- */}/* Identity colours and UI surfaces use Eklavya's semantic tokens. */
eklavya-mascot { display:inline-flex; flex-shrink:0; vertical-align:middle; line-height:0; }
.ek-mascot { display:block; overflow:visible; flex-shrink:0; }
.ek-mascot[data-variant="face"] { overflow:hidden; }
.ek-mascot__face path:not([fill]) { fill:none; }
.ek-companion { display:flex;align-items:center;gap:12px;color:var(--dim);font:13px/1.5 var(--font-body); }
.ek-companion--hero { margin-bottom:16px; }
.ek-companion--hero b { display:block;color:var(--ink);font-weight:600; }
.ek-mascot-message { display:flex;align-items:center;gap:16px;padding:16px 0; }
.ek-mascot-message p {margin:0}
/* Secondary loader: draws and releases an arrow over 2.8 s. */
.ek-mascot--draw .ek-mascot__character { animation:ek-breathe 2.8s ease-in-out infinite; transform-origin:95px 185px; }
.ek-mascot--draw .ek-mascot__arrow { animation:ek-release 2.8s cubic-bezier(.3,0,.3,1) infinite; }
.ek-mascot--draw .ek-mascot__string { animation:ek-draw 2.8s ease-in-out infinite; transform-origin:157px 125px; }
.ek-mascot--draw .ek-mascot__ripple { animation:ek-hit 2.8s ease-out infinite; transform-origin:196px 128px; opacity:0; }
@keyframes ek-breathe { 0%,100% {transform:translateY(0)} 35%,55% {transform:translateY(-3px) rotate(-1deg)} }
@keyframes ek-release { 0%,12% {transform:translateX(0);opacity:1} 40%,52% {transform:translateX(-10px);opacity:1} 68% {transform:translateX(22px);opacity:0} 69%,85% {transform:translateX(0);opacity:0} 100% {transform:translateX(0);opacity:1} }
@keyframes ek-draw { 0%,100% {transform:scaleX(1)} 40%,52% {transform:scaleX(1.11)} 60% {transform:scaleX(.08)} 68% {transform:scaleX(1)} }
@keyframes ek-hit { 0%,60%,100% {opacity:0;transform:scale(.4)} 68% {opacity:.8;transform:scale(.7)} 88% {opacity:0;transform:scale(1.7)} }
/* Loader: walking toward the viewer, a 1.2 s stride (two steps). Ground rungs recede on an ease-out, as perspective slows them near the horizon. */
.ek-mascot--loading .ek-mascot__walker { animation:ek-sway 1.2s ease-in-out infinite; transform-origin:95px 185px; }
.ek-mascot--loading .ek-mascot__torso { animation:ek-bob .6s ease-in-out infinite; }
.ek-mascot--loading .ek-mascot__leg, .ek-mascot--loading .ek-mascot__hand { animation:ek-step 1.2s ease-in-out infinite; }
.ek-mascot--loading .ek-mascot__leg--r, .ek-mascot--loading .ek-mascot__hand--arrow { animation-delay:-.6s; }
.ek-mascot--loading .ek-mascot__shadow { animation:ek-shadow .6s ease-in-out infinite; transform-origin:95px 186px; }
.ek-mascot--loading .ek-mascot__rung { animation:ek-recede 1.2s cubic-bezier(.15,.6,.4,1) infinite; transform-origin:95px 162px; }
.ek-mascot--loading .ek-mascot__rung:nth-child(3) { animation-delay:-.3s; }
.ek-mascot--loading .ek-mascot__rung:nth-child(4) { animation-delay:-.6s; }
.ek-mascot--loading .ek-mascot__rung:nth-child(5) { animation-delay:-.9s; }
@keyframes ek-sway { 0%,100% {transform:rotate(-1.5deg)} 50% {transform:rotate(1.5deg)} }
@keyframes ek-bob { 0%,100% {transform:translateY(1px)} 50% {transform:translateY(-3px)} }
@keyframes ek-step { 0%,50%,100% {transform:translateY(0)} 25% {transform:translateY(-6px)} }
@keyframes ek-shadow { 0%,100% {transform:scaleX(1)} 50% {transform:scaleX(.92)} }
@keyframes ek-recede { 0% {transform:translateY(56px) scaleX(1);opacity:0} 10% {opacity:1} 85% {opacity:1} 100% {transform:translateY(0) scaleX(.4);opacity:0} }
@media (prefers-reduced-motion:reduce) { .ek-mascot * {animation:none !important;transition:none !important} }

.ek-companion--rail { padding:12px 20px; text-decoration:none; }
.ek-mascot-message > :last-child { min-width:0; overflow-wrap:break-word; }
.ek-mascot-status { display:inline-flex; align-items:center; gap:6px; }
</style><title>Eklavya walking toward you</title><g class="ek-mascot__ground" fill="none" stroke="var(--mascot-metal)" stroke-width="2" stroke-linecap="round" opacity=".5">
      <path d="M-20 218 63 162m147 56-83-56"/>
      <path class="ek-mascot__rung" d="M-10 162h210" transform="matrix(1 0 0 1 0 56)"/><path class="ek-mascot__rung" d="M-10 162h210" transform="matrix(0.75 0 0 1 23.75 34)"/><path class="ek-mascot__rung" d="M-10 162h210" transform="matrix(0.55 0 0 1 42.75 17)"/><path class="ek-mascot__rung" d="M-10 162h210" transform="matrix(0.42 0 0 1 55.1 6)"/>
    </g>
    <ellipse class="ek-mascot__shadow" cx="95" cy="186" rx="40" ry="5" fill="var(--mascot-shadow)"/>
    <g class="ek-mascot__walker">
      <path class="ek-mascot__leg ek-mascot__leg--l" d="M65 157v23q0 8 16 6l4-28Z" fill="var(--mascot-coral)"/>
      <path class="ek-mascot__leg ek-mascot__leg--r" d="M106 158l1 23q2 8 17 4v-29Z" fill="var(--mascot-coral)"/>
      <g class="ek-mascot__torso">
        <path d="M51 124Q29 137 34 168l23-8 17-27m59-9q26 8 21 39l-24-7-17-22" fill="var(--mascot-cloak-dark)"/>
        <path d="M58 122q35-16 72 0l8 46q-19 9-42 1-23 7-43-1Z" fill="var(--mascot-cloak)"/>
        <path d="M96 127v40m-31-22q29 9 64 0" fill="none" stroke="var(--mascot-cloak-dark)" stroke-width="3"/>
        <g class="ek-mascot__hand ek-mascot__hand--arrow" stroke-linecap="round" stroke-linejoin="round">
          <path d="M60 118 47 141" stroke="var(--mascot-cloak)" stroke-width="13"/>
          <path d="M46 104v72" stroke="var(--mascot-wood-dark)" stroke-width="3"/>
          <path d="M41 174l5 11 5-11Z" fill="var(--mascot-thread)" stroke="var(--mascot-wood)" stroke-width="1.5"/>
          <path d="M46 106l-6-9 1 11 5 5 5-5 1-11Z" fill="var(--mascot-thread)"/>
          <rect x="39" y="136" width="15" height="15" rx="7" fill="var(--mascot-coral)"/>
        </g>
        <g class="ek-mascot__hand ek-mascot__hand--bow" fill="none" stroke-linecap="round">
          <path d="M130 118 151 141" stroke="var(--mascot-cloak)" stroke-width="13"/>
          <path d="M152 90v104" stroke="var(--mascot-string)" stroke-width="1.5"/>
          <path d="M152 90q16 52 0 104" stroke="var(--mascot-wood-dark)" stroke-width="7"/>
          <path d="M153 90q13 52 0 104" stroke="var(--mascot-wood)" stroke-width="3.5"/>
          <rect x="151" y="135" width="15" height="15" rx="7" fill="var(--mascot-coral)"/>
        </g>
        <path d="M52 109q42-22 86 0l-9 29-32-14-32 14Z" fill="var(--mascot-cloak)" stroke="var(--mascot-cloak-dark)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M57 114l37 10m42-10-39 10" fill="none" stroke="var(--mascot-thread)" stroke-width="2"/>
        <path d="M54 148h80v11H54Z" fill="var(--mascot-ink)"/>
        <rect x="87" y="146" width="17" height="15" rx="3" fill="var(--mascot-metal)"/><rect x="92" y="150" width="7" height="7" rx="1" fill="var(--mascot-ink)"/>
        <g class="ek-mascot__head">
        <path d="M46 43h18V29h19V18h23v12h20v14h17v19h8v29h-8v16q0 12-16 15H62q-18-3-18-17V91h-9V63h11Z" fill="var(--mascot-coral)" stroke="var(--mascot-coral-dark)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M48 45h18V32h18V21h19" fill="none" stroke="var(--mascot-highlight)" stroke-width="3" stroke-linejoin="round"/>
        <g class="ek-mascot__face" fill="var(--mascot-ink)" stroke="var(--mascot-ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M60 65h19v7q0 9-9 9h-1q-9 0-9-9Zm46 0h19v7q0 9-9 9h-1q-9 0-9-9Z" fill="var(--mascot-ink)"/><path d="M56 66h72M86 92q9 3 15-4"/></g>
      </g>
        <circle cx="96" cy="125" r="7" fill="var(--mascot-metal)"/><circle cx="94" cy="123" r="2" fill="var(--mascot-thread)"/>
      </g>
    </g></svg>